name: v38 post-release exact-prefix audit (review only)

on:
  pull_request:
    branches: [main]
    paths:
      - "review/v38_postrelease_code_20261111.tar.gz"
      - "review/v38_postrelease_targets_20261111.tar.gz"
      - ".github/workflows/v38-postrelease-prefix-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v38-postrelease-prefix-audit-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Extract and verify immutable review bundle
        run: |
          set -euo pipefail
          echo "0c90df7643f4370a0560afe687d525db74068c946f19d73cc48af76c4e498a7e  review/v38_postrelease_code_20261111.tar.gz" | sha256sum -c -
          echo "873bcdae20690c70271e97bdc7a15beb30f84cf7c6aba17501cd528990e9390c  review/v38_postrelease_targets_20261111.tar.gz" | sha256sum -c -
          echo "1e1970912baadfed28aac92f1c2b2df20c25b120dbdb041e4ae58a1c32b15f1e  review/v38_postrelease_docs_20261111.tar.gz" | sha256sum -c -
          tar -xzf review/v38_postrelease_code_20261111.tar.gz -C .
          tar -xzf review/v38_postrelease_targets_20261111.tar.gz -C .
          tar -xzf review/v38_postrelease_docs_20261111.tar.gz -C .
          sha256sum -c .github/scripts/SHA256SUMS
          sha256sum -c review/SHA256SUMS

      - name: Pin collector to exact published v38 manifest
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          p = Path(".github/scripts/collect_v38_postrelease_prefix_audit.py.gz")
          source = gzip.decompress(p.read_bytes())
          old = b"b6a288815699c6aee2c64f45838d322be23bb0a7342b7e2c58ebf5bd6f1593a0"
          new = b"33c8cc46547aef8c961422480afd0273adbab7cfbd0487797b3049444da9efb6"
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one stale manifest pin, found {source.count(old)}")
          patched = source.replace(old, new)
          p.write_bytes(gzip.compress(patched, compresslevel=9, mtime=0))
          check = gzip.decompress(p.read_bytes())
          if new not in check or old in check:
              raise SystemExit("Manifest pin replacement did not verify")
          print("Patched runtime collector MANIFEST_SHA256 to the independently measured release digest.")
          PY

      - name: Compile and test audit parser
        run: |
          python3 -m py_compile .github/scripts/collect_v38_postrelease_prefix_audit.py .github/scripts/test_v38_postrelease_prefix_audit.py
          python3 -m unittest discover -s .github/scripts -p 'test_v38_postrelease_prefix_audit.py' -v

      - name: Capture current exact-NLRI and same-source RPKI evidence for 56 priority prefixes
        run: |
          python3 .github/scripts/collect_v38_postrelease_prefix_audit.py \
            --targets review/v38_postrelease_prefix_targets_20261111.tsv \
            --out-dir v38-postrelease-audit \
            --timeout 18 \
            --routeviews-interval 1.1 \
            --ripe-workers 4

      - name: Separate empty origin sets and compare RPKI snapshot views
        run: |
          python3 - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path
          root = Path("v38-postrelease-audit")
          tsv = root / "v38_postrelease_prefix_review.tsv"
          with tsv.open(encoding="utf-8", newline="") as fh:
              reader = csv.DictReader(fh, delimiter="\t")
              fields = list(reader.fieldnames)
              rows = list(reader)
          new_fields = [
              "RPKI_VIEW_COMPARISON",
              "ROUTE_LEVEL_RPKI_ONLY_ORIGINS",
              "TIMESTAMPED_VRP_ONLY_ORIGINS",
              "RPKI_STATUS_CONFLICTS",
          ]
          for name in new_fields:
              if name not in fields:
                  fields.append(name)
          origin_counts = Counter()
          empty_prefixes = []
          rpki_view_counts = Counter()
          rpki_conflicts = []
          for row in rows:
              sources = [
                  set(json.loads(row["ROUTEVIEWS_EXACT_ORIGINS"])),
                  set(json.loads(row["RIPESTAT_EXACT_ORIGINS"])),
                  set(json.loads(row["RIPESTAT_LG_ORIGINS"])),
              ]
              current = row["EXACT_ORIGIN_CROSS_SOURCE"]
              if current not in {"PARTIAL_OR_FAILED_EVIDENCE", "UNUSABLE_RESPONSE_SHAPE"}:
                  if not any(sources):
                      current = "NO_EXACT_NLRI_IN_ANY_SOURCE"
                      empty_prefixes.append(row["PREFIX"])
                  elif all(sources[0] and item == sources[0] for item in sources[1:]):
                      current = "ALL_THREE_SOURCE_SETS_AGREE"
                  else:
                      current = "EXACT_ORIGIN_SET_DISAGREEMENT"
                  row["EXACT_ORIGIN_CROSS_SOURCE"] = current
              origin_counts[current] += 1

              route_level = json.loads(row["ROUTEVIEWS_ROUTE_LEVEL_RPKI"])
              vrp_snapshot = json.loads(row["ROUTEVIEWS_VRP_ORIGIN_STATES"])
              conflicts = {
                  asn: {"near_realtime_route_level": route_level[asn], "two_hour_aggregate_snapshot": vrp_snapshot[asn]}
                  for asn in sorted(set(route_level) & set(vrp_snapshot))
                  if route_level[asn] != vrp_snapshot[asn]
              }
              route_only = sorted(set(route_level) - set(vrp_snapshot))
              vrp_only = sorted(set(vrp_snapshot) - set(route_level))
              if not route_level:
                  comparison = "NO_EXACT_ROUTE"
              elif not vrp_snapshot:
                  comparison = "NO_TIMESTAMPED_VRP_STATE"
              elif conflicts:
                  comparison = "SAME_ORIGIN_STATUS_DIFFERS"
              elif route_only or vrp_only:
                  comparison = "ORIGIN_SET_DIFFERS"
              else:
                  comparison = "ORIGIN_SETS_AND_STATES_MATCH"
              row["RPKI_VIEW_COMPARISON"] = comparison
              row["ROUTE_LEVEL_RPKI_ONLY_ORIGINS"] = json.dumps(route_only, separators=(",", ":"))
              row["TIMESTAMPED_VRP_ONLY_ORIGINS"] = json.dumps(vrp_only, separators=(",", ":"))
              row["RPKI_STATUS_CONFLICTS"] = json.dumps(conflicts, sort_keys=True, separators=(",", ":"))
              rpki_view_counts[comparison] += 1
              if conflicts:
                  rpki_conflicts.append({"prefix": row["PREFIX"], "conflicts": conflicts})

          with tsv.open("w", encoding="utf-8", newline="") as fh:
              writer = csv.DictWriter(fh, fieldnames=fields, delimiter="\t", lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)

          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["exact_origin_agreement_counts"] = dict(sorted(origin_counts.items()))
          manifest["empty_exact_origin_prefixes"] = sorted(empty_prefixes)
          manifest["route_level_vs_vrp_snapshot_counts"] = dict(sorted(rpki_view_counts.items()))
          manifest["route_level_vs_vrp_status_conflicts"] = rpki_conflicts
          manifest["rpki_view_semantics"] = {
              "near_realtime_route_level": "RouteViews /prefix exact-NLRI response; includes rpki_state and rpki_roas for each observed origin",
              "two_hour_aggregate": "RouteViews /rpki prefix snapshot from frr.routeviews.org full-table view; refreshed every two hours",
              "interpretation": "These are separate collection views and snapshots. Preserve their timestamps and report differences rather than collapsing them into one state."
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("Exact-origin comparison counts:", json.dumps(manifest["exact_origin_agreement_counts"], sort_keys=True))
          print("Empty exact-NLRI prefixes:", json.dumps(manifest["empty_exact_origin_prefixes"]))
          print("Route-level vs two-hour VRP comparison:", json.dumps(manifest["route_level_vs_vrp_snapshot_counts"], sort_keys=True))
          print("Same-origin RPKI status conflicts:", json.dumps(rpki_conflicts, sort_keys=True))
          if len(rows) != 56 or any(row["STATUS"] != "REVIEW" for row in rows):
              raise SystemExit("Review-only row invariant failed during post-processing")
          PY

      - name: Validate review-only output and immutable release binding
        run: |
          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root = Path('v38-postrelease-audit')
          manifest = json.loads((root / 'manifest.json').read_text())
          rows = list(csv.DictReader((root / 'v38_postrelease_prefix_review.tsv').open(encoding='utf-8', newline=''), delimiter='\t'))
          capture = json.loads((root / 'exact_nlri_capture.json').read_text())
          if manifest['target_prefixes'] != 56 or len(rows) != 56:
              raise SystemExit('Expected 56 review rows')
          if manifest['archived_invalid_prefixes'] != 19:
              raise SystemExit('Expected 19 archived-invalid rows')
          if not manifest['all_rows_remain_review'] or not all(r['STATUS'] == 'REVIEW' for r in rows):
              raise SystemExit('Review-only status invariant failed')
          if manifest['classification_or_production_changes'] is not False:
              raise SystemExit('The audit must not change classifications')
          if capture['release_commit'] != '3033248ea54cb298bafded25ddcd2805d5f0e7ac':
              raise SystemExit('Unexpected release commit')
          if capture['release_geoip_sha256'] != 'e757c1b7b8ca5b47c11117784eb78ab25c59fbadc0f6ab55229827560db76800':
              raise SystemExit('Unexpected release GeoIP hash')
          if capture['request_count'] != 224 or len(capture['summary']) != 224:
              raise SystemExit('Expected four evidence requests for each of 56 prefixes')
          for path in root.iterdir():
              if path.is_file():
                  print(f'{path.name}\t{path.stat().st_size}\t{hashlib.sha256(path.read_bytes()).hexdigest()}')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload audit-only evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v38-postrelease-prefix-audit
          path: v38-postrelease-audit/
          if-no-files-found: error
          retention-days: 30
