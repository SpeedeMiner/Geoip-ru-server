              "both set differences are retained in the TSV",
          ):
              if required not in stats:
                  raise SystemExit(f"Triage statistics missing safety statement: {required}")
          validation = base / "README_validation.txt"
          with validation.open("a", encoding="utf-8") as stream:
              stream.write("\nPriority-prefix triage\n")
              stream.write(stats)
