            --stats prefix-audit/priority-prefix-evidence/priority_prefix_triage_stats.txt

          python3 - <<'PY'
          import csv
          from pathlib import Path

          base = Path("prefix-audit/priority-prefix-evidence")
          def read_tsv(path):
              with path.open(encoding="utf-8", newline="") as stream:
                  return list(csv.DictReader(
                      (line for line in stream if not line.startswith("#")), delimiter="\t"
                  ))

          priority = read_tsv(base / "priority_prefixes.tsv")
