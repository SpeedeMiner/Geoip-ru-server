          expected_moas = sum(row["GLOBAL_BGP_MOAS"] == "yes" for row in priority)
          expected_company_only = sum(row["INCLUSION_BASIS"] == "COMPANY_ASN_ONLY" for row in priority)
          if not priority or len(priority) != len(priority_prefixes):
