                  f"{len(priority_prefixes)} priority vs {len(triage_prefixes)} triage"
              )
          if any(row["STATUS"] != "REVIEW" for row in triage):
              raise SystemExit("Triage table contains a non-REVIEW row")
          stats_path = base / "priority_prefix_triage_stats.txt"
          stats = stats_path.read_text(encoding="utf-8")
          for required in (
              f"Priority prefixes: {len(priority)}",
              f"Exact-MOAS prefixes: {expected_moas}",
              f"Company-only prefixes: {expected_company_only}",
              "All rows: STATUS=REVIEW",
              "no row is automatically approved",
              "both set differences are retained in the TSV",
          ):
              if required not in stats:
                  raise SystemExit(f"Triage statistics missing safety statement: {required}")
