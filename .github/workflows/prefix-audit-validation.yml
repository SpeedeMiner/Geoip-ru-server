          python3 .github/scripts/build_priority_prefix_triage.py \
            --evidence-dir prefix-audit/priority-prefix-evidence \
            --output prefix-audit/priority-prefix-evidence/priority_prefix_triage.tsv \
            --stats prefix-audit/priority-prefix-evidence/priority_prefix_triage_stats.txt

          python3 - <<'PY'
          import csv
          from pathlib import Path

          base = Path("prefix-audit/priority-prefix-evidence")
          def read_tsv(path):
              with path.open(encoding="utf-8", newline="") as stream:
                  return list(csv.DictReader(
                      (line for line in stream if not line.startswith("#")), delimiter="\t"
                  ))

          priority = read_tsv(base / "priority_prefixes.tsv")
          triage = read_tsv(base / "priority_prefix_triage.tsv")
          if len(priority) != 56 or len(triage) != 56:
              raise SystemExit(f"Expected 56 priority/triage rows, got {len(priority)}/{len(triage)}")
          if {row["PREFIX"] for row in priority} != {row["PREFIX"] for row in triage}:
              raise SystemExit("Triage prefix inventory differs from the priority queue")
          if any(row["STATUS"] != "REVIEW" for row in triage):
              raise SystemExit("Triage table contains a non-REVIEW row")
