name: v41 historical hard-block provenance evidence audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-v41-legacy-hard.yml"
      - ".github/scripts/audit_v41_legacy_hard_evidence.py"
      - ".github/scripts/test_audit_v41_legacy_hard_evidence.py"
      - ".github/scripts/audit_v41_service_hard_overrides.py"
      - ".github/scripts/test_audit_v41_service_hard_overrides.py"
      - ".github/scripts/audit_v41_named_service_attribution.py"
      - ".github/scripts/test_audit_v41_named_service_attribution.py"
      - ".github/scripts/audit_v41_current_hard_ris.py"
      - ".github/scripts/test_audit_v41_current_hard_ris.py"
      - ".github/scripts/audit_v41_shadow_hard_shared.py"
      - ".github/scripts/test_audit_v41_shadow_hard_shared.py"
      - ".github/scripts/audit_v41_shared_hard_guard.py"
      - ".github/scripts/test_audit_v41_shared_hard_guard.py"
      - ".github/data/v41_observed_shared_service_hard_exceptions.tsv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate audit logic and policy examples
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_audit_v41_*' -v
      - name: Download independently pinned published sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-inputs
          download() {
            local repo="$1" tag="$2" file="$3" expected="$4" dest="$5"
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              --silent --show-error \
              "https://github.com/${repo}/releases/download/${tag}/${file}" \
              --output "audit-inputs/${dest}"
            printf '%s  %s\n' "$expected" "audit-inputs/${dest}" | sha256sum --check --status
          }
          download SpeedeMiner/Geoip-ru-light latest-geoip-client-v34 geoip_RU.dat \
            33c91a0b703c03580810af807d0062c5179c55e2c7ed4a1cc34a79c63e99a6dd v34.dat
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 geoip_RU.dat \
            534d4d80caf45df54566105d8c1930e0aaa293718891f46537256da63b56bf1f v41.dat
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 geoip_RU_blocked_ip_exact_and_legacy_hard.txt \
            eadac2b1599ac493c633554634223a1449af02e5a8199db92ee58917adcabe62 hard.txt
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 geoip_RU_blocked_ipresolve_resolver_only.txt \
            d23934d53b5e991fa524e8ee7f2582e8c543da4998c426aee12df514e4349860 resolver.txt
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 geoip_RU_v41_blocked_ip_exclusions.txt \
            3a0f95c250230188d3d62a6ce0d8e6950e9a11f612e799c715ac72844b2dfa7b effective.txt
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 geoip_RU_company_asn_core_bgp_prefixes.txt \
            9b2600280adb4a3622b3cb795225732b773a178455a302e4118c2263fc1b9b87 core.txt
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 geoip_RU_shared_infrastructure_bgp_prefixes.txt \
            3aec8bb38f847b5e41417793e708459737ce6270f457adae0410193be2319e73 shared.txt
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 kyoresuas-ru-standard-ipv4.txt \
            867de404e49974c1711ba199dfd82537927a6812fbe28d0db8f46bcbecb3cecc kyoresuas-v4.txt
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 kyoresuas-ru-standard-ipv6.txt \
            ccad517f54f8d33989fb9303f8c1489308d0b091e0b3e6cc7b6df81b8e0b8d23 kyoresuas-v6.txt
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 kyoresuas-services.json \
            97a9ad1438bfc4f501664e57f7ee294d42c10954744fc5c9ed925b602061ba9d kyoresuas.json
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 w1zardz-ru-ipv4.txt \
            eb4e35274762494acbee235e75413046ddb9e83d838095ecd71e647648cd7e7c w1zardz.txt
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 hxehex-ipwhitelist.txt \
            8a3814375701decd9787718fc3ae769187aa4714e2a1b8fa5d96f94ad2bd4da0 hxehex.txt
          download SpeedeMiner/Geoip-ru-server latest-geoip-client-v41 escapingworm-operator-cidr.txt \
            cb36cdc22acd9d177a1402b074f5180f1a3286cd856fb6aba7afbf6333a795e4 escapingworm.txt
      - name: Produce review-only evidence queues
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_legacy_hard_evidence.py \
            --hard audit-inputs/hard.txt --resolver audit-inputs/resolver.txt \
            --effective audit-inputs/effective.txt \
            --v34 audit-inputs/v34.dat --v41 audit-inputs/v41.dat \
            --output-dir audit-output
          test -s audit-output/legacy_hard_review.tsv
          test -s audit-output/priority_v34_losses.tsv
          test -s audit-output/legacy_hard_override_review.tsv
          test -s audit-output/summary.json
          cat audit-output/summary.json
      - name: Cross-check service protection evidence for nine hard overrides
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_service_hard_overrides.py \
            --overrides audit-output/legacy_hard_override_review.tsv \
            --core-prefixes audit-inputs/core.txt \
            --shared-prefixes audit-inputs/shared.txt \
            --kyoresuas-v4 audit-inputs/kyoresuas-v4.txt \
            --kyoresuas-v6 audit-inputs/kyoresuas-v6.txt \
            --kyoresuas-services audit-inputs/kyoresuas.json \
            --w1zardz audit-inputs/w1zardz.txt \
            --hxehex-ip audit-inputs/hxehex.txt \
            --escapingworm audit-inputs/escapingworm.txt \
            --output-dir audit-output
          test -s audit-output/nine_legacy_hard_service_overrides.tsv
          test -s audit-output/nine_override_summary.json
          cat audit-output/nine_override_summary.json
      - name: Warn on untracked SHARED broad-service hard exceptions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_shared_hard_guard.py \
            --hard audit-inputs/hard.txt \
            --effective audit-inputs/effective.txt \
            --v41 audit-inputs/v41.dat \
            --baseline .github/data/v41_observed_shared_service_hard_exceptions.tsv \
            --core-prefixes audit-inputs/core.txt \
            --shared-prefixes audit-inputs/shared.txt \
            --kyoresuas-v4 audit-inputs/kyoresuas-v4.txt \
            --kyoresuas-v6 audit-inputs/kyoresuas-v6.txt \
            --kyoresuas-services audit-inputs/kyoresuas.json \
            --w1zardz audit-inputs/w1zardz.txt \
            --hxehex-ip audit-inputs/hxehex.txt \
            --escapingworm audit-inputs/escapingworm.txt \
            --output-dir audit-output
          test -s audit-output/all_shared_service_hard_overrides.tsv
          test -s audit-output/shared_service_hard_guard_summary.json
          cat audit-output/shared_service_hard_guard_summary.json
      - name: Attribute hard overrides to named service-catalog claims
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_named_service_attribution.py \
            --overrides audit-output/all_shared_service_hard_overrides.tsv \
            --services audit-inputs/kyoresuas.json \
            --output-dir audit-output
          test -s audit-output/hard_service_named_attribution.tsv
          test -s audit-output/hard_service_named_attribution_summary.json
          cat audit-output/hard_service_named_attribution_summary.json
      - name: Add independent RIPE RIS origin observations for current-source hard hosts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_current_hard_ris.py \
            --attribution audit-output/hard_service_named_attribution.tsv \
            --output-dir audit-output
          test -s audit-output/hard_current_ris_bgp_evidence.tsv
          test -s audit-output/hard_current_ris_bgp_summary.json
          cat audit-output/hard_current_ris_bgp_summary.json
      - name: Measure exact shadow impact of hard-wins within SHARED, no routing changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_shadow_hard_shared.py \
            --v41 audit-inputs/v41.dat \
            --hard audit-inputs/hard.txt \
            --shared audit-inputs/shared.txt \
            --effective audit-inputs/effective.txt \
            --output-dir audit-output
          test -s audit-output/shadow_shared_hard_summary.json
          cat audit-output/shadow_shared_hard_summary.json
      - name: Upload audit evidence without changing routing or release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v41-legacy-hard-evidence-20261112
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
