name: Post-release v41 SHARED hard-block override monitor

on:
  workflow_run:
    workflows:
      - "Build Unified GeoIP DIRECT RU+BY+KZ CLIENT v41"
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-v41-production-hard.yml"
      - ".github/scripts/download_v41_published_audit_inputs.py"
      - ".github/scripts/test_download_v41_published_audit_inputs.py"
      - ".github/scripts/audit_v41_shared_hard_guard.py"
      - ".github/scripts/audit_v41_named_service_attribution.py"
      - ".github/scripts/audit_v41_shadow_hard_shared.py"
      - ".github/scripts/audit_v41_all_hard_override_classes.py"
      - ".github/scripts/audit_v41_hard_evidence_matrix.py"
      - ".github/scripts/test_audit_v41_hard_evidence_matrix.py"
      - ".github/scripts/test_audit_v41_all_hard_override_classes.py"
      - ".github/scripts/audit_v41_all_hard_regressions.py"
      - ".github/scripts/test_audit_v41_all_hard_regressions.py"
      - ".github/data/v41_observed_all_hard_override_classes.json"
      - ".github/scripts/test_audit_v41_shadow_hard_shared.py"
      - ".github/scripts/test_audit_v41_named_service_attribution.py"
      - ".github/data/v41_observed_shared_service_hard_exceptions.tsv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout read-only audit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test input-integrity and regression guard logic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_download_v41_published_audit_inputs.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_audit_v41_shared_hard_guard.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_audit_v41_named_service_attribution.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_audit_v41_shadow_hard_shared.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_audit_v41_all_hard_override_classes.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_audit_v41_hard_evidence_matrix.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_audit_v41_all_hard_regressions.py' -v
      - name: Verify current published v41 artifacts against manifest hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/download_v41_published_audit_inputs.py --output-dir audit-inputs
      - name: Emit policy warnings for SHARED hard hosts overridden by service masks
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_shared_hard_guard.py \
            --hard audit-inputs/hard.txt \
            --effective audit-inputs/effective.txt \
            --v41 audit-inputs/v41.dat \
            --baseline .github/data/v41_observed_shared_service_hard_exceptions.tsv \
            --core-prefixes audit-inputs/core.txt \
            --shared-prefixes audit-inputs/shared.txt \
            --kyoresuas-v4 audit-inputs/kyoresuas-v4.txt \
            --kyoresuas-v6 audit-inputs/kyoresuas-v6.txt \
            --kyoresuas-services audit-inputs/kyoresuas.json \
            --w1zardz audit-inputs/w1zardz.txt \
            --hxehex-ip audit-inputs/hxehex.txt \
            --escapingworm audit-inputs/escapingworm.txt \
            --output-dir audit-output
          cat audit-output/shared_service_hard_guard_summary.json
          echo "### SHARED service hard-block exceptions" >> "$GITHUB_STEP_SUMMARY"
          echo 'No production routing files are modified. Observation baseline is not an approval allowlist.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full current-source cases in the uploaded TSV report.' >> "$GITHUB_STEP_SUMMARY"
      - name: Attribute hard overrides to named service-catalog claims
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_named_service_attribution.py \
            --overrides audit-output/all_shared_service_hard_overrides.tsv \
            --services audit-inputs/kyoresuas.json \
            --output-dir audit-output
          test -s audit-output/hard_service_named_attribution.tsv
          test -s audit-output/hard_service_named_attribution_summary.json
          cat audit-output/hard_service_named_attribution_summary.json
      - name: Measure exact shadow impact of hard-wins within SHARED, no routing changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_shadow_hard_shared.py \
            --v41 audit-inputs/v41.dat \
            --hard audit-inputs/hard.txt \
            --shared audit-inputs/shared.txt \
            --effective audit-inputs/effective.txt \
            --output-dir audit-output
          test -s audit-output/shadow_shared_hard_summary.json
          cat audit-output/shadow_shared_hard_summary.json
      - name: Audit full hard override distribution across CORE SHARED and OTHER
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_all_hard_override_classes.py \
            --hard audit-inputs/hard.txt \
            --effective audit-inputs/effective.txt \
            --v41 audit-inputs/v41.dat \
            --core-prefixes audit-inputs/core.txt \
            --shared-prefixes audit-inputs/shared.txt \
            --kyoresuas-v4 audit-inputs/kyoresuas-v4.txt \
            --kyoresuas-v6 audit-inputs/kyoresuas-v6.txt \
            --kyoresuas-services audit-inputs/kyoresuas.json \
            --w1zardz audit-inputs/w1zardz.txt \
            --hxehex-ip audit-inputs/hxehex.txt \
            --escapingworm audit-inputs/escapingworm.txt \
            --output-dir audit-output
          test -s audit-output/all_hard_override_classes_summary.json
          cat audit-output/all_hard_override_classes_summary.json
      - name: Warn if hard-exception addresses change in ANY ASN class
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_all_hard_regressions.py \
            --baseline .github/data/v41_observed_all_hard_override_classes.json \
            --summary audit-output/all_hard_override_classes_summary.json \
            --cidr-dir audit-output \
            --output-dir audit-output
          test -s audit-output/hard_override_class_regressions.json
          cat audit-output/hard_override_class_regressions.json
      - name: Build complete address-specific hard exception evidence matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit_v41_hard_evidence_matrix.py \
            --cidr-dir audit-output --hard audit-inputs/hard.txt \
            --core-prefixes audit-inputs/core.txt \
            --shared-prefixes audit-inputs/shared.txt \
            --kyoresuas-v4 audit-inputs/kyoresuas-v4.txt \
            --kyoresuas-v6 audit-inputs/kyoresuas-v6.txt \
            --kyoresuas-services audit-inputs/kyoresuas.json \
            --w1zardz audit-inputs/w1zardz.txt \
            --hxehex-ip audit-inputs/hxehex.txt \
            --escapingworm audit-inputs/escapingworm.txt \
            --output-dir audit-output
          test -s audit-output/all_153_hard_exceptions_evidence_matrix.tsv
          test -s audit-output/all_hard_evidence_matrix_summary.json
          cat audit-output/all_hard_evidence_matrix_summary.json
      - name: Upload post-release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v41-post-release-shared-hard-override-review
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
