name: Pull request validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-and-yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        # v7.0.0; keep the PR test runtime pinned like the production workflow.
        uses: actions/setup-go@0778a10ce47b5d450cf60fb94fafad4330008a35
        with:
          go-version: "1.26.10"

      - name: Compile Python scripts
        run: python3 -m compileall -q .github/scripts

      - name: Run Python unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Extract embedded Go builder and run Go unit tests
        shell: bash
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local
          export GO_TEST_DIR="$RUNNER_TEMP/geoip-builder-pr-ci"
          mkdir -p "$GO_TEST_DIR"

          python3 - <<'PY'
          import pathlib
          import textwrap

          source = pathlib.Path(".github/workflows/blank.yml").read_text(encoding="utf-8").splitlines()
          required = {"main.go", "main_test.go"}
          found = {}
          for index, line in enumerate(source):
              for filename in required:
                  if line.strip() == f"cat > geoip-builder/{filename} <<'GO'":
                      body = []
                      for candidate in source[index + 1:]:
                          if candidate.strip() == "GO":
                              break
                          body.append(candidate)
                      else:
                          raise SystemExit(f"Unterminated Go heredoc for {filename}")
                      if filename in found:
                          raise SystemExit(f"Duplicate Go heredoc for {filename}")
                      found[filename] = textwrap.dedent("\n".join(body)) + "\n"
          missing = required - set(found)
          if missing:
              raise SystemExit("Missing embedded Go sources: " + ", ".join(sorted(missing)))
          output = pathlib.Path(__import__("os").environ["GO_TEST_DIR"])
          for filename, contents in found.items():
              (output / filename).write_text(contents, encoding="utf-8")
          print(f"Extracted {len(found)} embedded Go source files into {output}")
          PY

          cd "$GO_TEST_DIR"
          gofmt -w main.go main_test.go
          go mod init geoip-builder-pr-ci
          go get github.com/v2fly/v2ray-core/v5/app/router/routercommon@v5.56.0
          go get google.golang.org/protobuf@v1.36.12
          go mod tidy
          go test ./...
          go test -run=^$ -fuzz=FuzzCIDRPrefixCanonicalAndBounded -fuzztime=2s

      - name: Compile inline Python heredocs in the main workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import textwrap

          source = pathlib.Path('.github/workflows/blank.yml').read_text(encoding='utf-8')
          pattern = re.compile(r"(?ms)^[ \t]*python3[^\n]*<<'PY'[ \t]*\n(.*?)(?=^[ \t]*PY[ \t]*$)")
          blocks = pattern.findall(source)
          if not blocks:
              raise SystemExit('No inline Python heredocs found in blank.yml')
          for index, block in enumerate(blocks, 1):
              compile(textwrap.dedent(block), f'blank.yml:inline-python-{index}', 'exec')
          print(f'Compiled {len(blocks)} inline Python heredocs from blank.yml')
          PY

      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0)); puts "Workflow YAML parsed successfully"' .github/workflows/blank.yml

      - name: Run full review smoke tests and the embedded production quality validator
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-geoip-client-v35"
          workdir="$(mktemp -d)"
          generated="$workdir/generated"
          mkdir -p "$generated"
          trap 'rm -rf "$workdir"' EXIT

          for file in \
            geoip_RU_company_asns.txt \
            geoip_RU_company_asn_manifest.tsv \
            geoip_RU_BY_KZ_asn_bgp_prefixes.txt \
            geoip_RU_input_provenance.tsv \
            geoip_RU_registered_asns.txt \
            geoip_BY_KZ_registered_asns.txt \
            geoip_RU.dat \
            geoip_RU_rir_stats.txt \
            geoip_RU_source_counts.txt \
            geoip_RU_quality_report.txt \
            geoip_RU_additional_provenance.tsv \
            geoip_RU_category_audit.tsv \
            geoip_RU_blocked_ip_exclusions.txt \
            geoip_RU_blocked_review_candidates.tsv \
            geoip_RU_blocked_source_stats.txt \
            geoip_RU_blocked_sources.sha256; do
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 2 \
              "$base/$file" -o "$workdir/$file"
            test -s "$workdir/$file"
          done

          # The historical release branch contains the ASN manifest; older v35
          # GitHub Releases omitted it due a filename mismatch fixed in blank.yml.
          rawbase="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/release"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "$rawbase/geoip_RU_BY_KZ_asn_manifest.txt" \
            -o "$workdir/geoip_RU_BY_KZ_asn_manifest.txt"
          test -s "$workdir/geoip_RU_BY_KZ_asn_manifest.txt"

          bgp_url="$(awk -F '\t' '$2 == "as-ip-blocks.tar.gz" && $6 == "downloaded" {print $3}' \
            "$workdir/geoip_RU_input_provenance.tsv")"
          [[ "$bgp_url" == https://* ]] || { echo "::error::Invalid BGP archive URL in provenance manifest"; exit 1; }
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "$bgp_url" -o "$workdir/as-ip-blocks.tar.gz"
          test -s "$workdir/as-ip-blocks.tar.gz"

          # Re-run the exact ASN/BGP extractor embedded in blank.yml using the
          # release's exact RIR registries, allowlist, and ipverse archive.
          python3 - "$workdir/extract_ru_asn_prefixes.py" <<'PY'
          import pathlib
          import sys
          import textwrap

          source = pathlib.Path(".github/workflows/blank.yml").read_text(encoding="utf-8").splitlines()
          needle = "cat > extract_ru_asn_prefixes.py <<'PY'"
          matches = [i for i, line in enumerate(source) if line.strip() == needle]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one embedded ASN extractor, found {len(matches)}")
          body = []
          for line in source[matches[0] + 1:]:
              if line.strip() == "PY":
                  break
              body.append(line)
          else:
              raise SystemExit("Embedded ASN extractor heredoc is unterminated")
          pathlib.Path(sys.argv[1]).write_text(textwrap.dedent("\n".join(body)) + "\n", encoding="utf-8")
          print("Extracted production ASN/BGP extractor from blank.yml")
          PY

          python3 "$workdir/extract_ru_asn_prefixes.py" --self-test \
            "$workdir/geoip_RU_company_asns.txt" \
            "$workdir/geoip_BY_KZ_registered_asns.txt"

          cp "$workdir/geoip_RU_company_asn_manifest.tsv" "$workdir/company_manifest.published.tsv"
          cp "$workdir/geoip_RU_BY_KZ_asn_bgp_prefixes.txt" "$workdir/selected_prefixes.published.txt"
          cp "$workdir/geoip_RU_BY_KZ_asn_manifest.txt" "$workdir/asn_manifest.published.txt"

          python3 "$workdir/extract_ru_asn_prefixes.py" \
            "$workdir/as-ip-blocks.tar.gz" \
            "$workdir/geoip_RU_registered_asns.txt" \
            "$workdir/geoip_BY_KZ_registered_asns.txt" \
            "$workdir/geoip_RU_company_asns.txt" \
            "$generated/geoip_RU_BY_KZ_asn_bgp_prefixes.txt" \
            "$generated/geoip_RU_global_bgp_prefixes.txt" \
            "$generated/geoip_RU_BY_KZ_asn_manifest.txt" \
            "$generated/geoip_RU_company_asn_manifest.tsv" \
            "$generated/geoip_RU_BY_KZ_asn_stats.txt"

          cmp "$generated/geoip_RU_BY_KZ_asn_bgp_prefixes.txt" "$workdir/selected_prefixes.published.txt"
          cmp "$generated/geoip_RU_BY_KZ_asn_manifest.txt" "$workdir/asn_manifest.published.txt"
          cmp "$generated/geoip_RU_company_asn_manifest.tsv" "$workdir/company_manifest.published.tsv"

          python3 .github/scripts/build_company_prefix_review.py \
            --company-asns "$workdir/geoip_RU_company_asns.txt" \
            --company-manifest "$generated/geoip_RU_company_asn_manifest.tsv" \
            --regional-prefixes "$generated/geoip_RU_BY_KZ_asn_bgp_prefixes.txt" \
            --input-provenance "$workdir/geoip_RU_input_provenance.tsv" \
            --bgp-archive "$workdir/as-ip-blocks.tar.gz" \
            --output "$generated/geoip_RU_company_prefix_review.tsv" \
            --stats "$generated/geoip_RU_company_prefix_review_stats.txt"

          python3 .github/scripts/build_selected_origin_prefix_review.py \
            --selected-prefixes "$generated/geoip_RU_BY_KZ_asn_bgp_prefixes.txt" \
            --company-asns "$workdir/geoip_RU_company_asns.txt" \
            --company-manifest "$generated/geoip_RU_company_asn_manifest.tsv" \
            --input-provenance "$workdir/geoip_RU_input_provenance.tsv" \
            --bgp-archive "$workdir/as-ip-blocks.tar.gz" \
            --output "$generated/geoip_RU_selected_origin_prefix_review.tsv" \
            --stats "$generated/geoip_RU_selected_origin_prefix_review_stats.txt"

          echo "Company-origin review:"
          cat "$generated/geoip_RU_company_prefix_review_stats.txt"
          echo "Complete selected-origin review:"
          cat "$generated/geoip_RU_selected_origin_prefix_review_stats.txt"
          echo "Company-only prefixes in this snapshot:"
          awk -F '\t' '$1 !~ /^#/ && $1 != "PREFIX" && $13 == "COMPANY_ASN_ONLY" { print $1 "\tcompany_asn=" $4 "\tselected_asn=" $9 "\tglobal_origins=" $14 "\tglobal_country=" $15 "\tMOAS=" $16 }' \
            "$generated/geoip_RU_company_prefix_review.tsv"

          # The published v35 quality report predates this PR's two new audit
          # sections. Append the review-only sections emitted by blank.yml so
          # the unchanged production validator can run against the published
          # .dat and its matching source/count artifacts.
          cp "$workdir/geoip_RU_quality_report.txt" "$generated/geoip_RU_quality_report.validation.txt"
          {
            printf '\n=== CURATED RUSSIAN-COMPANY ASN ALLOWLIST ===\n'
            printf 'Selection source: curated Russian-company ASN allowlist from %s.\n' "$workdir/geoip_RU_company_asns.txt"
            printf 'Inclusion policy: prefixes originated by allowlisted company ASNs are included regardless of ipverse countryCode.\n'
            printf 'Country metadata policy: ipverse countryCode is audit-only and is never an inclusion filter for allowlisted company-ASN origins.\n'
            printf 'Per-ASN evidence and prefix counts: geoip_RU_company_asn_manifest.tsv\n\n'
            cat "$generated/geoip_RU_BY_KZ_asn_stats.txt"
            printf '\n=== COMPANY PREFIX-LEVEL REVIEW QUEUE ===\n'
            printf 'Per-prefix report: geoip_RU_company_prefix_review.tsv\n'
            cat "$generated/geoip_RU_company_prefix_review_stats.txt"
            printf 'All company-origin prefixes remain REVIEW until prefix-level evidence is assessed; this report does not change the GeoIP output.\n'
            printf '\n=== SELECTED REGIONAL/COMPANY PREFIX-LEVEL REVIEW QUEUE ===\n'
            printf 'Per-prefix report: geoip_RU_selected_origin_prefix_review.tsv\n'
            cat "$generated/geoip_RU_selected_origin_prefix_review_stats.txt"
            printf 'All selected-origin prefixes remain REVIEW until prefix-level evidence is assessed; this report does not change the GeoIP output.\n'
          } >> "$generated/geoip_RU_quality_report.validation.txt"

          # Extract the exact independent inline validator from blank.yml.
          python3 - "$workdir/full_build_validator.py" <<'PY'
          import pathlib
          import sys
          import textwrap

          source = pathlib.Path(".github/workflows/blank.yml").read_text(encoding="utf-8").splitlines()
          matches = [
              i for i, line in enumerate(source)
              if line.strip().startswith('python3 - "$OUTPUT_FILE"') and "<<'PY'" in line
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one embedded build validator, found {len(matches)}")
          body = []
          for line in source[matches[0] + 1:]:
              if line.strip() == "PY":
                  break
              body.append(line)
          else:
              raise SystemExit("Embedded build validator heredoc is unterminated")
          pathlib.Path(sys.argv[1]).write_text(textwrap.dedent("\n".join(body)) + "\n", encoding="utf-8")
          print("Extracted independent production validator from blank.yml")
          PY

          # Execute the same production validator on the published GeoIP payload,
          # freshly re-extracted ASN/BGP manifests, freshly built review TSVs, and
          # published source/blocklist audit artifacts.
          python3 "$workdir/full_build_validator.py" \
            "$workdir/geoip_RU.dat" \
            "$generated/geoip_RU_BY_KZ_asn_manifest.txt" \
            "$generated/geoip_RU_company_asn_manifest.tsv" \
            "$generated/geoip_RU_BY_KZ_asn_stats.txt" \
            "$workdir/geoip_RU_rir_stats.txt" \
            "$workdir/geoip_RU_source_counts.txt" \
            "$generated/geoip_RU_quality_report.validation.txt" \
            "$workdir/geoip_RU_additional_provenance.tsv" \
            "$workdir/geoip_RU_category_audit.tsv" \
            "$workdir/geoip_BY_KZ_registered_asns.txt" \
            "$workdir/geoip_RU_blocked_ip_exclusions.txt" \
            "$workdir/geoip_RU_blocked_review_candidates.tsv" \
            "$workdir/geoip_RU_blocked_source_stats.txt" \
            "$workdir/geoip_RU_blocked_sources.sha256" \
            "$workdir/geoip_RU_input_provenance.tsv" \
            "$generated/geoip_RU_company_prefix_review.tsv" \
            "$generated/geoip_RU_company_prefix_review_stats.txt" \
            "$generated/geoip_RU_selected_origin_prefix_review.tsv" \
            "$generated/geoip_RU_selected_origin_prefix_review_stats.txt" \
            "$generated/geoip_RU_BY_KZ_asn_bgp_prefixes.txt"
