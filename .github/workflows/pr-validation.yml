name: Pull request validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-and-yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile Python scripts
        run: python3 -m compileall -q .github/scripts

      - name: Run Python unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0)); puts "Workflow YAML parsed successfully"' .github/workflows/blank.yml
