  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Checkout publication checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download validated build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: geoip-direct-rukzby-v41-candidate
          path: candidate

      - name: Verify independent publication bounds against prior release
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_geoip_sha256 }}
        run: bash ../.github/scripts/verify_v41_publication_candidate.sh

      - name: Publish release branch and versioned snapshot tag
        id: release_ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_VERSION: ${{ inputs.snapshot_version }}
        run: bash ../.github/scripts/publish_v41_git_refs.sh

      - name: Publish versioned GeoIP snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_TAG: ${{ steps.release_ref.outputs.snapshot }}
        run: bash ../.github/scripts/publish_v41_snapshot_release.sh

