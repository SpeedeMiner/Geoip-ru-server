name: Build Unified GeoIP DIRECT RU+BY+KZ CLIENT v41

on:
  workflow_dispatch:
    inputs:
      reviewed_geoip_sha256:
        description: SHA-256 of an independently reviewed candidate (only for relative delta overruns)
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/geoip-v41.yml"
      - ".github/scripts/build_rir_rukzby_prefixes.py"
      - ".github/scripts/build_v41_overlay.py"
      - ".github/scripts/extract_ru_asn_prefixes_v41.py"
      - ".github/scripts/geoip-v37-builder/**"
      - ".github/scripts/download_v41_locked_sources.py"
      - ".github/scripts/validate_v41_publication_bounds.py"
      - ".github/data/v41-source-lock.json"
      - ".github/scripts/build_company_asn_prefixes.py"
      - ".github/scripts/build_company_asn_prefix_classes_v41.py"
      - ".github/scripts/prepare_blocked_sources_v41.py"
      - ".github/scripts/validate_v41_overlay.py"
      - ".github/scripts/validate_v41_release_gate.py"
      - ".github/scripts/test_*.py"
      - ".github/data/geoip_RU_company_asns.tsv"
      - ".github/data/geoip_RU_company_asn_policy.tsv"
      - "docs/GEOIP_RU_V41_POLICY.md"
      - "docs/GEOIP_RU_V39_SOURCE_REGISTRY.tsv"
      - "docs/V39_PUBLIC_RKN_SOURCE_CROSSCHECK.md"
      - "docs/V41_EXECUTION_JOURNAL.md"
      - "geoip_RU_company_asns.txt"
      - ".github/scripts/build_v39_overlay.py"
  # v41 is the sole production publisher. v39 publishing is retired in this same PR.
  schedule:
    - cron: "45 3 * * *"
  push:
    branches:
      - main

concurrency:
  group: geoip-direct-ru-by-kz-v41-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HYDRA_INPUT: hydra-geoip.dat
  GRIMBIRD_INPUT: grimbird-geoip.dat
  DIGNE_INPUT: digne-geoip.dat
  DAVOYAN_INPUT: davoyan-geoip.dat
  KIRILL_INPUT: kirill-geoip.dat
  GOLUKON_INPUT: golukon-geoip.dat
  V2FLY_INPUT: v2fly-geoip.dat
  V2FLY_SHA_INPUT: v2fly-geoip.dat.sha256sum
  LOYALSOLDIER_RU_INPUT: loyalsoldier-ru.dat
  LOYALSOLDIER_BY_INPUT: loyalsoldier-by.dat
  LOYALSOLDIER_PRIVATE_INPUT: loyalsoldier-private.dat
  HXEHEX_INPUT: hxehex-cidrwhitelist.txt
  W1ZARDZ_INPUT: w1zardz-ru-ipv4.txt
  KY_STANDARD_V4_INPUT: kyoresuas-ru-standard-ipv4.txt
  KY_STANDARD_V6_INPUT: kyoresuas-ru-standard-ipv6.txt
  KY_SERVICES_INPUT: kyoresuas-services.json
  HXEHEX_IP_INPUT: hxehex-ipwhitelist.txt
  ESCAPINGWORM_OPERATOR_INPUT: escapingworm-operator-cidr.txt
  RU_ASN_REGISTRY: geoip_RU_registered_asns.txt
  BY_KZ_ASN_REGISTRY: geoip_BY_KZ_registered_asns.txt
  COMPANY_ASN_REGISTRY: geoip_RU_company_asns.txt
  COMPANY_ASN_POLICY: geoip_RU_company_asn_policy.tsv
  AFRINIC_STATS: delegated-afrinic-latest
  APNIC_STATS: delegated-apnic-latest
  ARIN_STATS: delegated-arin-extended-latest
  LACNIC_STATS: delegated-lacnic-latest
  RIPENCC_STATS: delegated-ripencc-latest
  IPVERSE_BGP_ARCHIVE: as-ip-blocks.tar.gz
  RU_PREFIX_INPUT: geoip_RU_BY_KZ_asn_bgp_prefixes.txt
  RIR_PREFIX_INPUT: geoip_RU_rir_registered_prefixes.txt
  RIR_STATS: geoip_RU_rir_stats.txt
  RIR_RUKZBY_PREFIX_INPUT: geoip_RU_BY_KZ_rir_registered_prefixes.tsv
  RIR_RUKZBY_STATS: geoip_RU_BY_KZ_rir_stats.txt
  GLOBAL_BGP_PREFIX_INPUT: geoip_RU_global_bgp_prefixes.txt
  IANA_V4_CSV: iana-ipv4-special-registry.csv
  IANA_V6_CSV: iana-ipv6-special-registry.csv
  IANA_PRIVATE_PREFIX_INPUT: geoip_RU_iana_non_global_prefixes.txt
  IANA_REACHABLE_PREFIX_INPUT: geoip_RU_iana_global_exceptions.txt
  QUALITY_REPORT: geoip_RU_v37_base_quality_report.txt
  V41_QUALITY_REPORT: geoip_RU_quality_report.txt
  V41_METRICS: geoip_RU_v41_source_metrics.tsv
  V41_PREFIX_PROVENANCE: geoip_RU_v41_prefix_provenance.tsv
  V41_BLOCKED_PROVENANCE: geoip_RU_v41_blocked_provenance.tsv
  V41_BLOCKED_FILE: geoip_RU_v41_blocked_ip_exclusions.txt
  V41_BLOCKED_SHA: geoip_RU_v41_blocked_ip_exclusions.txt.sha256sum
  V41_MANIFEST: geoip_RU_v41_manifest.json
  PROVENANCE_FILE: geoip_RU_v37_additional_provenance.tsv
  ASN_MANIFEST: geoip_RU_BY_KZ_asn_manifest.txt
  COMPANY_ASN_MANIFEST: geoip_RU_company_asn_manifest.tsv
  COMPANY_ASN_PREFIXES: geoip_RU_company_asn_bgp_prefixes.txt
  REGIONAL_ORIGIN_PREFIXES: geoip_RU_v41_rir_ru_and_company_origin_prefixes.txt
  CORE_COMPANY_PREFIXES: geoip_RU_company_asn_core_bgp_prefixes.txt
  SHARED_INFRASTRUCTURE_PREFIXES: geoip_RU_shared_infrastructure_bgp_prefixes.txt
  ASN_STATS: geoip_RU_BY_KZ_asn_stats.txt
  SOURCE_COUNTS: geoip_RU_source_counts.txt
  CATEGORY_AUDIT: geoip_RU_category_audit.tsv
  OUTPUT_FILE: geoip_RU_v37_base.dat
  V41_OUTPUT_FILE: geoip_RU.dat
  CATEGORY_FILE: geoip_RU_categories.txt
  SOURCE_FILE: geoip_RU_sources.txt
  OUTPUT_SHA_FILE: geoip_RU.dat.sha256sum
  BLOCKED_IP_INPUT: geoip_RU_blocked_ip_exclusions.txt
  BLOCKED_IP_EXACT_INPUT: geoip_RU_blocked_ip_exact_and_legacy_hard.txt
  BLOCKED_IPRESOLVE_ONLY_INPUT: geoip_RU_blocked_ipresolve_resolver_only.txt
  BLOCKED_IP_SHA_FILE: geoip_RU_blocked_ip_exclusions.txt.sha256sum
  BLOCKED_IP_RAW_INPUT: antifilter-ip.lst
  BLOCKED_IPRESOLVE_INPUT: antifilter-ipresolve.lst
  BLOCKED_SUBNET_INPUT: antifilter-subnet.lst
  BLOCKED_COMMUNITY_INPUT: antifilter-community.lst
  BLOCKED_REFILTER_INPUT: refilter-ipsum.lst
  BLOCKED_IPSUM_INPUT: antifilter-ipsum.lst
  BLOCKED_BASELINE_INPUT: geoip_RU_v38_approved_blocked_baseline.txt
  V38_PINNED_IP_INPUT: geoip_RU_v38_pinned_antifilter-ip.lst
  V38_PINNED_IPRESOLVE_INPUT: geoip_RU_v38_pinned_antifilter-ipresolve.lst
  V38_PINNED_SUBNET_INPUT: geoip_RU_v38_pinned_antifilter-subnet.lst
  BLOCKED_REVIEW_INPUT: geoip_RU_blocked_review_candidates.tsv
  BLOCKED_STATS_INPUT: geoip_RU_blocked_source_stats.txt
  BLOCKED_CHECKSUMS_INPUT: geoip_RU_blocked_sources.sha256
  INPUT_PROVENANCE: geoip_RU_input_provenance.tsv
  INPUT_PROVENANCE_SHA: geoip_RU_input_provenance.tsv.sha256sum

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read


    steps:
      - name: Checkout repository
        # v7.0.1; pin the action implementation to an immutable commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        # v7.0.0; pin the action implementation to an immutable commit.
        uses: actions/setup-go@0778a10ce47b5d450cf60fb94fafad4330008a35
        with:
          go-version: "1.26.10"
          cache-dependency-path: .github/scripts/geoip-v37-builder/go.sum

      - name: Download RU/BY/KZ GeoIP sources, blocked-IP snapshot, RIR, IANA and BGP data
        shell: bash
        run: |
          set -euo pipefail

          # Versioned source data is reviewed in Git rather than duplicated inside YAML.
          cp .github/data/geoip_RU_company_asns.tsv "$COMPANY_ASN_REGISTRY"
          cp .github/data/geoip_RU_company_asn_policy.tsv "$COMPANY_ASN_POLICY"
          test -s "$COMPANY_ASN_REGISTRY"
          test -s "$COMPANY_ASN_POLICY"
          echo "Company ASN registry entries: $(grep -c '^AS' "$COMPANY_ASN_REGISTRY")"
          echo "CORE/SHARED policy rows: $(grep -c '^AS' "$COMPANY_ASN_POLICY")"
          sha256sum "$COMPANY_ASN_REGISTRY" "$COMPANY_ASN_POLICY" > geoip_RU_company_asn_registry.sha256sum

          # Record the exact mirror selected by the build and the bytes consumed.
          # This is per-run provenance, not a claim that mutable upstream refs are immutable.
          printf 'SOURCE\tLOCAL_FILE\tFETCH_URL\tSHA256\tBYTES\tSTATUS\n' > "$INPUT_PROVENANCE"

          record_source_download() {
            local label="$1" output="$2" url="$3" status="$4"
            local digest="-" bytes="0"
            if [[ "$status" == "downloaded" ]]; then
              digest="$(sha256sum "$output" | awk '{print $1}')"
              bytes="$(wc -c < "$output" | tr -d ' ')"
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$label" "$(basename "$output")" "$url" "$digest" "$bytes" "$status" >> "$INPUT_PROVENANCE"
          }

          download_file() {
            local label="$1"
            local output="$2"
            shift 2
            local tmp="${output}.part"
            local url
            rm -f "$tmp"

            for url in "$@"; do
              echo "::group::${label}"
              echo "Trying: ${url}"
              if curl --fail --location --silent --show-error \
                --proto "=https" --proto-redir "=https" --max-filesize 67108864 \
                --connect-timeout 20 --max-time 180 \
                --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 240 \
                --output "$tmp" "$url"; then
                if [[ -s "$tmp" ]]; then
                  mv "$tmp" "$output"
                  record_source_download "$label" "$output" "$url" "downloaded"
                  echo "Downloaded ${label}: $(wc -c < "$output") bytes"
                  echo "::endgroup::"
                  return 0
                fi
                echo "Empty response from ${url}"
              else
                echo "Download failed from ${url}"
              fi
              rm -f "$tmp"
              echo "Trying next mirror..."
              echo "::endgroup::"
            done

            echo "::error::Unable to download required source: ${label}"
            return 1
          }

          download_optional_file() {
            local label="$1" output="$2" url="$3" tmp="${2}.part"
            rm -f "$tmp"
            if curl --fail --location --silent --show-error --proto "=https" --proto-redir "=https" --max-filesize 67108864 --connect-timeout 20 --max-time 180 \
                 --retry 2 --retry-all-errors --retry-delay 2 --output "$tmp" "$url" && [[ -s "$tmp" ]]; then
              mv "$tmp" "$output"
              record_source_download "$label" "$output" "$url" "downloaded"
              echo "Downloaded optional ${label}: $(wc -c < "$output") bytes"
            else
              rm -f "$tmp"
              printf '# Optional source unavailable during this build: %s\n' "$url" > "$output"
              record_source_download "$label" "$output" "$url" "unavailable"
              echo "::warning::Optional review-only source unavailable: ${label}; continuing without its candidates."
            fi
          }

          # Static routing inputs have independently reviewed hashes and bounded sizes.
          # Never substitute a proxy, mutable ref or self-reported digest on failure.
          python3 .github/scripts/download_v41_locked_sources.py \
            --lock .github/data/v41-source-lock.json --provenance "$INPUT_PROVENANCE"

          echo "==============================================="
          echo "Downloading additive RU ASN/BGP data"
          echo "==============================================="

          # RIPEstat's Country Resource List is itself derived from RIR delegated
          # statistics. Avoid making the RIPEstat API a single point of failure:
          # fetch each RIR's authoritative daily file, with cross-RIR mirrors.
          echo "==============================================="
          echo "Downloading five RIR delegated statistics files"
          echo "==============================================="

          download_file "AFRINIC DELEGATED STATS" "$AFRINIC_STATS" \
            "https://ftp.afrinic.net/pub/stats/afrinic/delegated-afrinic-latest" \
            "https://ftp.apnic.net/pub/stats/afrinic/delegated-afrinic-latest" \
            "https://ftp.ripe.net/pub/stats/afrinic/delegated-afrinic-latest"

          download_file "APNIC DELEGATED STATS" "$APNIC_STATS" \
            "https://ftp.apnic.net/pub/stats/apnic/delegated-apnic-latest" \
            "https://ftp.ripe.net/pub/stats/apnic/delegated-apnic-latest" \
            "https://ftp.afrinic.net/pub/stats/apnic/delegated-apnic-latest"

          download_file "ARIN DELEGATED STATS" "$ARIN_STATS" \
            "https://ftp.arin.net/pub/stats/arin/delegated-arin-extended-latest" \
            "https://ftp.arin.net/pub/stats/arin/delegated-arin-latest" \
            "https://ftp.ripe.net/pub/stats/arin/delegated-arin-extended-latest" \
            "https://ftp.apnic.net/pub/stats/arin/delegated-arin-extended-latest"

          download_file "LACNIC DELEGATED STATS" "$LACNIC_STATS" \
            "https://ftp.lacnic.net/pub/stats/lacnic/delegated-lacnic-latest" \
            "https://ftp.ripe.net/pub/stats/lacnic/delegated-lacnic-latest" \
            "https://ftp.apnic.net/pub/stats/lacnic/delegated-lacnic-latest"

          download_file "RIPE NCC DELEGATED STATS" "$RIPENCC_STATS" \
            "https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest" \
            "https://ftp.apnic.net/pub/stats/ripencc/delegated-ripencc-latest" \
            "https://ftp.afrinic.net/pub/stats/ripencc/delegated-ripencc-latest"

          # Official IANA Special-Purpose registries. IANA currently publishes the CSV
          # download under the numbered filename *-1.csv (not the registry-name.csv URL).
          # Non-globally-reachable entries
          # are included in PRIVATE; globally-reachable exceptions are subtracted back
          # out so broad special-purpose blocks do not swallow explicit exceptions.
          download_file "IANA IPV4 SPECIAL REGISTRY" "$IANA_V4_CSV" \
            "https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry-1.csv"
          download_file "IANA IPV6 SPECIAL REGISTRY" "$IANA_V6_CSV" \
            "https://www.iana.org/assignments/iana-ipv6-special-registry/iana-ipv6-special-registry-1.csv"

          # Extract RU-registered ASNs AND RU-registered IPv4/IPv6 resources from
          # the five authoritative RIR delegated-stat snapshots. IP registration
          # country is a corroborating registry signal, not proof of server location.
          python3 - "$AFRINIC_STATS" "$APNIC_STATS" "$ARIN_STATS" \
            "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" \
            "$RIR_PREFIX_INPUT" "$RIR_STATS" "$BY_KZ_ASN_REGISTRY" <<'PY'
          import datetime
          import ipaddress
          import pathlib
          import sys

          inputs = [
              ("afrinic", pathlib.Path(sys.argv[1])),
              ("apnic", pathlib.Path(sys.argv[2])),
              ("arin", pathlib.Path(sys.argv[3])),
              ("lacnic", pathlib.Path(sys.argv[4])),
              ("ripencc", pathlib.Path(sys.argv[5])),
          ]
          asn_output = pathlib.Path(sys.argv[6])
          prefix_output = pathlib.Path(sys.argv[7])
          stats_output = pathlib.Path(sys.argv[8])
          by_kz_asn_output = pathlib.Path(sys.argv[9])
          asns_by_country = {"RU": set(), "BY": set(), "KZ": set()}
          asns = asns_by_country["RU"]
          by_kz_asns = set()
          rir_prefixes = set()
          rir_v4_prefixes = set()
          rir_v6_prefixes = set()
          summaries = []
          today = datetime.date.today()
          raw_asn_records = raw_v4_records = raw_v6_records = 0
          generated_v4_cidr_components = generated_v6_cidr_components = 0

          def prefix_sort(value):
              net = ipaddress.ip_network(value)
              return net.version, int(net.network_address), net.prefixlen

          for expected_registry, path in inputs:
              try:
                  lines = path.read_text(encoding="utf-8", errors="strict").splitlines()
              except (OSError, UnicodeError) as exc:
                  raise SystemExit(f"Cannot read {expected_registry} delegated stats: {exc}")
              if not lines:
                  raise SystemExit(f"Empty delegated stats file: {path}")

              header = None
              for line in lines:
                  normalized = line.lstrip("\ufeff").strip()
                  if not normalized or normalized.startswith("#"):
                      continue
                  fields = [field.strip() for field in normalized.split("|")]
                  if (len(fields) >= 7 and (fields[0] == "2" or fields[0].startswith("2."))
                          and fields[1].lower() == expected_registry):
                      header = fields
                      break
              if header is None:
                  first_nonempty = next((line.strip() for line in lines if line.strip()), "<empty>")
                  raise SystemExit(
                      f"Invalid/mismatched {expected_registry} stats header in {path}; "
                      f"first non-empty line: {first_nonempty[:160]!r}"
                  )

              try:
                  snapshot_date = datetime.datetime.strptime(header[5], "%Y%m%d").date()
              except ValueError:
                  raise SystemExit(f"Invalid snapshot enddate in {expected_registry}: {header[5]!r}")
              age_days = (today - snapshot_date).days
              if age_days < -1 or age_days > 14:
                  raise SystemExit(
                      f"Stale/future {expected_registry} delegated stats: {snapshot_date} ({age_days} days old)"
                  )

              count_asn = count_v4 = count_v6 = 0
              registry_v4_components = registry_v6_components = 0
              registry_prefixes = set()
              for line in lines:
                  normalized = line.lstrip("\ufeff").strip()
                  if not normalized or normalized.startswith("#"):
                      continue
                  fields = [field.strip() for field in normalized.split("|")]
                  if len(fields) < 7:
                      continue
                  registry, country, resource_type, start, value, _date, status = fields[:7]
                  country_code = country.upper()
                  if registry.lower() != expected_registry or country_code not in {"RU", "BY", "KZ"}:
                      continue
                  if status.lower() not in {"allocated", "assigned", "legacy"}:
                      continue

                  kind = resource_type.lower()
                  if kind == "asn":
                      try:
                          first, count = int(start), int(value)
                      except ValueError:
                          continue
                      if first < 1 or count < 1 or first + count - 1 > 4294967295:
                          continue
                      asns_by_country[country_code].update(range(first, first + count))
                      if country_code == "RU":
                          count_asn += 1
                      continue

                  # The RU resource list remains a corroborating input for RU geographic feeds.
                  # BY/KZ public address resources are not blindly imported: their GeoIP country
                  # categories and observed regional-origin BGP prefixes form the DIRECT layers.
                  if country_code != "RU":
                      continue

                  if kind == "ipv4":
                      try:
                          first_ip = ipaddress.ip_address(start)
                          count = int(value)
                          if first_ip.version != 4 or count < 1:
                              continue
                          last_int = int(first_ip) + count - 1
                          if last_int > (1 << 32) - 1:
                              continue
                          last_ip = ipaddress.ip_address(last_int)
                          nets = list(ipaddress.summarize_address_range(first_ip, last_ip))
                          for net in nets:
                              if net.prefixlen == 0:
                                  continue
                              value = str(net)
                              rir_prefixes.add(value)
                              rir_v4_prefixes.add(value)
                              registry_prefixes.add(value)
                              registry_v4_components += 1
                          count_v4 += 1
                      except (ValueError, TypeError):
                          continue
                      continue

                  if kind == "ipv6":
                      try:
                          prefixlen = int(value)
                          if not 0 < prefixlen <= 128:
                              continue
                          net = ipaddress.ip_network(f"{start}/{prefixlen}", strict=True)
                          if net.version != 6 or net.prefixlen == 0:
                              continue
                          value = str(net)
                          rir_prefixes.add(value)
                          rir_v6_prefixes.add(value)
                          registry_prefixes.add(value)
                          registry_v6_components += 1
                          count_v6 += 1
                      except (ValueError, TypeError):
                          continue

              raw_asn_records += count_asn
              raw_v4_records += count_v4
              raw_v6_records += count_v6
              generated_v4_cidr_components += registry_v4_components
              generated_v6_cidr_components += registry_v6_components
              note = " (zero valid for an RIR with no RU records of this type)"
              summaries.append(
                  f"{expected_registry}: snapshot={snapshot_date}, ASN records={count_asn}, "
                  f"IPv4 resource records={count_v4}, IPv4 CIDR components={registry_v4_components}, "
                  f"IPv6 resource records={count_v6}, IPv6 CIDR components={registry_v6_components}, "
                  f"registry-local unique CIDRs={len(registry_prefixes)}{note}"
              )
              print(summaries[-1])

          by_kz_asns = asns_by_country["BY"] | asns_by_country["KZ"]
          if len(asns) < 25 or len(asns) > 100000:
              raise SystemExit(f"RIR ASN registry sanity check failed: {len(asns)} unique RU ASNs")
          if len(asns_by_country["BY"]) < 10 or len(asns_by_country["KZ"]) < 10:
              raise SystemExit(
                  f"RIR regional ASN inventory is unexpectedly sparse: BY={len(asns_by_country['BY'])}, KZ={len(asns_by_country['KZ'])}"
              )
          if len(by_kz_asns) < 25 or len(by_kz_asns) > 100000:
              raise SystemExit(f"RIR BY/KZ ASN registry sanity check failed: {len(by_kz_asns)} unique BY/KZ ASNs")
          if not rir_prefixes:
              raise SystemExit("RIR RU IPv4/IPv6 resource inventory is empty; refusing unverified build")

          with asn_output.open("w", encoding="utf-8") as handle:
              handle.write("# Unique RU ASNs from allocated, assigned and legacy records in five RIR delegated stats files\n")
              for asn in sorted(asns):
                  handle.write(f"AS{asn}\n")

          with by_kz_asn_output.open("w", encoding="utf-8") as handle:
              handle.write("# Unique BY/KZ ASNs from allocated, assigned and legacy records in five RIR delegated stats files\n")
              handle.write(f"# BY ASNs: {len(asns_by_country['BY'])}; KZ ASNs: {len(asns_by_country['KZ'])}\n")
              for asn in sorted(by_kz_asns):
                  handle.write(f"AS{asn}\n")

          with prefix_output.open("w", encoding="utf-8") as handle:
              handle.write("# IPv4/IPv6 resources registered to RU in the five RIR delegated statistics files\n")
              handle.write("# Registration country is not proof of physical server location; used as corroboration only.\n")
              for prefix in sorted(rir_prefixes, key=prefix_sort):
                  handle.write(prefix + "\n")

          stats_lines = [
              f"Generated UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              f"Unique RU-registered ASNs: {len(asns)}",
              f"Unique BY-registered ASNs: {len(asns_by_country['BY'])}",
              f"Unique KZ-registered ASNs: {len(asns_by_country['KZ'])}",
              f"Unique BY/KZ-registered ASNs (deduplicated): {len(by_kz_asns)}",
              f"Unique RU-registered IPv4 CIDRs after cross-registry de-duplication: {len(rir_v4_prefixes)}",
              f"Unique RU-registered IPv6 CIDRs after cross-registry de-duplication: {len(rir_v6_prefixes)}",
              f"Unique RU-registered IPv4/IPv6 CIDRs after cross-registry de-duplication: {len(rir_prefixes)}",
              f"Raw IPv4 resource records: {raw_v4_records}",
              f"IPv4 CIDR components emitted before de-duplication: {generated_v4_cidr_components}",
              f"IPv4 CIDR expansion delta (components minus raw records): {generated_v4_cidr_components - raw_v4_records}",
              f"Raw IPv6 resource records: {raw_v6_records}",
              f"IPv6 CIDR components emitted before de-duplication: {generated_v6_cidr_components}",
              f"IPv6 CIDR expansion delta (components minus raw records): {generated_v6_cidr_components - raw_v6_records}",
              f"Raw ASN resource records: {raw_asn_records}",
              "Interpretation: one raw IPv4 resource interval can expand to multiple CIDR components; this is conversion, not contribution from another RIR. Unique output CIDRs are de-duplicated across all registries.",
              "Caveat: RIR country describes registration, not physical hosting location.",
              *summaries,
          ]
          stats_output.write_text("\n".join(stats_lines) + "\n", encoding="utf-8")
          print("Unique RU-registered ASNs:", len(asns))
          print("Unique RU-registered address prefixes:", len(rir_prefixes))
          PY

          # v41 separately inventories the full RU+BY+KZ public address-resource
          # set. Registration is DIRECT evidence here, not a physical-geolocation claim.
          python3 .github/scripts/build_rir_rukzby_prefixes.py \
            --afrinic "$AFRINIC_STATS" --apnic "$APNIC_STATS" --arin "$ARIN_STATS" \
            --lacnic "$LACNIC_STATS" --ripencc "$RIPENCC_STATS" \
            --output "$RIR_RUKZBY_PREFIX_INPUT" --stats "$RIR_RUKZBY_STATS"

          # Convert the official IANA registries into exact non-globally-reachable
          # prefixes and explicit globally-reachable exceptions.
          python3 - "$IANA_V4_CSV" "$IANA_V6_CSV" \
            "$IANA_PRIVATE_PREFIX_INPUT" "$IANA_REACHABLE_PREFIX_INPUT" <<'PY'
          import csv
          import ipaddress
          import pathlib
          import sys

          inputs = [pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])]
          private_out = pathlib.Path(sys.argv[3])
          reachable_out = pathlib.Path(sys.argv[4])
          non_global = set()
          global_exceptions = set()

          for path in inputs:
              try:
                  with path.open("r", encoding="utf-8-sig", newline="") as handle:
                      rows = list(csv.DictReader(handle))
              except (OSError, UnicodeError, csv.Error) as exc:
                  raise SystemExit(f"Cannot parse IANA registry {path}: {exc}")
              if not rows or "Address Block" not in rows[0] or "Globally Reachable" not in rows[0]:
                  raise SystemExit(f"Unexpected IANA CSV schema: {path}")
              for row in rows:
                  block = (row.get("Address Block") or "").strip()
                  reachable = (row.get("Globally Reachable") or "").strip().split()[0].lower() if (row.get("Globally Reachable") or "").strip() else ""
                  if not block or reachable not in {"true", "false"}:
                      continue
                  try:
                      net = ipaddress.ip_network(block, strict=True)
                  except ValueError:
                      continue
                  if net.prefixlen == 0:
                      continue
                  if reachable == "false":
                      non_global.add(str(net))
                  else:
                      global_exceptions.add(str(net))

          def key(value):
              net = ipaddress.ip_network(value)
              return net.version, int(net.network_address), net.prefixlen

          if len(non_global) < 20:
              raise SystemExit(f"IANA non-globally-reachable prefix count unexpectedly small: {len(non_global)}")

          private_out.write_text(
              "# IANA Special-Purpose entries where Globally Reachable=False\n" +
              "\n".join(sorted(non_global, key=key)) + "\n", encoding="utf-8"
          )
          reachable_out.write_text(
              "# IANA Special-Purpose entries where Globally Reachable=True; carve-outs from broad special blocks\n" +
              "\n".join(sorted(global_exceptions, key=key)) + "\n", encoding="utf-8"
          )
          print(f"IANA non-global prefixes: {len(non_global)}")
          print(f"IANA global-reachable exception prefixes: {len(global_exceptions)}")
          PY

          download_file "IPVERSE ASN/BGP ARCHIVE" "$IPVERSE_BGP_ARCHIVE" \
            "https://codeload.github.com/ipverse/as-ip-blocks/tar.gz/refs/heads/master" \
            "https://github.com/ipverse/as-ip-blocks/releases/latest/download/as-ip-blocks.tar.gz"

          # Import RunetFreedom's source categories as separate feeds; do NOT use
          # geoip-ru-only.dat because it also contains PRIVATE and ru-whitelist.
          # ip.lst and ipresolve.lst are host-IP lists; subnet.lst is explicit RKN-derived CIDR.
          download_file "ANTIFILTER EXACT BLOCKED IP LIST" "$BLOCKED_IP_RAW_INPUT" \
            "https://antifilter.download/list/ip.lst"
          download_optional_file "ANTIFILTER IPRESOLVE LIST" "$BLOCKED_IPRESOLVE_INPUT" \
            "https://antifilter.download/list/ipresolve.lst"

          # Preserve the previously approved blocked-set if ipresolve is empty.
          # The baseline is pinned to the exact v38 release commit and SHA-256.
          download_file "PINNED V38 APPROVED BLOCKED BASELINE" "$BLOCKED_BASELINE_INPUT" \
            "https://raw.githubusercontent.com/SpeedeMiner/Geoip-ru-server/3033248ea54cb298bafded25ddcd2805d5f0e7ac/geoip_RU_v38_blocked_ip_exclusions.txt"
          echo "df909b12b985b23080075821cedc5e2f73b7b1f89abcd9950293b400ce1e4a5d  $BLOCKED_BASELINE_INPUT" | sha256sum -c -
          # Historical v38 raw feed snapshots are immutable release assets.
          # Restore *only* proven resolver-derived baseline entries. An unknown
          # old baseline entry retains its hard/exact status.
          download_file "PINNED V38 EXACT IP SOURCE" "$V38_PINNED_IP_INPUT" \
            "https://github.com/SpeedeMiner/Geoip-ru-server/releases/download/latest-geoip-client-v38/antifilter-ip.lst"
          echo "c9c0656d0188f4afa740d71332b618d42b5606ab27e7561790f47b588781d1cb  $V38_PINNED_IP_INPUT" | sha256sum -c -
          download_file "PINNED V38 RESOLVER SOURCE" "$V38_PINNED_IPRESOLVE_INPUT" \
            "https://github.com/SpeedeMiner/Geoip-ru-server/releases/download/latest-geoip-client-v38/antifilter-ipresolve.lst"
          echo "8d8d11605a299da96006df6303a90b08b4ae25d35c1d1a199708cb83f84cdf44  $V38_PINNED_IPRESOLVE_INPUT" | sha256sum -c -
          download_file "PINNED V38 SUBNET SOURCE" "$V38_PINNED_SUBNET_INPUT" \
            "https://github.com/SpeedeMiner/Geoip-ru-server/releases/download/latest-geoip-client-v38/antifilter-subnet.lst"
          echo "2554552742bc0da516a321db66b36fa6cece28c4b3c64b66ff6d12320b33bdb6  $V38_PINNED_SUBNET_INPUT" | sha256sum -c -
          download_file "ANTIFILTER SUBNET LIST" "$BLOCKED_SUBNET_INPUT" \
            "https://antifilter.download/list/subnet.lst"
          # Officially described by the aggregator as /24 summarization of individual
          # RKN-derived IPs. The v41 builder applies it separately and reports its
          # wider shared-hosting/CDN collateral risk instead of hiding it in subnet.lst.
          download_file "ANTIFILTER IPSUM IPV4 /24 SUMMARY" "$BLOCKED_IPSUM_INPUT" \
            "https://antifilter.download/list/ipsum.lst"

          # Community and Re-filter are intentionally review-only. They must never
          # be silently promoted into automatic DIRECT exclusions.
          download_optional_file "ANTIFILTER COMMUNITY CANDIDATES" "$BLOCKED_COMMUNITY_INPUT" \
            "https://community.antifilter.download/list/community.lst"
          download_optional_file "RE-FILTER CANDIDATES" "$BLOCKED_REFILTER_INPUT" \
            "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/ipsum.lst"

          sha256sum "$INPUT_PROVENANCE" > "$INPUT_PROVENANCE_SHA"
          sha256sum -c "$INPUT_PROVENANCE_SHA"

          python3 .github/scripts/prepare_blocked_sources_v41.py \
            --ip-list "$BLOCKED_IP_RAW_INPUT" \
            --ipresolve "$BLOCKED_IPRESOLVE_INPUT" \
            --baseline "$BLOCKED_BASELINE_INPUT" \
            --historical-ip-list "$V38_PINNED_IP_INPUT" \
            --historical-ipresolve "$V38_PINNED_IPRESOLVE_INPUT" \
            --historical-subnet "$V38_PINNED_SUBNET_INPUT" \
            --subnet "$BLOCKED_SUBNET_INPUT" \
            --community "$BLOCKED_COMMUNITY_INPUT" \
            --refilter "$BLOCKED_REFILTER_INPUT" \
            --approved "$BLOCKED_IP_INPUT" \
            --exact-approved "$BLOCKED_IP_EXACT_INPUT" \
            --resolved-approved "$BLOCKED_IPRESOLVE_ONLY_INPUT" \
            --review "$BLOCKED_REVIEW_INPUT" \
            --stats "$BLOCKED_STATS_INPUT" \
            --checksums "$BLOCKED_CHECKSUMS_INPUT"

          # Validate every required core source and the additive ASN/BGP inputs before parsing.
          for file in "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" \
                      "$GOLUKON_INPUT" "$V2FLY_INPUT" "$V2FLY_SHA_INPUT" \
                      "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_BY_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT" \
                      "$BY_KZ_ASN_REGISTRY" "$BLOCKED_IP_INPUT" "$BLOCKED_IP_EXACT_INPUT" "$BLOCKED_IPRESOLVE_ONLY_INPUT" "$BLOCKED_IP_RAW_INPUT" "$BLOCKED_BASELINE_INPUT" \
                      "$BLOCKED_IPRESOLVE_INPUT" "$BLOCKED_SUBNET_INPUT" "$BLOCKED_IPSUM_INPUT" "$BLOCKED_REVIEW_INPUT" \
                      "$BLOCKED_STATS_INPUT" "$BLOCKED_CHECKSUMS_INPUT" "$HXEHEX_INPUT" "$W1ZARDZ_INPUT" \
                      "$KY_STANDARD_V4_INPUT" "$KY_STANDARD_V6_INPUT" "$KY_SERVICES_INPUT" "$HXEHEX_IP_INPUT" "$ESCAPINGWORM_OPERATOR_INPUT" \
                      "$RIR_RUKZBY_PREFIX_INPUT" "$RIR_RUKZBY_STATS" "$AFRINIC_STATS" "$APNIC_STATS" \
                      "$ARIN_STATS" "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" \
                      "$IPVERSE_BGP_ARCHIVE" "$IANA_V4_CSV" "$IANA_V6_CSV"; do
            test -s "$file" || { echo "::error::Missing or empty required input: $file"; exit 1; }
          done
          test "$(wc -c < "$IPVERSE_BGP_ARCHIVE")" -gt 5000000
          gzip -t "$IPVERSE_BGP_ARCHIVE"
          for file in "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" "$KIRILL_INPUT" "$GOLUKON_INPUT" "$V2FLY_INPUT" "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_BY_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT"; do
            test "$(wc -c < "$file")" -gt 100 || { echo "::error::Unexpectedly small GeoIP source: $file"; exit 1; }
          done
          ls -lh "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" "$KIRILL_INPUT" \
                 "$GOLUKON_INPUT" "$V2FLY_INPUT" "$V2FLY_SHA_INPUT" \
                 "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_BY_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT" \
                 "$HXEHEX_INPUT" "$W1ZARDZ_INPUT" "$AFRINIC_STATS" "$APNIC_STATS" \
                 "$ARIN_STATS" "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" "$IPVERSE_BGP_ARCHIVE" \
                 "$IANA_V4_CSV" "$IANA_V6_CSV" "$BLOCKED_IP_RAW_INPUT" "$BLOCKED_IPRESOLVE_INPUT" \
                 "$BLOCKED_SUBNET_INPUT" "$BLOCKED_COMMUNITY_INPUT" "$BLOCKED_REFILTER_INPUT" \
                 "$BLOCKED_IP_INPUT" "$BLOCKED_REVIEW_INPUT" "$BLOCKED_STATS_INPUT"

      - name: Extract RU/BY/KZ registered ASN prefixes and global ipverse BGP observation set
        shell: bash
        run: |
          set -euo pipefail


          python3 .github/scripts/extract_ru_asn_prefixes_v41.py --self-test "$COMPANY_ASN_REGISTRY" "$BY_KZ_ASN_REGISTRY"
          python3 .github/scripts/extract_ru_asn_prefixes_v41.py "$IPVERSE_BGP_ARCHIVE" "$RU_ASN_REGISTRY" "$BY_KZ_ASN_REGISTRY" \
            "$COMPANY_ASN_REGISTRY" "$RU_PREFIX_INPUT" "$GLOBAL_BGP_PREFIX_INPUT" \
            "$ASN_MANIFEST" "$COMPANY_ASN_MANIFEST" "$ASN_STATS"
          python3 .github/scripts/build_company_asn_prefix_classes_v41.py \
            --selected-prefixes "$RU_PREFIX_INPUT" \
            --company-asns "$COMPANY_ASN_REGISTRY" \
            --policy "$COMPANY_ASN_POLICY" \
            --output "$COMPANY_ASN_PREFIXES" \
            --core-output "$CORE_COMPANY_PREFIXES" \
            --shared-output "$SHARED_INFRASTRUCTURE_PREFIXES"
          # Reuse the verified v39 exact-origin RIR-RU/curated company extractor;
          # v41 records its own immutable sidecar instead of dropping those patches.
          python3 .github/scripts/build_company_asn_prefixes.py \
            --selected-prefixes "$RU_PREFIX_INPUT" \
            --company-asns "$COMPANY_ASN_REGISTRY" \
            --rir-ru-asns "$RU_ASN_REGISTRY" \
            --output "$REGIONAL_ORIGIN_PREFIXES"
          for file in "$RU_PREFIX_INPUT" "$GLOBAL_BGP_PREFIX_INPUT" "$ASN_MANIFEST" "$COMPANY_ASN_MANIFEST" "$COMPANY_ASN_PREFIXES" "$CORE_COMPANY_PREFIXES" "$SHARED_INFRASTRUCTURE_PREFIXES" "$COMPANY_ASN_POLICY" "$REGIONAL_ORIGIN_PREFIXES" "$ASN_STATS" "$BY_KZ_ASN_REGISTRY"; do
            test -s "$file" || { echo "::error::Missing BGP artifact: $file"; exit 1; }
          done

      - name: Build unified DIRECT GeoIP RU+BY+KZ v37 with curated blocked-destination exclusions
        shell: bash
        run: |
          set -euo pipefail
          (
            cd .github/scripts/geoip-v37-builder
            test -z "$(gofmt -l main.go main_test.go)"
            GOTOOLCHAIN=local go test -mod=readonly ./...
            GOTOOLCHAIN=local go build -mod=readonly -buildvcs=false -o /tmp/geoip-direct-ru-by-kz-v37-builder .
          )
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

          /tmp/geoip-direct-ru-by-kz-v37-builder \
            "$HYDRA_INPUT" \
            "$GRIMBIRD_INPUT" \
            "$DIGNE_INPUT" \
            "$DAVOYAN_INPUT" \
            "$KIRILL_INPUT" \
            "$GOLUKON_INPUT" \
            "$V2FLY_INPUT" \
            "$LOYALSOLDIER_RU_INPUT" \
            "$LOYALSOLDIER_PRIVATE_INPUT" \
            "$HXEHEX_INPUT" \
            "$W1ZARDZ_INPUT" \
            "$RU_PREFIX_INPUT" \
            "$RIR_PREFIX_INPUT" \
            "$GLOBAL_BGP_PREFIX_INPUT" \
            "$IANA_PRIVATE_PREFIX_INPUT" \
            "$IANA_REACHABLE_PREFIX_INPUT" \
            "$OUTPUT_FILE" \
            "$CATEGORY_FILE" \
            "$SOURCE_FILE" \
            "$SOURCE_COUNTS" \
            "$CATEGORY_AUDIT" \
            "$QUALITY_REPORT" \
            "$PROVENANCE_FILE" \
            "$LOYALSOLDIER_BY_INPUT" \
            "$BLOCKED_IP_INPUT"

          # The ASN extractor produces the measured allowlist statistics and per-countryCode
          # audit. Include them in the quality report itself (not only as a separate artifact),
          # so the quality gate and the published report describe the same company-ASN policy.
          {
            printf '\n=== CURATED RUSSIAN-COMPANY ASN ALLOWLIST ===\n'
            printf 'Selection source: curated Russian-company ASN allowlist from %s.\n' "$COMPANY_ASN_REGISTRY"
            printf 'Inclusion policy: prefixes originated by allowlisted company ASNs are included regardless of ipverse countryCode.\n'
            printf 'Country metadata policy: ipverse countryCode is audit-only and is never an inclusion filter for allowlisted company-ASN origins.\n'
            printf 'Per-ASN evidence and prefix counts: %s\n\n' "$COMPANY_ASN_MANIFEST"
            cat "$ASN_STATS"
            printf '\n=== BLOCKED SOURCE INGESTION AUDIT ===\n'
            printf 'Approved exclusions: %s\n' "$BLOCKED_IP_INPUT"
            printf 'Review-only candidates (never carved): %s\n' "$BLOCKED_REVIEW_INPUT"
            printf 'Source counters: %s\n' "$BLOCKED_STATS_INPUT"
            cat "$BLOCKED_STATS_INPUT"
            printf '\nSource snapshots and normalized checksum manifest: %s\n' "$BLOCKED_CHECKSUMS_INPUT"
            cat "$BLOCKED_CHECKSUMS_INPUT"
            printf '\nApproved blocked-prefix SHA256: '
            sha256sum "$BLOCKED_IP_INPUT" | awk '{print $1}'
          } >> "$QUALITY_REPORT"
          sha256sum "$BLOCKED_IP_INPUT" > "$BLOCKED_IP_SHA_FILE"

          # Assemble v41 from the v37 trusted base plus regional RIR resources and
          # named service-direct routes, then apply only the already approved exact/bounded RKN set.
          python3 .github/scripts/build_v41_overlay.py \
            --base "$OUTPUT_FILE" \
            --hydra "$HYDRA_INPUT" \
            --rir "$RIR_RUKZBY_PREFIX_INPUT" \
            --kyoresuas-v4 "$KY_STANDARD_V4_INPUT" \
            --kyoresuas-v6 "$KY_STANDARD_V6_INPUT" \
            --kyoresuas-services "$KY_SERVICES_INPUT" \
            --w1zardz "$W1ZARDZ_INPUT" \
            --hxehex-ip "$HXEHEX_IP_INPUT" \
            --escapingworm "$ESCAPINGWORM_OPERATOR_INPUT" \
            --blocked-base "$BLOCKED_IP_INPUT" \
            --blocked-exact "$BLOCKED_IP_EXACT_INPUT" \
            --blocked-resolved "$BLOCKED_IPRESOLVE_ONLY_INPUT" \
            --company-prefixes "$COMPANY_ASN_PREFIXES" \
            --core-company-prefixes "$CORE_COMPANY_PREFIXES" \
            --shared-infrastructure-prefixes "$SHARED_INFRASTRUCTURE_PREFIXES" \
            --regional-origin-prefixes "$REGIONAL_ORIGIN_PREFIXES" \
            --ipsum "$BLOCKED_IPSUM_INPUT" \
            --output "$V41_OUTPUT_FILE" \
            --categories "$CATEGORY_FILE" \
            --quality "$V41_QUALITY_REPORT" \
            --metrics "$V41_METRICS" \
            --prefix-provenance "$V41_PREFIX_PROVENANCE" \
            --blocked-provenance "$V41_BLOCKED_PROVENANCE" \
            --blocked-output "$V41_BLOCKED_FILE" \
            --manifest "$V41_MANIFEST"

          test -s "$OUTPUT_FILE" || { echo "::error::v37 base GeoIP protobuf was not created: $OUTPUT_FILE"; exit 1; }
          test -s "$V41_OUTPUT_FILE" || { echo "::error::v41 GeoIP protobuf was not created: $V41_OUTPUT_FILE"; exit 1; }
          rm -f "$OUTPUT_SHA_FILE" "$V41_BLOCKED_SHA"
          sha256sum "$V41_OUTPUT_FILE" > "$OUTPUT_SHA_FILE"
          sha256sum "$V41_BLOCKED_FILE" > "$V41_BLOCKED_SHA"
          sha256sum -c "$OUTPUT_SHA_FILE"
          sha256sum -c "$V41_BLOCKED_SHA"

          for file in "$OUTPUT_FILE" "$V41_OUTPUT_FILE" "$OUTPUT_SHA_FILE" "$V41_BLOCKED_SHA" "$BLOCKED_IP_SHA_FILE" "$CATEGORY_FILE" "$SOURCE_FILE" "$SOURCE_COUNTS" "$CATEGORY_AUDIT" "$QUALITY_REPORT" "$V41_QUALITY_REPORT" "$V41_METRICS" "$V41_PREFIX_PROVENANCE" "$V41_BLOCKED_PROVENANCE" "$V41_BLOCKED_FILE" "$V41_MANIFEST" "$PROVENANCE_FILE" "$ASN_MANIFEST" "$COMPANY_ASN_MANIFEST" "$COMPANY_ASN_PREFIXES" "$CORE_COMPANY_PREFIXES" "$SHARED_INFRASTRUCTURE_PREFIXES" "$COMPANY_ASN_POLICY" "$ASN_STATS" "$BY_KZ_ASN_REGISTRY" "$BLOCKED_IP_INPUT" "$BLOCKED_IP_EXACT_INPUT" "$BLOCKED_IPRESOLVE_ONLY_INPUT" "$BLOCKED_IPSUM_INPUT" "$BLOCKED_REVIEW_INPUT" "$BLOCKED_STATS_INPUT" "$BLOCKED_CHECKSUMS_INPUT" "$BLOCKED_IP_RAW_INPUT" "$BLOCKED_IPRESOLVE_INPUT" "$BLOCKED_SUBNET_INPUT" "$INPUT_PROVENANCE" "$INPUT_PROVENANCE_SHA" "$HYDRA_INPUT" "$RIR_RUKZBY_PREFIX_INPUT" "$RIR_RUKZBY_STATS" "$KY_STANDARD_V4_INPUT" "$KY_STANDARD_V6_INPUT" "$KY_SERVICES_INPUT" "$HXEHEX_IP_INPUT" "$ESCAPINGWORM_OPERATOR_INPUT"; do
            test -s "$file" || { echo "::error::Missing or empty v41 build artifact: $file"; exit 1; }
          done

      - name: Validate v37 base and final v41 RU+BY+KZ DIRECT protobuf
        shell: bash
        run: |
          set -euo pipefail
          # Re-check the checksum in the independent quality-validation step.
          test -s "$OUTPUT_FILE" || { echo "::error::Missing protobuf: $OUTPUT_FILE"; exit 1; }
          test -s "$OUTPUT_SHA_FILE" || { echo "::error::Missing protobuf checksum: $OUTPUT_SHA_FILE"; exit 1; }
          sha256sum -c "$OUTPUT_SHA_FILE"
          test -s "$INPUT_PROVENANCE_SHA" || { echo "::error::Missing input provenance checksum"; exit 1; }
          sha256sum -c "$INPUT_PROVENANCE_SHA"
          python3 - "$OUTPUT_FILE" "$ASN_MANIFEST" "$COMPANY_ASN_MANIFEST" "$ASN_STATS" "$RIR_STATS" "$SOURCE_COUNTS" "$QUALITY_REPORT" "$PROVENANCE_FILE" "$CATEGORY_AUDIT" "$BY_KZ_ASN_REGISTRY" "$BLOCKED_IP_INPUT" "$BLOCKED_REVIEW_INPUT" "$BLOCKED_STATS_INPUT" "$BLOCKED_CHECKSUMS_INPUT" "$INPUT_PROVENANCE" <<'PY'
          import os, sys
          from collections import defaultdict
          output, manifest, company_manifest, bgp_stats, rir_stats, counts, quality, provenance, category_audit, by_kz_asns, blocked_ips, blocked_review, blocked_stats, blocked_checksums, input_provenance = sys.argv[1:]
          minimums = ((output, 4), (manifest, 100), (company_manifest, 300), (bgp_stats, 100), (rir_stats, 100),
                      (counts, 100), (quality, 1600), (provenance, 50), (category_audit, 50), (by_kz_asns, 100), (blocked_ips, 10000),
                      (blocked_review, 20), (blocked_stats, 100), (blocked_checksums, 200), (input_provenance, 100))
          for path, minimum in minimums:
              if not os.path.isfile(path) or os.path.getsize(path) < minimum:
                  raise SystemExit(f"Missing or unexpectedly small v37 artifact: {path}")

          with open(input_provenance, encoding="utf-8") as source:
              provenance_rows = [line.rstrip("\n").split("\t") for line in source if line.strip()]
          provenance_header = ["SOURCE", "LOCAL_FILE", "FETCH_URL", "SHA256", "BYTES", "STATUS"]
          if not provenance_rows or provenance_rows[0] != provenance_header:
              raise SystemExit("Input provenance manifest has an unexpected or missing header")
          provenance_entries = provenance_rows[1:]
          if len(provenance_entries) < 20:
              raise SystemExit(f"Input provenance manifest unexpectedly small: {len(provenance_entries)} entries")
          seen_input_files = set()
          for row in provenance_entries:
              if len(row) != 6:
                  raise SystemExit(f"Malformed input provenance row: {row}")
              source_name, local_file, fetch_url, digest, byte_count, status = row
              if local_file in seen_input_files:
                  raise SystemExit(f"Duplicate local file in input provenance manifest: {local_file}")
              seen_input_files.add(local_file)
              if status == "downloaded":
                  if not fetch_url.startswith("https://") or len(digest) != 64 or not all(ch in "0123456789abcdef" for ch in digest):
                      raise SystemExit(f"Invalid downloaded-source provenance row: {row}")
                  if not byte_count.isdigit() or int(byte_count) <= 0:
                      raise SystemExit(f"Invalid downloaded-source byte count: {row}")
              elif status == "unavailable":
                  allowed_unavailable = ("ANTIFILTER COMMUNITY CANDIDATES", "RE-FILTER CANDIDATES", "ANTIFILTER IPRESOLVE LIST")
                  if source_name not in allowed_unavailable or digest != "-" or byte_count != "0":
                      raise SystemExit(f"Unexpected unavailable input in provenance manifest: {row}")
              else:
                  raise SystemExit(f"Unknown input provenance status: {status}")
          expected_input_files = {
              "hydra-geoip.dat", "grimbird-geoip.dat", "digne-geoip.dat", "davoyan-geoip.dat",
              "kirill-geoip.dat", "golukon-geoip.dat", "v2fly-geoip.dat", "v2fly-geoip.dat.sha256sum",
              "loyalsoldier-ru.dat", "loyalsoldier-by.dat", "loyalsoldier-private.dat",
              "hxehex-cidrwhitelist.txt", "w1zardz-ru-ipv4.txt",
              "kyoresuas-ru-standard-ipv4.txt", "kyoresuas-ru-standard-ipv6.txt", "kyoresuas-services.json",
              "hxehex-ipwhitelist.txt", "escapingworm-operator-cidr.txt",
              "delegated-afrinic-latest", "delegated-apnic-latest", "delegated-arin-extended-latest",
              "delegated-lacnic-latest", "delegated-ripencc-latest", "iana-ipv4-special-registry.csv",
              "iana-ipv6-special-registry.csv", "as-ip-blocks.tar.gz",
              "antifilter-ip.lst", "antifilter-ipresolve.lst", "geoip_RU_v38_approved_blocked_baseline.txt",
              "geoip_RU_v38_pinned_antifilter-ip.lst", "geoip_RU_v38_pinned_antifilter-ipresolve.lst",
              "geoip_RU_v38_pinned_antifilter-subnet.lst", "antifilter-subnet.lst", "antifilter-ipsum.lst",
              "antifilter-community.lst", "refilter-ipsum.lst",
          }
          missing_input_files = sorted(expected_input_files - seen_input_files)
          if missing_input_files:
              raise SystemExit("Input provenance is missing downloaded source files: " + ", ".join(missing_input_files))

          import ipaddress
          with open(by_kz_asns, encoding="utf-8") as source:
              regional_asns = {line.strip().upper() for line in source if line.strip() and not line.lstrip().startswith("#")}
          if len(regional_asns) < 25:
              raise SystemExit(f"BY/KZ RIR ASN inventory unexpectedly small: {len(regional_asns)}")
          telegram_wide = {
              "91.105.192.0/23", "91.108.4.0/22", "91.108.8.0/21", "91.108.16.0/21",
              "91.108.56.0/22", "95.161.64.0/20", "149.154.160.0/20", "185.76.151.0/24",
              "2001:67c:4e8::/48", "2001:b28:f23c::/47", "2001:b28:f23f::/48", "2a0a:f280::/32",
          }
          blocked_count = 0
          for number, raw in enumerate(open(blocked_ips, encoding="utf-8"), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if "#" in line:
                  line = line.split("#", 1)[0].strip()
              token = line.split()[0].strip('[](){}\"\'')
              try:
                  net = ipaddress.ip_network(token, strict=True) if "/" in token else ipaddress.ip_network(token + ("/32" if ":" not in token else "/128"), strict=True)
              except ValueError as exc:
                  raise SystemExit(f"Invalid approved blocked prefix at line {number}: {token}: {exc}")
              allowed = (net.prefixlen == net.max_prefixlen or
                         (net.version == 4 and net.prefixlen >= 16) or
                         (net.version == 6 and net.prefixlen >= 112) or token in telegram_wide)
              if not allowed:
                  raise SystemExit(f"Approved blocked prefix exceeds carve threshold at line {number}: {token}")
              blocked_count += 1
          if blocked_count < 1000:
              raise SystemExit(f"Approved blocked-prefix input unexpectedly small: {blocked_count}")
          review_header = open(blocked_review, encoding="utf-8").readline().strip()
          if review_header != "SOURCE\tPREFIX\tREASON":
              raise SystemExit("Blocked review-only candidate file has an unexpected schema")
          blocked_stats_text = open(blocked_stats, encoding="utf-8").read()
          for marker in ("antifilter-ip.lst", "antifilter-ipresolve.lst", "antifilter-subnet.lst",
                         "community-antifilter-community.lst", "re-filter-ipsum.lst", "runetfreedom-static-telegram", "v38-approved-baseline"):
              if marker not in blocked_stats_text:
                  raise SystemExit(f"Blocked source statistics are missing source: {marker}")
          checksum_text = open(blocked_checksums, encoding="utf-8").read()
          for filename in ("antifilter-ip.lst", "antifilter-ipresolve.lst", "antifilter-subnet.lst",
                           "antifilter-community.lst", "refilter-ipsum.lst", "geoip_RU_v38_approved_blocked_baseline.txt",
                           "geoip_RU_v38_pinned_antifilter-ip.lst", "geoip_RU_v38_pinned_antifilter-ipresolve.lst",
                           "geoip_RU_v38_pinned_antifilter-subnet.lst"):
              if filename not in checksum_text:
                  raise SystemExit(f"Blocked-source checksum manifest is missing snapshot: {filename}")

          with open(counts, encoding="utf-8") as source:
              rows = [line.rstrip("\n").split("\t") for line in source if line.strip()]
          expected_header = ["SOURCE", "RU_CATEGORY_CIDR_INPUTS", "CANDIDATE_CIDR_INPUTS",
                             "PRIVATE_CIDR_INPUTS", "OTHER_EVIDENCE_CIDR_INPUTS", "TOTAL_CIDR_INPUTS"]
          if rows[0] != expected_header:
              raise SystemExit(f"Unexpected source-count schema: {rows[0]}")
          count_map = {row[0]: row for row in rows[1:] if len(row) == 6}

          required_ru = ("grimbird", "digne", "davoyan", "golukon", "loyalsoldier", "v2fly", "loyalsoldier-by")
          required_other = ("hydra", "loyalsoldier-private", "ru-asn-bgp", "rir-ru", "global-bgp",
                            "iana-non-global", "iana-global-exceptions", "blocked-direct-exclusions")
          def source_total(name):
              return sum(int(value) for value in count_map.get(name, ["", "0", "0", "0", "0", "0"])[1:5])

          missing_ru = [name for name in required_ru if source_total(name) <= 0]
          missing_other = [name for name in required_other if source_total(name) <= 0]
          if missing_ru or missing_other:
              raise SystemExit("Required v37 inputs missing/empty: RU feeds=" + ", ".join(missing_ru) +
                               "; other inputs=" + ", ".join(missing_other))

          total_row = count_map.get("TOTAL")
          if not total_row:
              raise SystemExit("Source count TOTAL row is missing")
          sums = [sum(int(row[i]) for row in count_map.values() if row[0] != "TOTAL") for i in range(1, 6)]
          declared = [int(value) for value in total_row[1:6]]
          if sums != declared:
              raise SystemExit(f"Source count totals do not reconcile: summed={sums} declared={declared}")

          import ipaddress
          with open(provenance, encoding="utf-8") as source:
              provenance_rows = [line.rstrip("\n").split("\t") for line in source if line.strip()]
          provenance_header = provenance_rows[0]
          if len(provenance_header) != 14 or provenance_header[:3] != ["PREFIX", "FAMILY", "PREFIX_ADDRESSES"]:
              raise SystemExit("Additional-prefix provenance TSV has unexpected schema")
          for row in provenance_rows[1:]:
              if len(row) != 14:
                  raise SystemExit(f"Malformed additional-prefix provenance row: {row[:3]}")
              network = ipaddress.ip_network(row[0], strict=True)
              expected_family = "IPv4" if network.version == 4 else "IPv6"
              expected_addresses = 1 << (network.max_prefixlen - network.prefixlen)
              if row[1] != expected_family or int(row[2]) != expected_addresses:
                  raise SystemExit(f"Prefix family/address-count mismatch in provenance row: {row[:3]}")
              for index in (3, 4, 5, 6, 8, 9, 10, 11, 12, 13):
                  value = int(row[index])
                  if value < 0 or value > expected_addresses:
                      raise SystemExit(f"Invalid overlap count in provenance row {row[0]} column {provenance_header[index]}")

          with open(category_audit, encoding="utf-8") as source:
              category_rows = [line.rstrip("\n").split("\t") for line in source if line.strip()]
          category_header = ["SOURCE", "NORMALIZED_CATEGORY", "ASSIGNED_ROLE", "VALID_CIDR_INPUT_RECORDS"]
          if not category_rows or category_rows[0] != category_header:
              raise SystemExit("Raw GeoIP category audit has an unexpected schema")
          role_totals_by_source = defaultdict(lambda: defaultdict(int))
          for row in category_rows[1:]:
              if len(row) != 4:
                  raise SystemExit(f"Malformed raw category audit row: {row}")
              source_name, category, role, raw_count = row
              if role not in {"ru", "ru-by", "ru-kz", "candidate", "private", "ignored"}:
                  raise SystemExit(f"Unknown category assignment role: {role}")
              value = int(raw_count)
              if value <= 0:
                  raise SystemExit(f"Non-positive raw category count: {row}")
              role_totals_by_source[source_name][role] += value
          required_regional_roles = {
              ("loyalsoldier-by", "by", "ru-by"),
              ("v2fly", "by", "ru-by"),
              ("v2fly", "kz", "ru-kz"),
              ("loyalsoldier", "ru", "ru"),
              ("v2fly", "ru", "ru"),
          }
          observed_regional_roles = {
              (row[0], row[1], row[2]) for row in category_rows[1:] if len(row) == 4 and int(row[3]) > 0
          }
          missing_regional_roles = sorted(required_regional_roles - observed_regional_roles)
          if missing_regional_roles:
              raise SystemExit(f"Missing required GeoIP category assignments: {missing_regional_roles}")

          dat_sources = ("hydra", "grimbird", "digne", "davoyan", "kirill", "golukon", "v2fly", "loyalsoldier", "loyalsoldier-private", "loyalsoldier-by")
          for source_name in dat_sources:
              row = count_map.get(source_name)
              if not row:
                  raise SystemExit(f"Missing source count row for GeoIP dat source: {source_name}")
              actual = [sum(role_totals_by_source[source_name][role] for role in ("ru", "ru-by", "ru-kz")),
                        role_totals_by_source[source_name]["candidate"], role_totals_by_source[source_name]["private"]]
              expected = [int(row[1]), int(row[2]), int(row[3])]
              if actual != expected:
                  raise SystemExit(f"Raw category-to-role counts do not reconcile for {source_name}: audit={actual} builder={expected}")

          with open(company_manifest, encoding="utf-8") as source:
              company_rows = [line.rstrip("\n").split("\t") for line in source if line.strip()]
          expected_company_header = ["ASN", "COMPANY_GROUP", "LEGAL_ENTITY_OR_NOTE", "EVIDENCE", "ACTIVE_IN_IPVERSE", "IPVERSE_COUNTRY_CODE", "IPV4_PREFIXES", "IPV6_PREFIXES", "ALSO_RIR_RU", "ALSO_RIR_BY_KZ"]
          if not company_rows or company_rows[0] != expected_company_header:
              raise SystemExit("Company ASN manifest has an unexpected schema")
          if len(company_rows) < 20:
              raise SystemExit(f"Company ASN manifest unexpectedly small: {len(company_rows)-1} entries")
          company_groups = {row[1] for row in company_rows[1:] if len(row) == len(expected_company_header)}
          company_by_asn = {row[0]: row for row in company_rows[1:] if len(row) == len(expected_company_header)}
          for required_asn in ("AS207304", "AS208795", "AS212066"):
              if required_asn not in company_by_asn:
                  raise SystemExit(f"Required Yandex regional origin ASN is missing: {required_asn}")
          if "AS208398" in company_by_asn:
              raise SystemExit("Transit ASN AS208398 must not be imported wholesale as a company origin")
          for required_group in ("Yandex", "VK/Mail.ru", "Wildberries", "Ozon", "Sberbank", "Selectel"):
              if required_group not in company_groups:
                  raise SystemExit(f"Company ASN allowlist is missing required group: {required_group}")

          quality_text = open(quality, encoding="utf-8").read()
          required_quality_markers = (
              "UNIFIED DIRECT REGION RU+BY+KZ", "BLOCKED DESTINATION EXCLUSIONS",
              "Telemetry/privacy-risk labels are informational only", "telemetry stays DIRECT", "exact host IPs", "PRIVATE",
              "IPv4 output CIDRs:", "IPv6 output CIDRs:", "fully_observed", "partially_observed",
              "not_observed", "exact same-prefix global BGP announcement", "no global BGP address-space overlap",
              "Loyalsoldier/v2fly overlap as share of union address space", "IPv6 address-space equivalent in /32-sized units",
              "Reconciled source role totals:", "Grimbird and Digne are treated as one correlated group",
              "curated Russian-company ASN allowlist", "regardless of ipverse countryCode",
              "Yandex Turkey AS212066 static DIRECT overrides: 45.148.65.0/24, 2a14:48c6::/48",
              "Yandex Turkey AS212066 required DIRECT prefixes covered: 2 of 2",
              "Yandex Turkey AS212066 final DIRECT prefix checks (after PRIVATE/blocked carve): 2 of 2",
              "Approved blocked prefix records loaded", "subnet.lst bounded CIDRs", "RunetFreedom's explicitly configured Telegram routes",
              "community.lst and Re-filter ipsum.lst are exported as review-only candidates",
          )
          missing_quality_markers = [marker for marker in required_quality_markers if marker not in quality_text]
          if missing_quality_markers:
              raise SystemExit("Quality report is missing required sections: " + ", ".join(missing_quality_markers))

          # The published quality report must carry the measured company-ASN registry
          # metrics from the extractor, and its registry count must reconcile to the
          # per-ASN manifest generated from the same parsed allowlist.
          expected_allowlist_count = len(company_rows) - 1
          count_line = f"Curated Russian-company ASN allowlist entries: {expected_allowlist_count}"
          if count_line not in quality_text:
              raise SystemExit("Quality report is missing or disagrees with the curated company-ASN registry count")
          for marker in (
              "Unique prefixes originated by curated Russian-company/affiliate ASNs:",
              "Company ASN ipverse countryCode distribution (audit only):",
              "Country handling: ipverse countryCode is not used as an inclusion filter",
              "Per-ASN evidence and prefix counts:",
          ):
              if marker not in quality_text:
                  raise SystemExit(f"Quality report is missing company-ASN audit metric: {marker}")

          print(f"Validated GeoIP protobuf payload: {os.path.getsize(output)} bytes")
          print("Unified DIRECT region: RU+BY+KZ (single emitted RU category) plus confirmed company affiliates.")
          print("Regional sources: Loyalsoldier RU/BY and v2fly RU/BY/KZ.")
          print("Blocked exclusions: exact host IPs, bounded explicit subnet CIDRs and curated Telegram routes; community/Re-filter candidates remain review-only.")
          print("Telemetry/privacy classifications do not subtract from DIRECT.")
          print("Hydra direct/whitelist is validated as candidate signal input, not as a strict RU GeoIP feed.")
          print("No v24 baseline is downloaded or used.")
          print("PRIVATE has precedence; direct/whitelist candidates are not subtracted.")
          print("RIR-RU/BY/KZ, curated company-affiliate ASN (all countryCode values), and global ipverse BGP audit artifacts are present.")
          print("Grimbird and Digne are treated as one correlated evidence group.")
          print("Per-prefix provenance and full/partial/not-observed BGP coverage are included.")
          print("Exact same-prefix BGP announcements are distinguished from address-space overlap.")
          print("Trusted-source overlap is measured by exact address-space intersection, not CIDR-count subtraction.")
          print("Raw source categories reconcile with assigned builder roles, including ignored categories.")
          PY

          # Independent v41 validation: the final GeoIP must contain exactly RU and PRIVATE,
          # with PRIVATE and the combined RKN set excluded from RU.
          test -s "$V41_OUTPUT_FILE"
          test -s "$V41_QUALITY_REPORT"
          test -s "$V41_MANIFEST"
          test -s "$V41_METRICS"
          test -s "$V41_PREFIX_PROVENANCE"
          test -s "$V41_BLOCKED_PROVENANCE"
          test -s "$RIR_RUKZBY_PREFIX_INPUT"
          test -s "$RIR_RUKZBY_STATS"
          python3 .github/scripts/validate_v41_overlay.py \
            --geoip "$V41_OUTPUT_FILE" \
            --hydra "$HYDRA_INPUT" \
            --blocked-union "$BLOCKED_IP_INPUT" \
            --blocked-exact "$BLOCKED_IP_EXACT_INPUT" \
            --blocked-resolved "$BLOCKED_IPRESOLVE_ONLY_INPUT" \
            --company-all "$COMPANY_ASN_PREFIXES" \
            --company-core "$CORE_COMPANY_PREFIXES" \
            --company-shared "$SHARED_INFRASTRUCTURE_PREFIXES" \
            --regional-origin-prefixes "$REGIONAL_ORIGIN_PREFIXES" \
            --kyoresuas-v4 "$KY_STANDARD_V4_INPUT" \
            --kyoresuas-v6 "$KY_STANDARD_V6_INPUT" \
            --kyoresuas-services "$KY_SERVICES_INPUT" \
            --w1zardz "$W1ZARDZ_INPUT" \
            --hxehex-ip "$HXEHEX_IP_INPUT" \
            --escapingworm "$ESCAPINGWORM_OPERATOR_INPUT" \
            --effective-blocked "$V41_BLOCKED_FILE" \
            --manifest "$V41_MANIFEST" \
            --quality "$V41_QUALITY_REPORT" \
            --rir "$RIR_RUKZBY_PREFIX_INPUT"

          echo "=== v41 RU+BY+KZ RIR resource inventory ==="
          cat "$RIR_RUKZBY_STATS"
          echo "=== v41 service source coverage ==="
          cat "$V41_METRICS"
          echo "=== v41 quality report ==="
          cat "$V41_QUALITY_REPORT"
          echo "=== v41 output SHA256 ==="
          sha256sum -c "$OUTPUT_SHA_FILE"

          echo "=== RIR registered RU address resources (BY/KZ ASN resources are separate) ==="
          cat "$RIR_STATS"
          echo "=== ASN and BGP statistics ==="
          cat "$ASN_STATS"
          echo "=== Curated Russian-company ASN manifest ==="
          cat "$COMPANY_ASN_MANIFEST"
          echo "=== Source contribution counts ==="
          cat "$SOURCE_COUNTS"
          echo "=== GeoIP categories ==="
          cat "$CATEGORY_FILE"
          echo "=== Source manifest ==="
          cat "$SOURCE_FILE"
          echo "=== Quality report ==="
          cat "$QUALITY_REPORT"
          echo "=== SHA256 ==="
          sha256sum -c "$OUTPUT_SHA_FILE"
          cat "$OUTPUT_SHA_FILE"

      - name: Enforce current-build v41 hard/DIRECT policy before release publication
        shell: bash
        run: |
          set -euo pipefail
          # Fatal invariants run against this job's *freshly built* outputs.
          python3 -m unittest discover -s .github/scripts -p 'test_validate_v41_release_gate.py' -v
          sha256sum -c "$OUTPUT_SHA_FILE"
          sha256sum -c "$V41_BLOCKED_SHA"
          python3 .github/scripts/validate_v41_release_gate.py \
            --geoip "$V41_OUTPUT_FILE" \
            --manifest "$V41_MANIFEST" \
            --quality "$V41_QUALITY_REPORT" \
            --hard "$BLOCKED_IP_EXACT_INPUT" \
            --effective "$V41_BLOCKED_FILE" \
            --core "$CORE_COMPANY_PREFIXES" \
            --shared "$SHARED_INFRASTRUCTURE_PREFIXES" \
            --rir "$RIR_RUKZBY_PREFIX_INPUT" \
            --kyoresuas-v4 "$KY_STANDARD_V4_INPUT" \
            --kyoresuas-v6 "$KY_STANDARD_V6_INPUT" \
            --kyoresuas-services "$KY_SERVICES_INPUT" \
            --w1zardz "$W1ZARDZ_INPUT" \
            --hxehex-ip "$HXEHEX_IP_INPUT" \
            --escapingworm "$ESCAPINGWORM_OPERATOR_INPUT"
          # This is the existing quality report shipped both as a Release
          # asset and in the generated release branch; no extra audit files.
          grep -q '^PRE_PUBLICATION_V41_HARD_POLICY_GATE$' "$V41_QUALITY_REPORT"
          {
            echo '### Pre-publication v41 DIRECT/hard quality gate'
            echo 'Current-build SHA-256 and routing invariants: PASS'
            echo 'Hard-source exceptions: see geoip_RU_quality_report.txt'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 17 "$V41_QUALITY_REPORT"

      - name: Verify absolute publication bounds independently
        shell: bash
        run: |
          python3 .github/scripts/validate_v41_publication_bounds.py \
            --candidate "$V41_OUTPUT_FILE" --reference "$V41_OUTPUT_FILE"

      - name: Upload v41 validated build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: geoip-direct-rukzby-v41-candidate
          path: |
            antifilter-community.lst
            antifilter-ip.lst
            antifilter-ipresolve.lst
            antifilter-ipsum.lst
            antifilter-subnet.lst
            escapingworm-operator-cidr.txt
            geoip_BY_KZ_registered_asns.txt
            geoip_RU.dat
            geoip_RU.dat.sha256sum
            geoip_RU_BY_KZ_asn_bgp_prefixes.txt
            geoip_RU_BY_KZ_asn_manifest.txt
            geoip_RU_BY_KZ_asn_stats.txt
            geoip_RU_BY_KZ_rir_registered_prefixes.tsv
            geoip_RU_BY_KZ_rir_stats.txt
            geoip_RU_blocked_ip_exact_and_legacy_hard.txt
            geoip_RU_blocked_ip_exclusions.txt
            geoip_RU_blocked_ip_exclusions.txt.sha256sum
            geoip_RU_blocked_ipresolve_resolver_only.txt
            geoip_RU_blocked_review_candidates.tsv
            geoip_RU_blocked_source_stats.txt
            geoip_RU_blocked_sources.sha256
            geoip_RU_categories.txt
            geoip_RU_category_audit.tsv
            geoip_RU_company_asn_bgp_prefixes.txt
            geoip_RU_company_asn_core_bgp_prefixes.txt
            geoip_RU_company_asn_manifest.tsv
            geoip_RU_company_asn_policy.tsv
            geoip_RU_company_asn_registry.sha256sum
            geoip_RU_company_asns.txt
            geoip_RU_global_bgp_prefixes.txt
            geoip_RU_input_provenance.tsv
            geoip_RU_input_provenance.tsv.sha256sum
            geoip_RU_quality_report.txt
            geoip_RU_registered_asns.txt
            geoip_RU_rir_registered_prefixes.txt
            geoip_RU_rir_stats.txt
            geoip_RU_shared_infrastructure_bgp_prefixes.txt
            geoip_RU_source_counts.txt
            geoip_RU_sources.txt
            geoip_RU_v37_additional_provenance.tsv
            geoip_RU_v37_base.dat
            geoip_RU_v37_base_quality_report.txt
            geoip_RU_v38_approved_blocked_baseline.txt
            geoip_RU_v38_pinned_antifilter-ip.lst
            geoip_RU_v38_pinned_antifilter-ipresolve.lst
            geoip_RU_v38_pinned_antifilter-subnet.lst
            geoip_RU_v41_blocked_ip_exclusions.txt
            geoip_RU_v41_blocked_ip_exclusions.txt.sha256sum
            geoip_RU_v41_blocked_provenance.tsv
            geoip_RU_v41_manifest.json
            geoip_RU_v41_prefix_provenance.tsv
            geoip_RU_v41_rir_ru_and_company_origin_prefixes.txt
            geoip_RU_v41_source_metrics.tsv
            hxehex-ipwhitelist.txt
            hydra-geoip.dat
            kyoresuas-ru-standard-ipv4.txt
            kyoresuas-ru-standard-ipv6.txt
            kyoresuas-services.json
            refilter-ipsum.lst
            w1zardz-ru-ipv4.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Checkout publication checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download validated build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: geoip-direct-rukzby-v41-candidate
          path: candidate

      - name: Verify independent publication bounds against prior release
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_geoip_sha256 }}
        run: |
          set -euo pipefail
          sha256sum -c "$OUTPUT_SHA_FILE"
          sha256sum -c "$V41_BLOCKED_SHA"
          grep -q '^PRE_PUBLICATION_V41_HARD_POLICY_GATE$' "$V41_QUALITY_REPORT"
          ref="$(git ls-remote --exit-code origin refs/heads/release | cut -f1)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 90 --max-filesize 8388608 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ref}/geoip_RU.dat" -o "$RUNNER_TEMP/previous-geoip.dat"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 90 --max-filesize 256 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ref}/geoip_RU.dat.sha256sum" -o "$RUNNER_TEMP/previous-geoip.sha"
          expected="$(awk 'NR==1 {print $1}' "$RUNNER_TEMP/previous-geoip.sha")"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/previous-geoip.dat" | sha256sum -c -
          python3 ../.github/scripts/validate_v41_publication_bounds.py \
            --candidate "$V41_OUTPUT_FILE" --reference "$RUNNER_TEMP/previous-geoip.dat" \
            --reviewed-sha256 "$REVIEWED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'PREVIOUS_RELEASE_SHA=%s\n' "$ref" >> "$GITHUB_ENV"

      - name: Publish release branch and versioned snapshot tag
        id: release_ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_dir="$PWD"
          dest="$(mktemp -d)"
          git -C "$dest" init
          git -C "$dest" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_B64"
          auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_B64}")
          git -C "$dest" "${auth[@]}" fetch --depth=1 origin refs/heads/release
          [[ "$(git -C "$dest" rev-parse FETCH_HEAD)" == "$PREVIOUS_RELEASE_SHA" ]]
          git -C "$dest" checkout -b release FETCH_HEAD
          git -C "$dest" rm -r --ignore-unmatch -- .
          for file in \
            "$V41_OUTPUT_FILE" "$OUTPUT_SHA_FILE" "$CATEGORY_FILE" "$SOURCE_FILE" \
            "$SOURCE_COUNTS" "$CATEGORY_AUDIT" "$V41_QUALITY_REPORT" "$QUALITY_REPORT" "$V41_METRICS" "$V41_PREFIX_PROVENANCE" "$V41_BLOCKED_PROVENANCE" "$V41_BLOCKED_FILE" "$V41_BLOCKED_SHA" "$V41_MANIFEST" "$PROVENANCE_FILE" "$ASN_MANIFEST" "$COMPANY_ASN_MANIFEST" "$COMPANY_ASN_PREFIXES" "$CORE_COMPANY_PREFIXES" "$SHARED_INFRASTRUCTURE_PREFIXES" "$COMPANY_ASN_POLICY" "$REGIONAL_ORIGIN_PREFIXES" "$COMPANY_ASN_REGISTRY" "geoip_RU_company_asn_registry.sha256sum" "$BLOCKED_IP_EXACT_INPUT" "$BLOCKED_IPRESOLVE_ONLY_INPUT" "$ASN_STATS" \
            "$RU_PREFIX_INPUT" "$RU_ASN_REGISTRY" "$BY_KZ_ASN_REGISTRY" "$RIR_PREFIX_INPUT" "$RIR_STATS" "$RIR_RUKZBY_PREFIX_INPUT" "$RIR_RUKZBY_STATS" "$GLOBAL_BGP_PREFIX_INPUT" \
            "$BLOCKED_IP_INPUT" "$BLOCKED_IP_SHA_FILE" "$BLOCKED_BASELINE_INPUT" "$BLOCKED_REVIEW_INPUT" "$BLOCKED_STATS_INPUT" "$BLOCKED_CHECKSUMS_INPUT" "$INPUT_PROVENANCE" "$INPUT_PROVENANCE_SHA" "$KY_STANDARD_V4_INPUT" "$KY_STANDARD_V6_INPUT" "$KY_SERVICES_INPUT" "$W1ZARDZ_INPUT" "$HXEHEX_IP_INPUT" "$ESCAPINGWORM_OPERATOR_INPUT" "$BLOCKED_IPSUM_INPUT"; do
            cp "$source_dir/$file" "$dest/$(basename "$file")"
          done
          git -C "$dest" config user.name "github-actions[bot]"
          git -C "$dest" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$dest" add --all
          if ! git -C "$dest" diff --cached --quiet; then
            git -C "$dest" commit -m "Publish GeoIP DIRECT RU+BY+KZ CLIENT v41"
          fi
          snapshot="geoip-v41-snapshot-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          if git -C "$dest" "${auth[@]}" ls-remote --exit-code origin "refs/tags/$snapshot"; then
            echo "::error::Snapshot tag already exists: $snapshot"
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi
          git -C "$dest" tag "$snapshot"
          GIT_TERMINAL_PROMPT=0 git -C "$dest" "${auth[@]}" push --atomic origin \
            HEAD:refs/heads/release "refs/tags/$snapshot"
          printf 'snapshot=%s\n' "$snapshot" >> "$GITHUB_OUTPUT"

      - name: Publish versioned GeoIP snapshot
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ steps.release_ref.outputs.snapshot }}
          name: GeoIP v41 versioned snapshot
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            candidate/geoip_RU.dat
            candidate/geoip_RU.dat.sha256sum
            candidate/geoip_RU_v41_manifest.json
            candidate/geoip_RU_quality_report.txt
          body: |
            Versioned snapshot of the validated release branch and GeoIP database.
            This workflow never updates an existing snapshot tag.

      - name: Publish GitHub Release
        # v3.0.3; pin the action implementation to an immutable commit.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: latest-geoip-client-v41
          name: "GeoIP DIRECT RU+BY+KZ CLIENT v41"
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            candidate/geoip_RU.dat
            candidate/geoip_RU.dat.sha256sum
