name: Reachability validation

on:
  push:
    branches:
      - feature/reachability-full-ru-kz-by
    paths:
      - ".github/reachability/runner.py"
      - ".github/reachability/test_runner.py"
      - ".github/reachability/vpn_gate.py"
      - ".github/reachability/test_vpn_gate.py"
      - ".github/reachability/home_probe.py"
      - ".github/reachability/test_home_probe.py"
      - ".github/reachability/home_probe_ingest.py"
      - ".github/reachability/test_home_probe_ingest.py"
      - ".github/reachability/targets.json"
      - ".github/reachability/inventory/**"
      - ".github/workflows/reachability-validation.yml"
      - ".github/workflows/reachability-vpn-gate.yml"
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - main
    paths:
      - ".github/reachability/runner.py"
      - ".github/reachability/test_runner.py"
      - ".github/reachability/vpn_gate.py"
      - ".github/reachability/test_vpn_gate.py"
      - ".github/reachability/home_probe.py"
      - ".github/reachability/test_home_probe.py"
      - ".github/reachability/home_probe_ingest.py"
      - ".github/reachability/test_home_probe_ingest.py"
      - ".github/reachability/targets.json"
      - ".github/reachability/inventory/**"
      - ".github/workflows/reachability-validation.yml"
      - ".github/workflows/reachability-vpn-gate.yml"

permissions:
  contents: read

concurrency:
  group: reachability-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate inventory exporter and collectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@0778a10ce47b5d450cf60fb94fafad4330008a35
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: .github/reachability/inventory/go.mod

      - name: Validate Python and JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile .github/reachability/runner.py .github/reachability/test_runner.py .github/reachability/vpn_gate.py .github/reachability/test_vpn_gate.py .github/reachability/home_probe.py .github/reachability/test_home_probe.py .github/reachability/home_probe_ingest.py .github/reachability/test_home_probe_ingest.py
          python3 -m json.tool .github/reachability/targets.json >/dev/null
          python3 -m unittest discover -s .github/reachability -p 'test_*.py' -v

      - name: Test Go protobuf inventory exporter
        shell: bash
        run: |
          set -euo pipefail
          cd .github/reachability/inventory
          test -z "$(gofmt -d main.go main_test.go)"
          GOTOOLCHAIN=local go mod tidy
          GOTOOLCHAIN=local go test ./...
          GOTOOLCHAIN=local go build -o /tmp/geoip-reachability-inventory .
