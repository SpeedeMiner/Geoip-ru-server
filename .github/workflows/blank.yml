name: Build Unified GeoIP DIRECT RU+BY+KZ CLIENT v35

on:
  workflow_dispatch:
  schedule:
    # Daily refresh; one unified DIRECT set covers RU+BY+KZ, with bounded blocked-destination carve-outs.
    - cron: "45 3 * * *"
  push:
    branches:
      - main

concurrency:
  group: geoip-direct-ru-by-kz-v35-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      HYDRA_INPUT: hydra-geoip.dat
      GRIMBIRD_INPUT: grimbird-geoip.dat
      DIGNE_INPUT: digne-geoip.dat
      DAVOYAN_INPUT: davoyan-geoip.dat
      KIRILL_INPUT: kirill-geoip.dat
      GOLUKON_INPUT: golukon-geoip.dat
      V2FLY_INPUT: v2fly-geoip.dat
      V2FLY_SHA_INPUT: v2fly-geoip.dat.sha256sum
      LOYALSOLDIER_RU_INPUT: loyalsoldier-ru.dat
      LOYALSOLDIER_BY_INPUT: loyalsoldier-by.dat
      LOYALSOLDIER_PRIVATE_INPUT: loyalsoldier-private.dat
      HXEHEX_INPUT: hxehex-cidrwhitelist.txt
      W1ZARDZ_INPUT: w1zardz-ru-ipv4.txt
      RU_ASN_REGISTRY: geoip_RU_registered_asns.txt
      BY_KZ_ASN_REGISTRY: geoip_BY_KZ_registered_asns.txt
      COMPANY_ASN_REGISTRY: geoip_RU_company_asns.txt
      AFRINIC_STATS: delegated-afrinic-latest
      APNIC_STATS: delegated-apnic-latest
      ARIN_STATS: delegated-arin-extended-latest
      LACNIC_STATS: delegated-lacnic-latest
      RIPENCC_STATS: delegated-ripencc-latest
      IPVERSE_BGP_ARCHIVE: as-ip-blocks.tar.gz
      RU_PREFIX_INPUT: geoip_RU_BY_KZ_asn_bgp_prefixes.txt
      RIR_PREFIX_INPUT: geoip_RU_rir_registered_prefixes.txt
      RIR_STATS: geoip_RU_rir_stats.txt
      GLOBAL_BGP_PREFIX_INPUT: geoip_RU_global_bgp_prefixes.txt
      IANA_V4_CSV: iana-ipv4-special-registry.csv
      IANA_V6_CSV: iana-ipv6-special-registry.csv
      IANA_PRIVATE_PREFIX_INPUT: geoip_RU_iana_non_global_prefixes.txt
      IANA_REACHABLE_PREFIX_INPUT: geoip_RU_iana_global_exceptions.txt
      QUALITY_REPORT: geoip_RU_quality_report.txt
      PROVENANCE_FILE: geoip_RU_additional_provenance.tsv
      ASN_MANIFEST: geoip_RU_BY_KZ_asn_manifest.txt
      COMPANY_ASN_MANIFEST: geoip_RU_company_asn_manifest.tsv
      ASN_STATS: geoip_RU_BY_KZ_asn_stats.txt
      SOURCE_COUNTS: geoip_RU_source_counts.txt
      CATEGORY_AUDIT: geoip_RU_category_audit.tsv
      OUTPUT_FILE: geoip_RU.dat
      CATEGORY_FILE: geoip_RU_categories.txt
      SOURCE_FILE: geoip_RU_sources.txt
      OUTPUT_SHA_FILE: geoip_RU.dat.sha256sum
      BLOCKED_IP_INPUT: geoip_RU_blocked_ip_exclusions.txt
      BLOCKED_IP_SHA_FILE: geoip_RU_blocked_ip_exclusions.txt.sha256sum
      BLOCKED_IP_RAW_INPUT: antifilter-ip.lst
      BLOCKED_IPRESOLVE_INPUT: antifilter-ipresolve.lst
      BLOCKED_SUBNET_INPUT: antifilter-subnet.lst
      BLOCKED_COMMUNITY_INPUT: antifilter-community.lst
      BLOCKED_REFILTER_INPUT: refilter-ipsum.lst
      BLOCKED_REVIEW_INPUT: geoip_RU_blocked_review_candidates.tsv
      BLOCKED_STATS_INPUT: geoip_RU_blocked_source_stats.txt
      BLOCKED_CHECKSUMS_INPUT: geoip_RU_blocked_sources.sha256

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Download RU/BY/KZ GeoIP sources, blocked-IP snapshot, RIR, IANA and BGP data
        shell: bash
        run: |
          set -euo pipefail

          # The curated registry is embedded as a safe default so this workflow can
          # run even when only the workflow file was committed. A repository-root
          # geoip_RU_company_asns.txt always takes precedence and can be customized.
          if [[ ! -s "$COMPANY_ASN_REGISTRY" ]]; then
            echo "::notice::Company ASN registry not found; creating the embedded default allowlist."
            cat > "$COMPANY_ASN_REGISTRY" <<'COMPANY_ASN_REGISTRY_DEFAULT'
          # Curated Russian-company and confirmed affiliate ASN allowlist for unified DIRECT RU+BY+KZ v35.
          # Format: ASN<TAB>COMPANY_GROUP<TAB>REGISTERED_ENTITY_OR_NOTE<TAB>EVIDENCE_URL
          # All BGP prefixes originated by these ASNs are added even when ipverse countryCode is not RU.
          # Only listed origin ASNs are included; upstreams/peers are NOT recursively imported. AS208398 is a transit/upstream and is intentionally not imported wholesale.
          # Prefix source is ipverse aggregated.json, an observation dataset covering up to 90 days.
          AS13238	Yandex	YANDEX LLC	https://iamroot.tech/asndatabase/?search=AS13238
          AS200350	Yandex	Yandex.Cloud LLC	https://wbdt.ru/AS200350
          AS202611	Yandex	Yandex.Telecom LLC	https://bgp.he.net/AS202611
          AS215013	Yandex	Yandex.Cloud LLC (YCCDN)	https://ipctl.io/as/215013
          AS208795	Yandex	Yandex Cloud Kazakhstan LLP (affiliate ASN)	https://asn.ipinfo.app/AS208795
          AS207304	Yandex	Y. Izdeu men Jarnama LLP (Yandex Kazakhstan)	https://www.iplocate.io/AS207304
          AS212066	Yandex	Buyuk Reklam Cozumleri LLC (Yandex Turkey; origin ASN, not upstream)	https://www.iplocate.io/AS212066
          AS47541	VK/Mail.ru	LLC VK	https://prefixkit.com/ru/service-ip-ranges/vk-mailru/
          AS47542	VK/Mail.ru	VKontakte Ltd / LLC VK	https://prefixkit.com/ru/service-ip-ranges/vk-mailru/
          AS28709	VK/Mail.ru	LLC VK	https://wbdt.ru/AS28709
          AS47764	VK/Mail.ru	LLC VK (Mail.Ru Group legacy ASN)	https://wbdt.ru/AS47764
          AS49053	Wildberries	LLC Wildberries	https://wbdt.ru/AS49053
          AS57073	Wildberries	LLC Wildberries	https://wbdt.ru/AS57073
          AS201512	Wildberries	LLC Wildberries (CDN ASN)	https://iamroot.tech/asndatabase/?search=AS201512
          AS211517	Wildberries	LLC Wildberries (Georgia/affiliate ASN)	https://iamroot.tech/asndatabase/?search=AS211517
          AS44386	Ozon	LLC Internet Solutions (Ozon)	https://wbdt.ru/AS44386
          AS35237	Sberbank	Sberbank of Russia PJSC	https://bgp.he.net/AS35237
          AS49505	Selectel	JSC Selectel	https://bgp.he.net/AS49505
          AS50340	Selectel	JSC Selectel MSK	https://bgp.he.net/AS50340
          AS208677	Cloud.ru	Cloud Technologies LLC / Cloud.ru	https://asn.ipinfo.app/AS208677
          AS210756	EdgeCenter	EdgeCenter LLC	https://www.bigdatacloud.com/asn-lookup/AS210756
          AS57724	DDoS-Guard	DDoS-Guard Ltd	https://bgp.he.net/AS57724
          AS9123	Timeweb	JSC TIMEWEB	https://iptrust.co/tools/asn/country/RU
          AS34879	NGENIX	NGENIX	https://asnbase.com/countries/ru?type=content
          AS12389	Rostelecom	PJSC Rostelecom	https://bgp.he.net/country/RU
          AS42610	Rostelecom	PJSC Rostelecom (Moscow access ASN)	https://ipcheckerpro.com/asn?cc=RU
          AS8359	MTS	MTS PJSC	https://asnbase.com/countries/ru
          AS12714	MegaFon	PJSC MegaFon	https://asnbase.com/countries/ru
          AS31133	MegaFon	PJSC MegaFon (MF-MGSM)	https://asnbase.com/countries/ru
          AS3216	Beeline/VimpelCom	PJSC VimpelCom	https://bgp.he.net/country/RU
          AS8402	Beeline/VimpelCom	PJSC VimpelCom / Corbina	https://ipcheckerpro.com/asn?cc=RU
          AS20485	TransTelecom	JSC TransTeleCom	https://bgp.he.net/country/RU
          AS15774	TransTelecom	TTK-Svyaz LLC	https://iptrust.co/tools/asn/country/RU
          AS9049	ER-Telecom	JSC ER-Telecom Holding	https://iptrust.co/tools/asn/country/RU
          AS48858	ER-Telecom	JSC ER-Telecom Holding	https://bgp.he.net/country/RU
          AS25513	MGTS	PJSC Moscow City Telephone Network	https://ipcheckerpro.com/asn?cc=RU
          COMPANY_ASN_REGISTRY_DEFAULT
          fi

          if [[ ! -s "$COMPANY_ASN_REGISTRY" ]]; then
            echo "::error::Unable to create curated company ASN registry: $COMPANY_ASN_REGISTRY"
            exit 1
          fi

          # Preserve repository customizations, but ensure the separately-originated
          # Yandex Kazakhstan and Yandex Turkey ASNs are not lost when an older
          # pre-existing allowlist is present. AS208398 remains upstream-only.
          python3 - "$COMPANY_ASN_REGISTRY" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          required = {
              "AS207304": "AS207304\tYandex\tY. Izdeu men Jarnama LLP (Yandex Kazakhstan)\thttps://www.iplocate.io/AS207304",
              "AS212066": "AS212066\tYandex\tBuyuk Reklam Cozumleri LLC (Yandex Turkey origin ASN)\thttps://www.iplocate.io/AS212066",
          }
          existing = {}
          for number, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              fields = raw.split("\t")
              if len(fields) != 4:
                  raise SystemExit(f"Malformed company ASN registry line {number}: expected four TSV fields")
              existing[fields[0].upper()] = raw
          additions = []
          for asn, row in required.items():
              if asn not in existing:
                  additions.append(row)
              elif existing[asn] != row:
                  # Same ASN already has a user-curated description/evidence. Keep it.
                  print(f"::notice::Preserving existing user entry for {asn}; verify entity/evidence manually if needed")
          if additions:
              with path.open("a", encoding="utf-8") as handle:
                  handle.write("\n" + "\n".join(additions) + "\n")
              print("Merged required Yandex regional origin ASNs:", ", ".join(row.split("\t", 1)[0] for row in additions))
          PY

          download_file() {
            local label="$1"
            local output="$2"
            shift 2
            local tmp="${output}.part"
            local url
            rm -f "$tmp"

            for url in "$@"; do
              echo "::group::${label}"
              echo "Trying: ${url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 180 \
                --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 240 \
                --output "$tmp" "$url"; then
                if [[ -s "$tmp" ]]; then
                  mv "$tmp" "$output"
                  echo "Downloaded ${label}: $(wc -c < "$output") bytes"
                  echo "::endgroup::"
                  return 0
                fi
                echo "Empty response from ${url}"
              else
                echo "Download failed from ${url}"
              fi
              rm -f "$tmp"
              echo "Trying next mirror..."
              echo "::endgroup::"
            done

            echo "::error::Unable to download required source: ${label}"
            return 1
          }

          download_optional_file() {
            local label="$1" output="$2" url="$3" tmp="${2}.part"
            rm -f "$tmp"
            if curl --fail --location --silent --show-error --connect-timeout 20 --max-time 180 \
                 --retry 2 --retry-all-errors --retry-delay 2 --output "$tmp" "$url" && [[ -s "$tmp" ]]; then
              mv "$tmp" "$output"
              echo "Downloaded optional ${label}: $(wc -c < "$output") bytes"
            else
              rm -f "$tmp"
              printf '# Optional source unavailable during this build: %s\n' "$url" > "$output"
              echo "::warning::Optional review-only source unavailable: ${label}; continuing without its candidates."
            fi
          }

          # Kirill publishes geoip.dat as a GitHub Release asset, not as a file
          # under the main branch. Resolve the latest asset through the official
          # GitHub REST API first; this avoids relying on the browser_download_url
          # host alone when github.com/release-assets returns transient HTTP 5xx.
          download_kirill_geoip() {
            local label="KIRILL RU WHITELIST"
            local output="$KIRILL_INPUT"
            local repo="kirilllavrov/RU-domain-list-for-whitelist"
            local metadata="${output}.release.json"
            local tmp="${output}.part"
            local api_url asset_id="" tag_name="" asset_digest="" asset_info=""
            local expected_sha="" actual_sha="" url
            rm -f "$metadata" "$tmp"

            for api_url in \
              "https://api.github.com/repos/${repo}/releases/latest" \
              "https://api.github.com/repos/${repo}/releases/tags/0.3.11"; do
              echo "Resolving ${label} asset through: ${api_url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 90 \
                --retry 2 --retry-all-errors --retry-delay 2 \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "User-Agent: geoip-russia-builder" \
                --output "$metadata" "$api_url"; then
                asset_info="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); a=next((x for x in d.get("assets", []) if x.get("name") == "geoip.dat"), {}); print("\t".join((str(a.get("id", "")), str(d.get("tag_name", "")), str(a.get("digest", "") or ""))))' "$metadata" 2>/dev/null || true)"
                IFS=$'\t' read -r asset_id tag_name asset_digest <<< "$asset_info"
                if [[ "$asset_id" =~ ^[0-9]+$ ]]; then
                  echo "Found geoip.dat release asset: tag=${tag_name:-unknown}, asset_id=${asset_id}"
                  if curl --fail --location --silent --show-error \
                    --connect-timeout 20 --max-time 240 \
                    --retry 3 --retry-all-errors --retry-delay 3 \
                    --header "Accept: application/octet-stream" \
                    --header "X-GitHub-Api-Version: 2022-11-28" \
                    --header "User-Agent: geoip-russia-builder" \
                    --output "$tmp" \
                    "https://api.github.com/repos/${repo}/releases/assets/${asset_id}"; then
                    if [[ -s "$tmp" ]] && [[ "$(wc -c < "$tmp")" -gt 32 ]] && \
                      python3 -c 'import sys; b=open(sys.argv[1], "rb").read(8); sys.exit(0 if len(b) >= 2 and b[0] == 0x0a else 1)' "$tmp"; then
                      if [[ "$asset_digest" == sha256:* ]]; then
                        expected_sha="${asset_digest#sha256:}"
                        actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                        if [[ "$actual_sha" != "$expected_sha" ]]; then
                          echo "SHA256 mismatch for ${label}: expected=${expected_sha}, actual=${actual_sha}"
                          rm -f "$tmp"
                          continue
                        fi
                      fi
                      mv "$tmp" "$output"
                      rm -f "$metadata"
                      echo "Downloaded and validated ${label} through GitHub Release API: $(wc -c < "$output") bytes"
                      return 0
                    fi
                    echo "GitHub API response is not a valid-looking Xray GeoIP protobuf asset"
                  else
                    echo "GitHub Release API asset download failed for asset_id=${asset_id}"
                  fi
                else
                  echo "Release metadata does not contain geoip.dat"
                fi
              else
                echo "Could not retrieve release metadata from ${api_url}"
              fi
              rm -f "$tmp" "$metadata"
            done

            echo "GitHub API route unavailable; trying official Release URL and independent mirrors"
            for url in \
              "https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://gh-proxy.org/https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://gh-proxy.com/https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://ghproxy.net/https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://ghfast.top/https://github.com/${repo}/releases/latest/download/geoip.dat"; do
              rm -f "$tmp"
              echo "Trying ${label} mirror: ${url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 240 \
                --retry 2 --retry-all-errors --retry-delay 3 \
                --output "$tmp" "$url"; then
                if [[ -s "$tmp" ]] && \
                  python3 -c 'import sys; b=open(sys.argv[1], "rb").read(8); sys.exit(0 if len(b) >= 2 and b[0] == 0x0a else 1)' "$tmp"; then
                  if [[ "$asset_digest" == sha256:* ]]; then
                    expected_sha="${asset_digest#sha256:}"
                    actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                    if [[ "$actual_sha" != "$expected_sha" ]]; then
                      echo "SHA256 mismatch for ${label} mirror ${url}"
                      rm -f "$tmp"
                      continue
                    fi
                  fi
                  mv "$tmp" "$output"
                  echo "Downloaded and validated ${label} from mirror: $(wc -c < "$output") bytes"
                  rm -f "$metadata"
                  return 0
                fi
                echo "Mirror returned an invalid or empty GeoIP protobuf: ${url}"
              else
                echo "Mirror download failed: ${url}"
              fi
            done

            rm -f "$tmp" "$metadata" "$output"
            echo "::error::Unable to download a valid ${label} asset from GitHub API or mirrors"
            return 1
          }

          echo "==============================================="
          echo "Downloading GeoIP sources for unified DIRECT RU+BY+KZ"
          echo "==============================================="

          download_file "HYDRA" "$HYDRA_INPUT" \
            "https://github.com/hydraponique/roscomvpn-geoip/releases/latest/download/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geoip@master/release/geoip.dat"

          download_file "GRIMBIRD" "$GRIMBIRD_INPUT" \
            "https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/GrimbirdUsers/ru-routing-dat@main/geoip.dat"

          download_file "DIGNE" "$DIGNE_INPUT" \
            "https://cdn.jsdelivr.net/gh/DigneZzZ/routing@main/v2ray/geoip.dat" \
            "https://fastly.jsdelivr.net/gh/DigneZzZ/routing@main/v2ray/geoip.dat" \
            "https://raw.githubusercontent.com/DigneZzZ/routing/main/v2ray/geoip.dat"

          download_file "DAVOYAN" "$DAVOYAN_INPUT" \
            "https://raw.githubusercontent.com/Davoyan/xray-routing/main/release/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/Davoyan/xray-routing@main/release/geoip.dat"

          # Kirill is part of the existing RU whitelist base. Fetch its actual
          # Release asset via the GitHub API and independent Release mirrors.
          # Do not substitute a nonexistent main/release/geoip.dat path.
          download_kirill_geoip

          download_file "GOLUKON" "$GOLUKON_INPUT" \
            "https://raw.githubusercontent.com/golukon/russia-only-geoip/release/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/golukon/russia-only-geoip@release/geoip.dat" \
            "https://fastly.jsdelivr.net/gh/golukon/russia-only-geoip@release/geoip.dat"

          # v2fly publishes the full V2Ray GeoIP protobuf database and a SHA-256
          # sidecar. Verify the exact upstream bytes before importing only the selected RU, BY and KZ country entries.
          download_file "V2FLY GEOIP SHA256" "$V2FLY_SHA_INPUT" \
            "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat.sha256sum" \
            "https://cdn.jsdelivr.net/gh/v2fly/geoip@release/geoip.dat.sha256sum" \
            "https://raw.githubusercontent.com/v2fly/geoip/release/geoip.dat.sha256sum"
          download_file "V2FLY GEOIP (RU/BY/KZ CATEGORIES ONLY)" "$V2FLY_INPUT" \
            "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/v2fly/geoip@release/geoip.dat" \
            "https://raw.githubusercontent.com/v2fly/geoip/release/geoip.dat"
          V2FLY_EXPECTED_SHA="$(awk 'NF {print $1; exit}' "$V2FLY_SHA_INPUT" | tr -d '\r')"
          if [[ ! "$V2FLY_EXPECTED_SHA" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Invalid v2fly geoip.dat.sha256sum format"
            exit 1
          fi
          V2FLY_ACTUAL_SHA="$(sha256sum "$V2FLY_INPUT" | awk '{print $1}')"
          if [[ "$V2FLY_ACTUAL_SHA" != "$V2FLY_EXPECTED_SHA" ]]; then
            echo "::error::v2fly geoip.dat SHA-256 mismatch: expected=$V2FLY_EXPECTED_SHA actual=$V2FLY_ACTUAL_SHA"
            exit 1
          fi
          echo "v2fly geoip.dat SHA-256 verified: $V2FLY_ACTUAL_SHA"

          download_file "LOYALSOLDIER RU (CORE SOURCE, NOT A MASK)" "$LOYALSOLDIER_RU_INPUT" \
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/ru.dat" \
            "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/ru.dat" \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/dat/ru.dat"

          download_file "LOYALSOLDIER BY (BELARUS DIRECT LAYER)" "$LOYALSOLDIER_BY_INPUT" \
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/by.dat" \
            "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/by.dat" \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/dat/by.dat"

          download_file "LOYALSOLDIER PRIVATE" "$LOYALSOLDIER_PRIVATE_INPUT" \
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/private.dat" \
            "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/private.dat" \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/dat/private.dat"

          download_file "HXEHEX MOBILE WHITELIST" "$HXEHEX_INPUT" \
            "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt" \
            "https://cdn.jsdelivr.net/gh/hxehex/russia-mobile-internet-whitelist@main/cidrwhitelist.txt"

          download_file "W1ZARDZ RU DIRECT IPV4" "$W1ZARDZ_INPUT" \
            "https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/dist/ru-direct-ipv4.txt" \
            "https://cdn.jsdelivr.net/gh/w1zardz/amnezia-vpn-russia-split-tunneling@master/dist/ru-direct-ipv4.txt"

          echo "==============================================="
          echo "Downloading additive RU ASN/BGP data"
          echo "==============================================="

          # RIPEstat's Country Resource List is itself derived from RIR delegated
          # statistics. Avoid making the RIPEstat API a single point of failure:
          # fetch each RIR's authoritative daily file, with cross-RIR mirrors.
          echo "==============================================="
          echo "Downloading five RIR delegated statistics files"
          echo "==============================================="

          download_file "AFRINIC DELEGATED STATS" "$AFRINIC_STATS" \
            "https://ftp.afrinic.net/pub/stats/afrinic/delegated-afrinic-latest" \
            "https://ftp.apnic.net/pub/stats/afrinic/delegated-afrinic-latest" \
            "https://ftp.ripe.net/pub/stats/afrinic/delegated-afrinic-latest"

          download_file "APNIC DELEGATED STATS" "$APNIC_STATS" \
            "https://ftp.apnic.net/pub/stats/apnic/delegated-apnic-latest" \
            "https://ftp.ripe.net/pub/stats/apnic/delegated-apnic-latest" \
            "https://ftp.afrinic.net/pub/stats/apnic/delegated-apnic-latest"

          download_file "ARIN DELEGATED STATS" "$ARIN_STATS" \
            "https://ftp.arin.net/pub/stats/arin/delegated-arin-extended-latest" \
            "https://ftp.arin.net/pub/stats/arin/delegated-arin-latest" \
            "https://ftp.ripe.net/pub/stats/arin/delegated-arin-extended-latest" \
            "https://ftp.apnic.net/pub/stats/arin/delegated-arin-extended-latest"

          download_file "LACNIC DELEGATED STATS" "$LACNIC_STATS" \
            "https://ftp.lacnic.net/pub/stats/lacnic/delegated-lacnic-latest" \
            "https://ftp.ripe.net/pub/stats/lacnic/delegated-lacnic-latest" \
            "https://ftp.apnic.net/pub/stats/lacnic/delegated-lacnic-latest"

          download_file "RIPE NCC DELEGATED STATS" "$RIPENCC_STATS" \
            "https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest" \
            "https://ftp.apnic.net/pub/stats/ripencc/delegated-ripencc-latest" \
            "https://ftp.afrinic.net/pub/stats/ripencc/delegated-ripencc-latest"

          # Official IANA Special-Purpose registries. IANA currently publishes the CSV
          # download under the numbered filename *-1.csv (not the registry-name.csv URL).
          # Non-globally-reachable entries
          # are included in PRIVATE; globally-reachable exceptions are subtracted back
          # out so broad special-purpose blocks do not swallow explicit exceptions.
          download_file "IANA IPV4 SPECIAL REGISTRY" "$IANA_V4_CSV" \
            "https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry-1.csv"
          download_file "IANA IPV6 SPECIAL REGISTRY" "$IANA_V6_CSV" \
            "https://www.iana.org/assignments/iana-ipv6-special-registry/iana-ipv6-special-registry-1.csv"

          # Extract RU-registered ASNs AND RU-registered IPv4/IPv6 resources from
          # the five authoritative RIR delegated-stat snapshots. IP registration
          # country is a corroborating registry signal, not proof of server location.
          python3 - "$AFRINIC_STATS" "$APNIC_STATS" "$ARIN_STATS" \
            "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" \
            "$RIR_PREFIX_INPUT" "$RIR_STATS" "$BY_KZ_ASN_REGISTRY" <<'PY'
          import datetime
          import ipaddress
          import pathlib
          import sys

          inputs = [
              ("afrinic", pathlib.Path(sys.argv[1])),
              ("apnic", pathlib.Path(sys.argv[2])),
              ("arin", pathlib.Path(sys.argv[3])),
              ("lacnic", pathlib.Path(sys.argv[4])),
              ("ripencc", pathlib.Path(sys.argv[5])),
          ]
          asn_output = pathlib.Path(sys.argv[6])
          prefix_output = pathlib.Path(sys.argv[7])
          stats_output = pathlib.Path(sys.argv[8])
          by_kz_asn_output = pathlib.Path(sys.argv[9])
          asns_by_country = {"RU": set(), "BY": set(), "KZ": set()}
          asns = asns_by_country["RU"]
          by_kz_asns = set()
          rir_prefixes = set()
          rir_v4_prefixes = set()
          rir_v6_prefixes = set()
          summaries = []
          today = datetime.date.today()
          raw_asn_records = raw_v4_records = raw_v6_records = 0
          generated_v4_cidr_components = generated_v6_cidr_components = 0

          def prefix_sort(value):
              net = ipaddress.ip_network(value)
              return net.version, int(net.network_address), net.prefixlen

          for expected_registry, path in inputs:
              try:
                  lines = path.read_text(encoding="utf-8", errors="strict").splitlines()
              except (OSError, UnicodeError) as exc:
                  raise SystemExit(f"Cannot read {expected_registry} delegated stats: {exc}")
              if not lines:
                  raise SystemExit(f"Empty delegated stats file: {path}")

              header = None
              for line in lines:
                  normalized = line.lstrip("\ufeff").strip()
                  if not normalized or normalized.startswith("#"):
                      continue
                  fields = [field.strip() for field in normalized.split("|")]
                  if (len(fields) >= 7 and (fields[0] == "2" or fields[0].startswith("2."))
                          and fields[1].lower() == expected_registry):
                      header = fields
                      break
              if header is None:
                  first_nonempty = next((line.strip() for line in lines if line.strip()), "<empty>")
                  raise SystemExit(
                      f"Invalid/mismatched {expected_registry} stats header in {path}; "
                      f"first non-empty line: {first_nonempty[:160]!r}"
                  )

              try:
                  snapshot_date = datetime.datetime.strptime(header[5], "%Y%m%d").date()
              except ValueError:
                  raise SystemExit(f"Invalid snapshot enddate in {expected_registry}: {header[5]!r}")
              age_days = (today - snapshot_date).days
              if age_days < -1 or age_days > 14:
                  raise SystemExit(
                      f"Stale/future {expected_registry} delegated stats: {snapshot_date} ({age_days} days old)"
                  )

              count_asn = count_v4 = count_v6 = 0
              registry_v4_components = registry_v6_components = 0
              registry_prefixes = set()
              for line in lines:
                  normalized = line.lstrip("\ufeff").strip()
                  if not normalized or normalized.startswith("#"):
                      continue
                  fields = [field.strip() for field in normalized.split("|")]
                  if len(fields) < 7:
                      continue
                  registry, country, resource_type, start, value, _date, status = fields[:7]
                  country_code = country.upper()
                  if registry.lower() != expected_registry or country_code not in {"RU", "BY", "KZ"}:
                      continue
                  if status.lower() not in {"allocated", "assigned", "legacy"}:
                      continue

                  kind = resource_type.lower()
                  if kind == "asn":
                      try:
                          first, count = int(start), int(value)
                      except ValueError:
                          continue
                      if first < 1 or count < 1 or first + count - 1 > 4294967295:
                          continue
                      asns_by_country[country_code].update(range(first, first + count))
                      if country_code == "RU":
                          count_asn += 1
                      continue

                  # The RU resource list remains a corroborating input for RU geographic feeds.
                  # BY/KZ public address resources are not blindly imported: their GeoIP country
                  # categories and observed regional-origin BGP prefixes form the DIRECT layers.
                  if country_code != "RU":
                      continue

                  if kind == "ipv4":
                      try:
                          first_ip = ipaddress.ip_address(start)
                          count = int(value)
                          if first_ip.version != 4 or count < 1:
                              continue
                          last_int = int(first_ip) + count - 1
                          if last_int > (1 << 32) - 1:
                              continue
                          last_ip = ipaddress.ip_address(last_int)
                          nets = list(ipaddress.summarize_address_range(first_ip, last_ip))
                          for net in nets:
                              if net.prefixlen == 0:
                                  continue
                              value = str(net)
                              rir_prefixes.add(value)
                              rir_v4_prefixes.add(value)
                              registry_prefixes.add(value)
                              registry_v4_components += 1
                          count_v4 += 1
                      except (ValueError, TypeError):
                          continue
                      continue

                  if kind == "ipv6":
                      try:
                          prefixlen = int(value)
                          if not 0 < prefixlen <= 128:
                              continue
                          net = ipaddress.ip_network(f"{start}/{prefixlen}", strict=False)
                          if net.version != 6 or net.prefixlen == 0:
                              continue
                          value = str(net)
                          rir_prefixes.add(value)
                          rir_v6_prefixes.add(value)
                          registry_prefixes.add(value)
                          registry_v6_components += 1
                          count_v6 += 1
                      except (ValueError, TypeError):
                          continue

              raw_asn_records += count_asn
              raw_v4_records += count_v4
              raw_v6_records += count_v6
              generated_v4_cidr_components += registry_v4_components
              generated_v6_cidr_components += registry_v6_components
              note = " (zero valid for an RIR with no RU records of this type)"
              summaries.append(
                  f"{expected_registry}: snapshot={snapshot_date}, ASN records={count_asn}, "
                  f"IPv4 resource records={count_v4}, IPv4 CIDR components={registry_v4_components}, "
                  f"IPv6 resource records={count_v6}, IPv6 CIDR components={registry_v6_components}, "
                  f"registry-local unique CIDRs={len(registry_prefixes)}{note}"
              )
              print(summaries[-1])

          by_kz_asns = asns_by_country["BY"] | asns_by_country["KZ"]
          if len(asns) < 25 or len(asns) > 100000:
              raise SystemExit(f"RIR ASN registry sanity check failed: {len(asns)} unique RU ASNs")
          if len(asns_by_country["BY"]) < 10 or len(asns_by_country["KZ"]) < 10:
              raise SystemExit(
                  f"RIR regional ASN inventory is unexpectedly sparse: BY={len(asns_by_country['BY'])}, KZ={len(asns_by_country['KZ'])}"
              )
          if len(by_kz_asns) < 25 or len(by_kz_asns) > 100000:
              raise SystemExit(f"RIR BY/KZ ASN registry sanity check failed: {len(by_kz_asns)} unique BY/KZ ASNs")
          if not rir_prefixes:
              raise SystemExit("RIR RU IPv4/IPv6 resource inventory is empty; refusing unverified build")

          with asn_output.open("w", encoding="utf-8") as handle:
              handle.write("# Unique RU ASNs from allocated, assigned and legacy records in five RIR delegated stats files\n")
              for asn in sorted(asns):
                  handle.write(f"AS{asn}\n")

          with by_kz_asn_output.open("w", encoding="utf-8") as handle:
              handle.write("# Unique BY/KZ ASNs from allocated, assigned and legacy records in five RIR delegated stats files\n")
              handle.write(f"# BY ASNs: {len(asns_by_country['BY'])}; KZ ASNs: {len(asns_by_country['KZ'])}\n")
              for asn in sorted(by_kz_asns):
                  handle.write(f"AS{asn}\n")

          with prefix_output.open("w", encoding="utf-8") as handle:
              handle.write("# IPv4/IPv6 resources registered to RU in the five RIR delegated statistics files\n")
              handle.write("# Registration country is not proof of physical server location; used as corroboration only.\n")
              for prefix in sorted(rir_prefixes, key=prefix_sort):
                  handle.write(prefix + "\n")

          stats_lines = [
              f"Generated UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              f"Unique RU-registered ASNs: {len(asns)}",
              f"Unique BY-registered ASNs: {len(asns_by_country['BY'])}",
              f"Unique KZ-registered ASNs: {len(asns_by_country['KZ'])}",
              f"Unique BY/KZ-registered ASNs (deduplicated): {len(by_kz_asns)}",
              f"Unique RU-registered IPv4 CIDRs after cross-registry de-duplication: {len(rir_v4_prefixes)}",
              f"Unique RU-registered IPv6 CIDRs after cross-registry de-duplication: {len(rir_v6_prefixes)}",
              f"Unique RU-registered IPv4/IPv6 CIDRs after cross-registry de-duplication: {len(rir_prefixes)}",
              f"Raw IPv4 resource records: {raw_v4_records}",
              f"IPv4 CIDR components emitted before de-duplication: {generated_v4_cidr_components}",
              f"IPv4 CIDR expansion delta (components minus raw records): {generated_v4_cidr_components - raw_v4_records}",
              f"Raw IPv6 resource records: {raw_v6_records}",
              f"IPv6 CIDR components emitted before de-duplication: {generated_v6_cidr_components}",
              f"IPv6 CIDR expansion delta (components minus raw records): {generated_v6_cidr_components - raw_v6_records}",
              f"Raw ASN resource records: {raw_asn_records}",
              "Interpretation: one raw IPv4 resource interval can expand to multiple CIDR components; this is conversion, not contribution from another RIR. Unique output CIDRs are de-duplicated across all registries.",
              "Caveat: RIR country describes registration, not physical hosting location.",
              *summaries,
          ]
          stats_output.write_text("\n".join(stats_lines) + "\n", encoding="utf-8")
          print("Unique RU-registered ASNs:", len(asns))
          print("Unique RU-registered address prefixes:", len(rir_prefixes))
          PY

          # Convert the official IANA registries into exact non-globally-reachable
          # prefixes and explicit globally-reachable exceptions.
          python3 - "$IANA_V4_CSV" "$IANA_V6_CSV" \
            "$IANA_PRIVATE_PREFIX_INPUT" "$IANA_REACHABLE_PREFIX_INPUT" <<'PY'
          import csv
          import ipaddress
          import pathlib
          import sys

          inputs = [pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])]
          private_out = pathlib.Path(sys.argv[3])
          reachable_out = pathlib.Path(sys.argv[4])
          non_global = set()
          global_exceptions = set()

          for path in inputs:
              try:
                  with path.open("r", encoding="utf-8-sig", newline="") as handle:
                      rows = list(csv.DictReader(handle))
              except (OSError, UnicodeError, csv.Error) as exc:
                  raise SystemExit(f"Cannot parse IANA registry {path}: {exc}")
              if not rows or "Address Block" not in rows[0] or "Globally Reachable" not in rows[0]:
                  raise SystemExit(f"Unexpected IANA CSV schema: {path}")
              for row in rows:
                  block = (row.get("Address Block") or "").strip()
                  reachable = (row.get("Globally Reachable") or "").strip().split()[0].lower() if (row.get("Globally Reachable") or "").strip() else ""
                  if not block or reachable not in {"true", "false"}:
                      continue
                  try:
                      net = ipaddress.ip_network(block, strict=False)
                  except ValueError:
                      continue
                  if net.prefixlen == 0:
                      continue
                  if reachable == "false":
                      non_global.add(str(net))
                  else:
                      global_exceptions.add(str(net))

          def key(value):
              net = ipaddress.ip_network(value)
              return net.version, int(net.network_address), net.prefixlen

          if len(non_global) < 20:
              raise SystemExit(f"IANA non-globally-reachable prefix count unexpectedly small: {len(non_global)}")

          private_out.write_text(
              "# IANA Special-Purpose entries where Globally Reachable=False\n" +
              "\n".join(sorted(non_global, key=key)) + "\n", encoding="utf-8"
          )
          reachable_out.write_text(
              "# IANA Special-Purpose entries where Globally Reachable=True; carve-outs from broad special blocks\n" +
              "\n".join(sorted(global_exceptions, key=key)) + "\n", encoding="utf-8"
          )
          print(f"IANA non-global prefixes: {len(non_global)}")
          print(f"IANA global-reachable exception prefixes: {len(global_exceptions)}")
          PY

          download_file "IPVERSE ASN/BGP ARCHIVE" "$IPVERSE_BGP_ARCHIVE" \
            "https://codeload.github.com/ipverse/as-ip-blocks/tar.gz/refs/heads/master" \
            "https://github.com/ipverse/as-ip-blocks/releases/latest/download/as-ip-blocks.tar.gz"

          # Import RunetFreedom's source categories as separate feeds; do NOT use
          # geoip-ru-only.dat because it also contains PRIVATE and ru-whitelist.
          # ip.lst and ipresolve.lst are host-IP lists; subnet.lst is explicit RKN-derived CIDR.
          download_file "ANTIFILTER EXACT BLOCKED IP LIST" "$BLOCKED_IP_RAW_INPUT" \
            "https://antifilter.download/list/ip.lst"
          download_file "ANTIFILTER IPRESOLVE LIST" "$BLOCKED_IPRESOLVE_INPUT" \
            "https://antifilter.download/list/ipresolve.lst"
          download_file "ANTIFILTER SUBNET LIST" "$BLOCKED_SUBNET_INPUT" \
            "https://antifilter.download/list/subnet.lst"

          # Community and Re-filter are intentionally review-only. They must never
          # be silently promoted into automatic DIRECT exclusions.
          download_optional_file "ANTIFILTER COMMUNITY CANDIDATES" "$BLOCKED_COMMUNITY_INPUT" \
            "https://community.antifilter.download/list/community.lst"
          download_optional_file "RE-FILTER CANDIDATES" "$BLOCKED_REFILTER_INPUT" \
            "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/ipsum.lst"

          python3 .github/scripts/prepare_blocked_sources.py \
            --ip-list "$BLOCKED_IP_RAW_INPUT" \
            --ipresolve "$BLOCKED_IPRESOLVE_INPUT" \
            --subnet "$BLOCKED_SUBNET_INPUT" \
            --community "$BLOCKED_COMMUNITY_INPUT" \
            --refilter "$BLOCKED_REFILTER_INPUT" \
            --approved "$BLOCKED_IP_INPUT" \
            --review "$BLOCKED_REVIEW_INPUT" \
            --stats "$BLOCKED_STATS_INPUT" \
            --checksums "$BLOCKED_CHECKSUMS_INPUT"

          # Validate every required core source and the additive ASN/BGP inputs before parsing.
          for file in "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" \
                      "$GOLUKON_INPUT" "$V2FLY_INPUT" "$V2FLY_SHA_INPUT" \
                      "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_BY_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT" \
                      "$BY_KZ_ASN_REGISTRY" "$BLOCKED_IP_INPUT" "$BLOCKED_IP_RAW_INPUT" \
                      "$BLOCKED_IPRESOLVE_INPUT" "$BLOCKED_SUBNET_INPUT" "$BLOCKED_REVIEW_INPUT" \
                      "$BLOCKED_STATS_INPUT" "$BLOCKED_CHECKSUMS_INPUT" "$HXEHEX_INPUT" "$W1ZARDZ_INPUT" "$AFRINIC_STATS" "$APNIC_STATS" \
                      "$ARIN_STATS" "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" \
                      "$IPVERSE_BGP_ARCHIVE" "$IANA_V4_CSV" "$IANA_V6_CSV"; do
            test -s "$file" || { echo "::error::Missing or empty required input: $file"; exit 1; }
          done
          test "$(wc -c < "$IPVERSE_BGP_ARCHIVE")" -gt 5000000
          gzip -t "$IPVERSE_BGP_ARCHIVE"
          for file in "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" "$KIRILL_INPUT" "$GOLUKON_INPUT" "$V2FLY_INPUT" "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_BY_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT"; do
            test "$(wc -c < "$file")" -gt 100 || { echo "::error::Unexpectedly small GeoIP source: $file"; exit 1; }
          done
          ls -lh "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" "$KIRILL_INPUT" \
                 "$GOLUKON_INPUT" "$V2FLY_INPUT" "$V2FLY_SHA_INPUT" \
                 "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_BY_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT" \
                 "$HXEHEX_INPUT" "$W1ZARDZ_INPUT" "$AFRINIC_STATS" "$APNIC_STATS" \
                 "$ARIN_STATS" "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" "$IPVERSE_BGP_ARCHIVE" \
                 "$IANA_V4_CSV" "$IANA_V6_CSV" "$BLOCKED_IP_RAW_INPUT" "$BLOCKED_IPRESOLVE_INPUT" \
                 "$BLOCKED_SUBNET_INPUT" "$BLOCKED_COMMUNITY_INPUT" "$BLOCKED_REFILTER_INPUT" \
                 "$BLOCKED_IP_INPUT" "$BLOCKED_REVIEW_INPUT" "$BLOCKED_STATS_INPUT"

      - name: Extract RU/BY/KZ registered ASN prefixes and global ipverse BGP observation set
        shell: bash
        run: |
          set -euo pipefail

          cat > extract_ru_asn_prefixes.py <<'PY'
          import collections
          import datetime
          import ipaddress
          import json
          import pathlib
          import sys
          import tarfile
          
          
          def read_rir_asns(path, label, minimum=25):
              result = set()
              with open(path, encoding="utf-8") as source:
                  for raw in source:
                      value = raw.strip().upper()
                      if not value or value.startswith("#"):
                          continue
                      try:
                          asn = int(value.removeprefix("AS"))
                      except ValueError:
                          raise SystemExit(f"Invalid ASN in RIR registry {path}: {raw.rstrip()!r}")
                      if not 0 < asn <= 4294967295:
                          raise SystemExit(f"ASN outside valid range in {path}: {raw.rstrip()!r}")
                      result.add(asn)
              if len(result) < minimum:
                  raise SystemExit(f"RIR ASN sanity check failed: only {len(result)} {label} ASNs")
              return result
          
          
          def read_company_asns(path):
              # TSV format: ASN<TAB>COMPANY_GROUP<TAB>LEGAL_ENTITY_OR_NOTE<TAB>EVIDENCE_URL
              result = {}
              line_count = 0
              with open(path, encoding="utf-8") as source:
                  for number, raw in enumerate(source, 1):
                      line = raw.strip()
                      if not line or line.startswith("#"):
                          continue
                      fields = [part.strip() for part in raw.rstrip("\r\n").split("\t")]
                      if len(fields) != 4 or not all(fields):
                          raise SystemExit(
                              f"Malformed company ASN registry line {number}; expected 4 non-empty TSV fields: {raw.rstrip()!r}"
                          )
                      try:
                          asn = int(fields[0].upper().removeprefix("AS"))
                      except ValueError:
                          raise SystemExit(f"Invalid company ASN on line {number}: {fields[0]!r}")
                      if not 0 < asn <= 4294967295:
                          raise SystemExit(f"Company ASN outside valid range on line {number}: {asn}")
                      row = {"group": fields[1], "entity": fields[2], "evidence": fields[3]}
                      if asn in result and result[asn] != row:
                          raise SystemExit(f"Conflicting company ownership entries for AS{asn}")
                      result[asn] = row
                      line_count += 1
              if line_count < 10:
                  raise SystemExit(f"Company ASN allowlist unexpectedly small: only {line_count} entries")
              return result
          
          
          def is_selected_asn(asn, rir_ru_asns, rir_by_kz_asns, company_asns):
              # Country metadata is not an inclusion filter for selected RU/BY/KZ regional ASNs or affiliates.
              return asn in rir_ru_asns or asn in rir_by_kz_asns or asn in company_asns
          
          
          def parse_announced_prefixes(prefixes):
              parsed = []
              invalid = 0
              for family, version in (("ipv4", 4), ("ipv6", 6)):
                  for raw_prefix in prefixes.get(family, []) or []:
                      try:
                          network = ipaddress.ip_network(str(raw_prefix), strict=False)
                          if network.version != version or network.prefixlen == 0:
                              invalid += 1
                              continue
                      except ValueError:
                          invalid += 1
                          continue
                      parsed.append((family, network))
              return parsed, invalid
          
          
          def self_test_selection():
              rir_ru = {12389}
              rir_by_kz = {25106, 207304}
              companies = {
                  208795: {"group": "Yandex", "entity": "Yandex Cloud Kazakhstan LLP", "evidence": "test"},
                  212066: {"group": "Yandex", "entity": "Buyuk Reklam Cozumleri LLC (Yandex Turkey)", "evidence": "test"},
              }
              # RU, BY/KZ RIR and a foreign-country company affiliate must all be selected.
              assert is_selected_asn(208795, rir_ru, rir_by_kz, companies)
              assert is_selected_asn(25106, rir_ru, rir_by_kz, companies)
              assert is_selected_asn(207304, rir_ru, rir_by_kz, companies)
              assert is_selected_asn(212066, rir_ru, rir_by_kz, companies)
              sample, invalid = parse_announced_prefixes({
                  "ipv4": ["198.51.100.0/24"],
                  "ipv6": ["2001:db8:100::/48"],
              })
              assert invalid == 0 and len(sample) == 2
              # A RIR-RU ASN is still selected even if its ASN metadata says a different country.
              assert is_selected_asn(12389, rir_ru, rir_by_kz, companies)
              # A foreign, unlisted ASN is not selected just because it appears in a non-RU country.
              assert not is_selected_asn(64500, rir_ru, rir_by_kz, companies)
          
          
          if len(sys.argv) == 4 and sys.argv[1] == "--self-test":
              self_test_selection()
              parsed_company_asns = read_company_asns(sys.argv[2])
              parsed_by_kz_asns = read_rir_asns(sys.argv[3], "BY/KZ")
              if 208795 not in parsed_company_asns or 13238 not in parsed_company_asns:
                  raise SystemExit("Company ASN registry self-test failed: Yandex/RU affiliate entries missing")
              if 207304 not in parsed_company_asns or 212066 not in parsed_company_asns:
                  raise SystemExit("Company ASN registry self-test failed: Yandex Kazakhstan/Turkey origin entries missing")
              if not is_selected_asn(208795, set(), parsed_by_kz_asns, parsed_company_asns):
                  raise SystemExit("Company ASN registry self-test failed: non-RU Yandex ASN not selected")
              if not is_selected_asn(212066, set(), parsed_by_kz_asns, parsed_company_asns):
                  raise SystemExit("Company ASN registry self-test failed: Yandex Turkey origin ASN not selected")
              if not any(asn in parsed_by_kz_asns for asn in (25106,)):
                  raise SystemExit("BY/KZ registry self-test failed: Belarus MTS AS25106 not found")
              print("Company and BY/KZ ASN selection self-test passed; countryCode is audit-only.")
              raise SystemExit(0)
          
          if len(sys.argv) != 10:
              raise SystemExit(
                  "usage: extractor <archive> <rir-ru-asns> <rir-by-kz-asns> <company-asns> <regional-prefixes> "
                  "<global-prefixes> <asn-manifest> <company-manifest> <stats>"
              )
          
          archive_path, registry_path, by_kz_registry_path, company_registry_path, ru_prefixes_path, global_prefixes_path, manifest_path, company_manifest_path, stats_path = sys.argv[1:10]
          registered_ru_asns = read_rir_asns(registry_path, "RU")
          registered_by_kz_asns = read_rir_asns(by_kz_registry_path, "BY/KZ")
          company_asns = read_company_asns(company_registry_path)
          
          archive_json_files = malformed_json = invalid_prefixes = 0
          rir_country_mismatch = collections.Counter()
          regional_country_mismatch = collections.Counter()
          company_ipverse_countries = collections.Counter()
          selected_prefix_origins = collections.defaultdict(set)
          rir_prefix_origins = collections.defaultdict(set)
          regional_prefix_origins = collections.defaultdict(set)
          company_prefix_origins = collections.defaultdict(set)
          global_prefixes = set()
          active_selected_asns = {}
          raw_selected_v4 = raw_selected_v6 = 0
          raw_rir_v4 = raw_rir_v6 = 0
          raw_company_v4 = raw_company_v6 = 0
          raw_global_v4 = raw_global_v6 = 0
          
          try:
              archive = tarfile.open(archive_path, mode="r:gz")
          except (tarfile.TarError, OSError) as exc:
              raise SystemExit(f"Invalid ipverse archive: {exc}")
          
          with archive:
              for member in archive:
                  if not member.isfile() or not member.name.endswith("aggregated.json"):
                      continue
                  stream = archive.extractfile(member)
                  if stream is None:
                      malformed_json += 1
                      continue
                  try:
                      item = json.load(stream)
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      malformed_json += 1
                      continue
                  archive_json_files += 1
                  try:
                      asn = int(item.get("asn"))
                  except (TypeError, ValueError):
                      continue
          
                  metadata = item.get("metadata") or {}
                  prefixes = item.get("prefixes") or {}
                  country_code = str(metadata.get("countryCode") or "UNKNOWN").upper()
                  is_rir_ru_asn = asn in registered_ru_asns
                  is_rir_by_kz_asn = asn in registered_by_kz_asns
                  is_company_asn = asn in company_asns
                  selected = is_selected_asn(asn, registered_ru_asns, registered_by_kz_asns, company_asns)
          
                  parsed, invalid = parse_announced_prefixes(prefixes)
                  invalid_prefixes += invalid
                  if selected:
                      row = active_selected_asns.setdefault(asn, {
                          "company_group": company_asns.get(asn, {}).get("group", "-"),
                          "company_entity": company_asns.get(asn, {}).get("entity", "-"),
                          "selection_reason": "+".join(
                              reason for reason, present in (("RIR_RU", is_rir_ru_asn), ("RIR_BY_KZ", is_rir_by_kz_asn), ("COMPANY_ALLOWLIST", is_company_asn)) if present
                          ),
                          "handle": str(metadata.get("handle") or "-").replace("\t", " ").replace("\n", " "),
                          "description": str(metadata.get("description") or "-").replace("\t", " ").replace("\n", " "),
                          "ipverse_country": country_code,
                          "ipv4": 0,
                          "ipv6": 0,
                      })
                      if is_company_asn:
                          company_ipverse_countries[country_code] += 1
                      if is_rir_ru_asn and country_code != "RU":
                          rir_country_mismatch[country_code] += 1
                      if is_rir_by_kz_asn and country_code not in {"BY", "KZ"}:
                          regional_country_mismatch[country_code] += 1
          
                  for family, network in parsed:
                      normalized = str(network)
                      global_prefixes.add(normalized)
                      if network.version == 4:
                          raw_global_v4 += 1
                      else:
                          raw_global_v6 += 1
                      if not selected:
                          continue
          
                      selected_prefix_origins[normalized].add(asn)
                      row = active_selected_asns[asn]
                      row[family] += 1
                      if network.version == 4:
                          raw_selected_v4 += 1
                      else:
                          raw_selected_v6 += 1
          
                      if is_rir_ru_asn:
                          rir_prefix_origins[normalized].add(asn)
                          if network.version == 4:
                              raw_rir_v4 += 1
                          else:
                              raw_rir_v6 += 1
                      if is_rir_by_kz_asn:
                          regional_prefix_origins[normalized].add(asn)
                      if is_company_asn:
                          company_prefix_origins[normalized].add(asn)
                          if network.version == 4:
                              raw_company_v4 += 1
                          else:
                              raw_company_v6 += 1
          
          active_selected_asns = {
              asn: row for asn, row in active_selected_asns.items() if row["ipv4"] + row["ipv6"] > 0
          }
          yandex_turkey_known_prefixes = {"45.148.65.0/24", "2a14:48c6::/48"}
          yandex_turkey_selected_prefixes = {
              prefix for prefix, origins in selected_prefix_origins.items() if 212066 in origins
          }
          missing_yandex_turkey_prefixes = sorted(yandex_turkey_known_prefixes - yandex_turkey_selected_prefixes)
          if missing_yandex_turkey_prefixes:
              raise SystemExit(
                  "Yandex Turkey AS212066 origin-prefix regression: expected prefixes are missing from the selected BGP layer: "
                  + ", ".join(missing_yandex_turkey_prefixes)
              )
          if archive_json_files < 10000:
              raise SystemExit(f"ipverse sanity check failed: only {archive_json_files} aggregated.json files")
          if malformed_json:
              raise SystemExit(f"ipverse archive contains {malformed_json} malformed JSON files; refusing partial data")
          if len(active_selected_asns) < 25 or not selected_prefix_origins:
              raise SystemExit(
                  f"Too few selected ASNs with BGP data: ASNs={len(active_selected_asns)}, prefixes={len(selected_prefix_origins)}"
              )
          active_by_kz_count = sum(1 for asn in active_selected_asns if asn in registered_by_kz_asns)
          # ipverse is an observation window, so a small active count is possible
          # even when the full BY/KZ GeoIP categories are present. Keep this as a
          # low failure threshold rather than requiring 20 currently visible ASNs.
          if active_by_kz_count < 5:
              raise SystemExit(f"Too few active BY/KZ RIR ASNs with BGP announcements: {active_by_kz_count}")
          if len(global_prefixes) < 10000:
              raise SystemExit(f"Global ipverse prefix set unexpectedly small: {len(global_prefixes)}")
          
          
          def sort_key(value):
              network = ipaddress.ip_network(value)
              return network.version, int(network.network_address), network.prefixlen
          
          with open(ru_prefixes_path, "w", encoding="utf-8") as output:
              output.write(
                  "# BGP prefixes originated by RIR-RU or RIR-BY/KZ ASNs OR explicitly allowlisted company-affiliate ASNs.\n"
              )
              output.write(
                  "# ASN metadata countryCode is audit-only; selected regional/company origin announcements are included regardless of countryCode.\n"
              )
              for prefix in sorted(selected_prefix_origins, key=sort_key):
                  origins = []
                  for asn in sorted(selected_prefix_origins[prefix]):
                      labels = []
                      if asn in registered_ru_asns:
                          labels.append("RIR-RU")
                      if asn in registered_by_kz_asns:
                          labels.append("RIR-BY/KZ")
                      if asn in company_asns:
                          labels.append(company_asns[asn]["group"].replace(" ", "_"))
                      origins.append(f"AS{asn}[{'+'.join(labels)}]")
                  output.write(f"{prefix} # {','.join(origins)}\n")
          
          with open(global_prefixes_path, "w", encoding="utf-8") as output:
              output.write("# Union of prefixes in ipverse/as-ip-blocks aggregated.json files\n")
              output.write("# Observation window is up to 90 days; absence here is NOT proof of global unroutability.\n")
              for prefix in sorted(global_prefixes, key=sort_key):
                  output.write(prefix + "\n")
          
          with open(manifest_path, "w", encoding="utf-8") as output:
              output.write(
                  "ASN\tCOMPANY_GROUP\tLEGAL_ENTITY\tINCLUSION_BASIS\tHANDLE\tDESCRIPTION\tIPVERSE_COUNTRY_CODE\tIPV4_PREFIXES\tIPV6_PREFIXES\n"
              )
              for asn in sorted(active_selected_asns):
                  row = active_selected_asns[asn]
                  output.write(
                      f"AS{asn}\t{row['company_group']}\t{row['company_entity']}\t{row['selection_reason']}\t"
                      f"{row['handle']}\t{row['description']}\t{row['ipverse_country']}\t{row['ipv4']}\t{row['ipv6']}\n"
                  )
          
          with open(company_manifest_path, "w", encoding="utf-8") as output:
              output.write(
                  "ASN\tCOMPANY_GROUP\tLEGAL_ENTITY_OR_NOTE\tEVIDENCE\tACTIVE_IN_IPVERSE\tIPVERSE_COUNTRY_CODE\tIPV4_PREFIXES\tIPV6_PREFIXES\tALSO_RIR_RU\tALSO_RIR_BY_KZ\n"
              )
              for asn in sorted(company_asns):
                  company = company_asns[asn]
                  row = active_selected_asns.get(asn)
                  output.write(
                      f"AS{asn}\t{company['group']}\t{company['entity']}\t{company['evidence']}\t"
                      f"{'yes' if row else 'no'}\t{row['ipverse_country'] if row else '-'}\t"
                      f"{row['ipv4'] if row else 0}\t{row['ipv6'] if row else 0}\t"
                      f"{'yes' if asn in registered_ru_asns else 'no'}\t"
                      f"{'yes' if asn in registered_by_kz_asns else 'no'}\n"
                  )
          
          stats = [
              f"Generated UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              f"ipverse aggregated.json files: {archive_json_files}",
              f"RIR delegated-stats registered RU ASNs: {len(registered_ru_asns)}",
              f"RIR delegated-stats registered BY/KZ ASNs: {len(registered_by_kz_asns)}",
              f"Curated Russian-company ASN allowlist entries: {len(company_asns)}",
              f"Curated company ASNs with ipverse BGP data: {sum(1 for asn in active_selected_asns if asn in company_asns)}",
              f"Selected RIR-RU/BY/KZ or company ASNs with ipverse BGP data: {len(active_selected_asns)}",
              f"Active BY/KZ RIR ASNs with ipverse announcements: {active_by_kz_count}",
              f"Unique prefixes originated by RIR-RU ASNs: {len(rir_prefix_origins)}",
              f"Unique prefixes originated by RIR-BY/KZ ASNs: {len(regional_prefix_origins)}",
              f"Unique prefixes originated by curated Russian-company/affiliate ASNs: {len(company_prefix_origins)}",
              "Yandex Turkey AS212066 verified origin prefixes: 45.148.65.0/24, 2a14:48c6::/48",
              f"Yandex Turkey AS212066 observed selected prefixes: {len(yandex_turkey_known_prefixes & yandex_turkey_selected_prefixes)} of {len(yandex_turkey_known_prefixes)}",
              f"Unique prefixes in DIRECT BGP layer (RIR-RU/BY/KZ OR company allowlist): {len(selected_prefix_origins)}",
              f"Raw selected IPv4 prefix records (RIR-RU OR company allowlist): {raw_selected_v4}",
              f"Raw selected IPv6 prefix records (RIR-RU OR company allowlist): {raw_selected_v6}",
              f"Raw company-allowlisted IPv4 prefix records: {raw_company_v4}",
              f"Raw company-allowlisted IPv6 prefix records: {raw_company_v6}",
              f"Raw RIR-RU IPv4 prefix records: {raw_rir_v4}",
              f"Raw RIR-RU IPv6 prefix records: {raw_rir_v6}",
              f"Unique global ipverse prefixes: {len(global_prefixes)}",
              f"Raw global IPv4 prefix records: {raw_global_v4}",
              f"Raw global IPv6 prefix records: {raw_global_v6}",
              f"Prefixes originated by multiple selected ASNs: {sum(1 for values in selected_prefix_origins.values() if len(values) > 1)}",
              f"Company ASN ipverse countryCode distribution (audit only): " + (", ".join(f"{key}={value}" for key, value in sorted(company_ipverse_countries.items())) or "none"),
              f"RIR-RU ASN ipverse countryCode mismatches (audit only): " + (", ".join(f"{key}={value}" for key, value in sorted(rir_country_mismatch.items())) or "none"),
              f"RIR-BY/KZ ASN ipverse countryCode mismatches (audit only): " + (", ".join(f"{key}={value}" for key, value in sorted(regional_country_mismatch.items())) or "none"),
              f"Invalid/default prefixes skipped: {invalid_prefixes}",
              "Country handling: ipverse countryCode is not used as an inclusion filter for selected RIR-RU, RIR-BY/KZ or company-affiliate origin ASNs.",
              "Scope: announced prefixes present in ipverse aggregated.json observations (up to 90 days), not a real-time or historical-complete RIB.",
              "ASN allowlist semantics: only prefixes originated by the listed ASN are imported; peer/upstream ASNs are not recursively included.",
          ]
          with open(stats_path, "w", encoding="utf-8") as output:
              output.write("\n".join(stats) + "\n")
          print("=== RU/BY/KZ RIR and company-affiliate ASN BGP extraction ===")
          print("\n".join(stats))
          PY

          python3 extract_ru_asn_prefixes.py --self-test "$COMPANY_ASN_REGISTRY" "$BY_KZ_ASN_REGISTRY"
          python3 extract_ru_asn_prefixes.py "$IPVERSE_BGP_ARCHIVE" "$RU_ASN_REGISTRY" "$BY_KZ_ASN_REGISTRY" \
            "$COMPANY_ASN_REGISTRY" "$RU_PREFIX_INPUT" "$GLOBAL_BGP_PREFIX_INPUT" \
            "$ASN_MANIFEST" "$COMPANY_ASN_MANIFEST" "$ASN_STATS"
          for file in "$RU_PREFIX_INPUT" "$GLOBAL_BGP_PREFIX_INPUT" "$ASN_MANIFEST" "$COMPANY_ASN_MANIFEST" "$ASN_STATS" "$BY_KZ_ASN_REGISTRY"; do
            test -s "$file" || { echo "::error::Missing BGP artifact: $file"; exit 1; }
          done

      - name: Build unified DIRECT GeoIP RU+BY+KZ v35 with curated blocked-destination exclusions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geoip-builder
          cat > geoip-builder/main.go <<'GO'
          package main
          
          import (
          	"bufio"
          	"fmt"
          	"math/big"
          	"net/netip"
          	"os"
          	"sort"
          	"strings"
          
          	router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
          	"google.golang.org/protobuf/proto"
          )
          
          type sourceFile struct {
          	Name string
          	Path string
          	Kind string
          }
          
          type trieNode struct {
          	covered bool
          	child   [2]*trieNode
          }
          
          type ipTrie struct {
          	v4 *trieNode
          	v6 *trieNode
          }
          
          func newIPTrie() *ipTrie                { return &ipTrie{v4: &trieNode{}, v6: &trieNode{}} }
          func normalizeName(value string) string { return strings.ToLower(strings.TrimSpace(value)) }
          
          func getBit(addr netip.Addr, pos int) int {
          	if addr.Is4() {
          		b := addr.As4()
          		return int((b[pos/8] >> (7 - (pos % 8))) & 1)
          	}
          	b := addr.As16()
          	return int((b[pos/8] >> (7 - (pos % 8))) & 1)
          }
          
          func setBit(addr netip.Addr, pos int) netip.Addr {
          	if addr.Is4() {
          		b := addr.As4()
          		b[pos/8] |= 1 << (7 - (pos % 8))
          		return netip.AddrFrom4(b)
          	}
          	b := addr.As16()
          	b[pos/8] |= 1 << (7 - (pos % 8))
          	return netip.AddrFrom16(b)
          }
          
          func (t *ipTrie) insert(prefix netip.Prefix) {
          	prefix = prefix.Masked()
          	addr, bits := prefix.Addr(), prefix.Bits()
          	curr := t.v6
          	if addr.Is4() {
          		curr = t.v4
          	}
          	for i := 0; i < bits; i++ {
          		if curr.covered {
          			return
          		}
          		bit := getBit(addr, i)
          		if curr.child[bit] == nil {
          			curr.child[bit] = &trieNode{}
          		}
          		curr = curr.child[bit]
          	}
          	curr.covered = true
          	curr.child[0], curr.child[1] = nil, nil
          }
          
          func compressNode(n *trieNode) bool {
          	if n == nil {
          		return false
          	}
          	if n.covered {
          		n.child[0], n.child[1] = nil, nil
          		return true
          	}
          	if !compressNode(n.child[0]) {
          		n.child[0] = nil
          	}
          	if !compressNode(n.child[1]) {
          		n.child[1] = nil
          	}
          	if n.child[0] != nil && n.child[0].covered && n.child[1] != nil && n.child[1].covered {
          		n.covered = true
          		n.child[0], n.child[1] = nil, nil
          		return true
          	}
          	return n.child[0] != nil || n.child[1] != nil
          }
          
          func (t *ipTrie) compress() {
          	if !compressNode(t.v4) {
          		t.v4 = &trieNode{}
          	}
          	if !compressNode(t.v6) {
          		t.v6 = &trieNode{}
          	}
          }
          
          func cloneNode(n *trieNode) *trieNode {
          	if n == nil {
          		return nil
          	}
          	copyNode := &trieNode{covered: n.covered}
          	copyNode.child[0], copyNode.child[1] = cloneNode(n.child[0]), cloneNode(n.child[1])
          	return copyNode
          }
          
          func cloneTrie(source *ipTrie) *ipTrie {
          	return &ipTrie{v4: cloneNode(source.v4), v6: cloneNode(source.v6)}
          }
          
          func intersectNode(target, mask *trieNode) *trieNode {
          	if target == nil || mask == nil {
          		return nil
          	}
          	if mask.covered {
          		return cloneNode(target)
          	}
          	if target.covered {
          		target = &trieNode{child: [2]*trieNode{{covered: true}, {covered: true}}}
          	}
          	out := &trieNode{}
          	for bit := 0; bit < 2; bit++ {
          		out.child[bit] = intersectNode(target.child[bit], mask.child[bit])
          	}
          	if out.child[0] == nil && out.child[1] == nil {
          		return nil
          	}
          	if out.child[0] != nil && out.child[0].covered && out.child[1] != nil && out.child[1].covered {
          		return &trieNode{covered: true}
          	}
          	return out
          }
          
          func (t *ipTrie) intersect(mask *ipTrie) {
          	t.v4, t.v6 = intersectNode(t.v4, mask.v4), intersectNode(t.v6, mask.v6)
          	if t.v4 == nil {
          		t.v4 = &trieNode{}
          	}
          	if t.v6 == nil {
          		t.v6 = &trieNode{}
          	}
          	t.compress()
          }
          
          func subtractNode(target, mask *trieNode) {
          	if target == nil || mask == nil {
          		return
          	}
          	if mask.covered {
          		target.covered = false
          		target.child[0], target.child[1] = nil, nil
          		return
          	}
          	if target.covered {
          		target.covered = false
          		target.child[0], target.child[1] = &trieNode{covered: true}, &trieNode{covered: true}
          	}
          	if mask.child[0] != nil && target.child[0] != nil {
          		subtractNode(target.child[0], mask.child[0])
          	}
          	if mask.child[1] != nil && target.child[1] != nil {
          		subtractNode(target.child[1], mask.child[1])
          	}
          }
          
          func (t *ipTrie) subtract(mask *ipTrie) {
          	subtractNode(t.v4, mask.v4)
          	subtractNode(t.v6, mask.v6)
          	t.compress()
          }
          
          func extractPrefixes(n *trieNode, addr netip.Addr, depth, bitLen int, out *[]netip.Prefix) {
          	if n == nil {
          		return
          	}
          	if n.covered {
          		*out = append(*out, netip.PrefixFrom(addr, depth).Masked())
          		return
          	}
          	if depth >= bitLen {
          		return
          	}
          	if n.child[0] != nil {
          		extractPrefixes(n.child[0], addr, depth+1, bitLen, out)
          	}
          	if n.child[1] != nil {
          		extractPrefixes(n.child[1], setBit(addr, depth), depth+1, bitLen, out)
          	}
          }
          
          func (t *ipTrie) toPrefixes() []netip.Prefix {
          	var out []netip.Prefix
          	extractPrefixes(t.v4, netip.IPv4Unspecified(), 0, 32, &out)
          	extractPrefixes(t.v6, netip.IPv6Unspecified(), 0, 128, &out)
          	return out
          }
          
          func unionInto(dst, src *ipTrie) {
          	for _, prefix := range src.toPrefixes() {
          		dst.insert(prefix)
          	}
          	dst.compress()
          }
          
          // applyDirectPrecedence enforces the single-file routing policy. PRIVATE always
          // wins; approved exact hosts, bounded subnet ranges and curated Telegram prefixes
          // are carved from DIRECT. Privacy/telemetry classifications are not inputs and
          // therefore never route an otherwise
          // DIRECT destination through the VPN.
          func applyDirectPrecedence(direct, privateTrie, blockedIPs *ipTrie) *ipTrie {
          	result := cloneTrie(direct)
          	result.subtract(privateTrie)
          	result.subtract(blockedIPs)
          	result.compress()
          	return result
          }

          // newlyAddedDirectSpace returns only addresses contributed by additions
          // that were not already in the existing DIRECT baseline, PRIVATE, or blocked.
          func newlyAddedDirectSpace(additions, existing, privateTrie, blockedIPs *ipTrie) *ipTrie {
          	result := cloneTrie(additions)
          	result.subtract(privateTrie)
          	result.subtract(blockedIPs)
          	baseline := cloneTrie(existing)
          	baseline.subtract(privateTrie)
          	baseline.subtract(blockedIPs)
          	result.subtract(baseline)
          	result.compress()
          	return result
          }
          
          func isBlockedCategory(category string) bool {
          	category = normalizeName(category)
          	for _, token := range []string{"blocked", "blacklist", "deny", "antifilter", "re-filter"} {
          		if strings.Contains(category, token) {
          			return true
          		}
          	}
          	return false
          }
          
          // Direct/whitelist entries are audit signals only; they never subtract GeoIP data.
          func targetCategory(source, category string) string {
          	source, category = normalizeName(source), normalizeName(category)
          	if isBlockedCategory(category) {
          		return ""
          	}
          	if category == "private" {
          		if source == "loyalsoldier-private" {
          			return "private"
          		}
          		return ""
          	}
          	switch source {
          	case "hydra":
          		// Upstream roscomvpn-geoip publishes direct, whitelist and private,
          		// not a strict geoip:ru category. direct/whitelist include RU/BY, CDN
          		// and foreign infrastructure, so treat these entries as diagnostic
          		// candidates only; never admit them as geographic RU on their own.
          		if category == "direct" || category == "whitelist" {
          			return "candidate"
          		}
          	case "grimbird":
          		if category == "ru" {
          			return "ru"
          		}
          		if strings.HasPrefix(category, "ru-") {
          			if strings.Contains(category, "direct") || strings.Contains(category, "whitelist") || strings.Contains(category, "wl-") {
          				return "candidate"
          			}
          			return "ru"
          		}
          	case "digne":
          		if category == "ru" || category == "ru-ip" {
          			return "ru"
          		}
          		if category == "direct-ip" || category == "whitelist" {
          			return "candidate"
          		}
          	case "davoyan":
          		if category == "ru" {
          			return "ru"
          		}
          		if category == "wl-ru" {
          			return "candidate"
          		}
          	case "kirill":
          		if category == "whitelist" {
          			return "candidate"
          		}
          	case "golukon", "loyalsoldier":
          		if category == "ru" {
          			return "ru"
          		}
          	case "loyalsoldier-by":
          		if category == "by" {
          			return "ru-by"
          		}
          	case "v2fly":
          		switch category {
          		case "ru":
          			return "ru"
          		case "by":
          			return "ru-by"
          		case "kz":
          			return "ru-kz"
          		}
          	}
          	return ""
          }
          
          func cidrPrefix(cidr *router.CIDR) (netip.Prefix, bool) {
          	if cidr == nil || cidr.Prefix > 128 {
          		return netip.Prefix{}, false
          	}
          	var addr netip.Addr
          	switch len(cidr.Ip) {
          	case 4:
          		var b [4]byte
          		copy(b[:], cidr.Ip)
          		addr = netip.AddrFrom4(b)
          	case 16:
          		var b [16]byte
          		copy(b[:], cidr.Ip)
          		addr = netip.AddrFrom16(b)
          	default:
          		return netip.Prefix{}, false
          	}
          	if int(cidr.Prefix) > addr.BitLen() {
          		return netip.Prefix{}, false
          	}
          	return netip.PrefixFrom(addr, int(cidr.Prefix)).Masked(), true
          }
          
          func loadGeoIP(path string) (*router.GeoIPList, error) {
          	data, err := os.ReadFile(path)
          	if err != nil {
          		return nil, err
          	}
          	if len(data) == 0 {
          		return nil, fmt.Errorf("empty GeoIP file: %s", path)
          	}
          	list := new(router.GeoIPList)
          	if err := proto.Unmarshal(data, list); err != nil {
          		return nil, fmt.Errorf("invalid GeoIP %s: %w", path, err)
          	}
          	return list, nil
          }
          
          func loadGeoIPSource(source sourceFile, coreRU, candidates, privateTrie, protectedLoyalsoldierRU, protectedV2FlyRU *ipTrie, regionalDirect map[string]*ipTrie, regionalRawCounts map[string]int, additional map[string]*ipTrie, categoryAudit map[string]int) (ruCount, candidateCount, privateCount int, err error) {
          	list, err := loadGeoIP(source.Path)
          	if err != nil {
          		return 0, 0, 0, err
          	}
          	for _, entry := range list.Entry {
          		if entry == nil {
          			continue
          		}
          		target := targetCategory(source.Name, entry.CountryCode)
          		role := target
          		if role == "" {
          			role = "ignored"
          		}
          		category := normalizeName(entry.CountryCode)
          		if category == "" {
          			category = "(empty)"
          		}
          		for _, cidr := range entry.Cidr {
          			prefix, ok := cidrPrefix(cidr)
          			if !ok || prefix.Bits() == 0 {
          				continue
          			}
          			categoryAudit[source.Name+"\t"+category+"\t"+role]++
          			switch target {
          			case "private":
          				privateTrie.insert(prefix)
          				privateCount++
          			case "candidate":
          				candidates.insert(prefix)
          				candidateCount++
          			case "ru", "ru-by", "ru-kz":
          				coreRU.insert(prefix)
          				ruCount++
          				if target == "ru-by" {
          					regionalDirect["BY"].insert(prefix)
          					regionalRawCounts["BY"]++
          				}
          				if target == "ru-kz" {
          					regionalDirect["KZ"].insert(prefix)
          					regionalRawCounts["KZ"]++
          				}
          				if target == "ru" && source.Name == "loyalsoldier" {
          					protectedLoyalsoldierRU.insert(prefix)
          				}
          				if target == "ru" && source.Name == "v2fly" {
          					protectedV2FlyRU.insert(prefix)
          				}
          				if target == "ru" {
          					if dst := additional[source.Name]; dst != nil {
          						dst.insert(prefix)
          					}
          				}
          			}
          		}
          	}
          	return ruCount, candidateCount, privateCount, nil
          }
          
          func loadTextPrefixes(trie *ipTrie, path string) (int, error) {
          	file, err := os.Open(path)
          	if err != nil {
          		return 0, err
          	}
          	defer file.Close()
          	added := 0
          	scanner := bufio.NewScanner(file)
          	scanner.Buffer(make([]byte, 64*1024), 4*1024*1024)
          	for scanner.Scan() {
          		line := strings.TrimSpace(strings.TrimPrefix(scanner.Text(), "\ufeff"))
          		if line == "" || strings.HasPrefix(line, "#") {
          			continue
          		}
          		if idx := strings.IndexByte(line, '#'); idx >= 0 {
          			line = strings.TrimSpace(line[:idx])
          		}
          		upper := strings.ToUpper(line)
          		for _, prefix := range []string{"IP-CIDR,", "IP-CIDR6,", "IPSET,", "CIDR,"} {
          			if strings.HasPrefix(upper, prefix) {
          				line = strings.TrimSpace(line[len(prefix):])
          				break
          			}
          		}
          		fields := strings.FieldsFunc(line, func(r rune) bool { return r == ' ' || r == '\t' || r == ',' || r == ';' })
          		for _, field := range fields {
          			field = strings.Trim(field, "[](){}\"'")
          			if field == "" {
          				continue
          			}
          			if prefix, parseErr := netip.ParsePrefix(field); parseErr == nil {
          				if prefix.Bits() == 0 {
          					continue
          				}
          				trie.insert(prefix)
          				added++
          				break
          			}
          			if addr, parseErr := netip.ParseAddr(field); parseErr == nil {
          				trie.insert(netip.PrefixFrom(addr, addr.BitLen()).Masked())
          				added++
          				break
          			}
          		}
          	}
          	if err := scanner.Err(); err != nil {
          		return added, err
          	}
          	return added, nil
          }
          
          // loadApprovedBlockedPrefixes accepts exact host IPs plus bounded explicit
          // subnet.lst prefixes. Only explicitly configured Telegram routes may exceed
          // the /16 IPv4 or /112 IPv6 automatic-carve thresholds (65,536 addresses).
          func isCuratedWideBlockedPrefix(prefix netip.Prefix) bool {
          	curated := map[string]struct{}{
          		"91.105.192.0/23": {}, "91.108.4.0/22": {}, "91.108.8.0/21": {},
          		"91.108.16.0/21": {}, "91.108.56.0/22": {}, "95.161.64.0/20": {},
          		"149.154.160.0/20": {}, "185.76.151.0/24": {},
          		"2001:67c:4e8::/48": {}, "2001:b28:f23c::/47": {},
          		"2001:b28:f23f::/48": {}, "2a0a:f280::/32": {},
          	}
          	_, ok := curated[prefix.Masked().String()]
          	return ok
          }

          func isApprovedBlockedPrefix(prefix netip.Prefix) bool {
          	prefix = prefix.Masked()
          	if prefix.Bits() == prefix.Addr().BitLen() || isCuratedWideBlockedPrefix(prefix) {
          		return true
          	}
          	if prefix.Addr().Is4() {
          		return prefix.Bits() >= 16 // at most 65,536 IPv4 addresses per automatic subnet carve
          	}
          	return prefix.Bits() >= 112 // at most 65,536 IPv6 addresses per automatic subnet carve
          }

          func loadApprovedBlockedPrefixes(trie *ipTrie, path string) (int, error) {
          	file, err := os.Open(path)
          	if err != nil {
          		return 0, err
          	}
          	defer file.Close()
          	count := 0
          	scanner := bufio.NewScanner(file)
          	scanner.Buffer(make([]byte, 64*1024), 4*1024*1024)
          	for lineNo := 1; scanner.Scan(); lineNo++ {
          		line := strings.TrimSpace(strings.TrimPrefix(scanner.Text(), "\ufeff"))
          		if line == "" || strings.HasPrefix(line, "#") {
          			continue
          		}
          		if index := strings.IndexByte(line, '#'); index >= 0 {
          			line = strings.TrimSpace(line[:index])
          		}
          		upper := strings.ToUpper(line)
          		for _, prefix := range []string{"IP-CIDR,", "IP-CIDR6,", "CIDR,"} {
          			if strings.HasPrefix(upper, prefix) {
          				line = strings.TrimSpace(line[len(prefix):])
          				break
          			}
          		}
          		fields := strings.FieldsFunc(line, func(r rune) bool { return r == ' ' || r == '\t' || r == ',' || r == ';' })
          		if len(fields) == 0 {
          			continue
          		}
          		value := strings.Trim(fields[0], `[](){}\"'`)
          		var prefix netip.Prefix
          		if parsed, parseErr := netip.ParsePrefix(value); parseErr == nil {
          			prefix = parsed.Masked()
          		} else if addr, addrErr := netip.ParseAddr(value); addrErr == nil {
          			prefix = netip.PrefixFrom(addr, addr.BitLen()).Masked()
          		} else {
          			return count, fmt.Errorf("invalid blocked prefix at line %d: %q", lineNo, value)
          		}
          		if !isApprovedBlockedPrefix(prefix) {
          			return count, fmt.Errorf("blocked prefix at line %d exceeds safe carve threshold and is not an explicit Telegram route: %s", lineNo, prefix)
          		}
          		trie.insert(prefix)
          		count++
          	}
          	if err := scanner.Err(); err != nil {
          		return count, err
          	}
          	if count < 1000 {
          		return count, fmt.Errorf("approved blocked-prefix set unexpectedly small: only %d entries", count)
          	}
          	return count, nil
          }

          // Explicit local-use/reserved networks supplemented by the current IANA
          // Special-Purpose registry's Globally Reachable=False entries.
          func insertBuiltInPrivate(t *ipTrie) {
          	for _, value := range []string{
          		"0.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "127.0.0.0/8",
          		"169.254.0.0/16", "172.16.0.0/12", "192.0.2.0/24", "192.168.0.0/16",
          		"198.18.0.0/15", "198.51.100.0/24", "203.0.113.0/24", "224.0.0.0/4", "240.0.0.0/4",
          		"::/128", "::1/128", "fc00::/7", "fe80::/10", "ff00::/8", "2001:db8::/32",
          	} {
          		if p, err := netip.ParsePrefix(value); err == nil {
          			t.insert(p)
          		}
          	}
          }
          
          func sortPrefixes(prefixes []netip.Prefix) {
          	sort.Slice(prefixes, func(i, j int) bool {
          		if prefixes[i].Addr().BitLen() != prefixes[j].Addr().BitLen() {
          			return prefixes[i].Addr().BitLen() < prefixes[j].Addr().BitLen()
          		}
          		if cmp := prefixes[i].Addr().Compare(prefixes[j].Addr()); cmp != 0 {
          			return cmp < 0
          		}
          		return prefixes[i].Bits() < prefixes[j].Bits()
          	})
          }
          
          func countAddressSpace(prefixes []netip.Prefix, bitLen int) *big.Int {
          	total := new(big.Int)
          	for _, prefix := range prefixes {
          		if prefix.Addr().BitLen() != bitLen {
          			continue
          		}
          		count := new(big.Int).Lsh(big.NewInt(1), uint(bitLen-prefix.Bits()))
          		total.Add(total, count)
          	}
          	return total
          }
          
          func setStats(set *ipTrie) (int, string, string) {
          	copySet := cloneTrie(set)
          	copySet.compress()
          	prefixes := copySet.toPrefixes()
          	return len(prefixes), countAddressSpace(prefixes, 32).String(), countAddressSpace(prefixes, 128).String()
          }
          
          func statsLine(label string, set *ipTrie) string {
          	count, v4, v6 := setStats(set)
          	return fmt.Sprintf("%s: CIDR=%d IPv4=%s IPv6=%s", label, count, v4, v6)
          }
          
          // prefixAddressCount returns the exact address count represented by one CIDR.
          func prefixAddressCount(prefix netip.Prefix) *big.Int {
          	return new(big.Int).Lsh(big.NewInt(1), uint(prefix.Addr().BitLen()-prefix.Bits()))
          }
          
          // prefixOverlapAddressCount counts addresses from one prefix covered by a set.
          // Trie intersection handles both covering aggregate routes and more-specific routes.
          func prefixOverlapAddressCount(prefix netip.Prefix, coverage *ipTrie) *big.Int {
          	one := newIPTrie()
          	one.insert(prefix)
          	one.intersect(coverage)
          	bits := prefix.Addr().BitLen()
          	return countAddressSpace(one.toPrefixes(), bits)
          }
          
          type familyBGPReachability struct {
          	TotalPrefixes              int
          	FullPrefixes               int
          	PartialPrefixes            int
          	NonePrefixes               int
          	TotalAddresses             *big.Int
          	FullAddresses              *big.Int
          	PartialAddresses           *big.Int
          	PartialObservedAddresses   *big.Int
          	PartialUnobservedAddresses *big.Int
          	NoneAddresses              *big.Int
          	ObservedAddresses          *big.Int
          }
          
          type bgpReachability struct {
          	IPv4 familyBGPReachability
          	IPv6 familyBGPReachability
          }
          
          func newFamilyBGPReachability() familyBGPReachability {
          	return familyBGPReachability{
          		TotalAddresses: new(big.Int), FullAddresses: new(big.Int),
          		PartialAddresses: new(big.Int), PartialObservedAddresses: new(big.Int),
          		PartialUnobservedAddresses: new(big.Int), NoneAddresses: new(big.Int),
          		ObservedAddresses: new(big.Int),
          	}
          }
          
          // classifyGlobalBGPReachability classifies each final, disjoint output CIDR as
          // fully, partially, or not observed by the global ipverse prefix union. This is
          // address-space aware: a less-specific route can fully cover a CIDR, while a set
          // of more-specific routes can also fully cover it.
          func classifyGlobalBGPReachability(prefixes []netip.Prefix, global *ipTrie) bgpReachability {
          	result := bgpReachability{IPv4: newFamilyBGPReachability(), IPv6: newFamilyBGPReachability()}
          	for _, prefix := range prefixes {
          		family := &result.IPv6
          		if prefix.Addr().Is4() {
          			family = &result.IPv4
          		}
          		total := prefixAddressCount(prefix)
          		observed := prefixOverlapAddressCount(prefix, global)
          		family.TotalPrefixes++
          		family.TotalAddresses.Add(family.TotalAddresses, total)
          		family.ObservedAddresses.Add(family.ObservedAddresses, observed)
          		switch {
          		case observed.Sign() == 0:
          			family.NonePrefixes++
          			family.NoneAddresses.Add(family.NoneAddresses, total)
          		case observed.Cmp(total) == 0:
          			family.FullPrefixes++
          			family.FullAddresses.Add(family.FullAddresses, total)
          		default:
          			family.PartialPrefixes++
          			family.PartialAddresses.Add(family.PartialAddresses, total)
          			family.PartialObservedAddresses.Add(family.PartialObservedAddresses, observed)
          			unobserved := new(big.Int).Sub(total, observed)
          			family.PartialUnobservedAddresses.Add(family.PartialUnobservedAddresses, unobserved)
          		}
          	}
          	return result
          }
          
          // buildTwoGroupAgreement admits only address space shared by two distinct
          // logical feed groups. Correlated feeds are first unioned into one group.
          func buildTwoGroupAgreement(groups map[string]*ipTrie) *ipTrie {
          	names := make([]string, 0, len(groups))
          	for name := range groups {
          		names = append(names, name)
          	}
          	sort.Strings(names)
          	accepted := newIPTrie()
          	for i := 0; i < len(names); i++ {
          		for j := i + 1; j < len(names); j++ {
          			pair := cloneTrie(groups[names[i]])
          			pair.intersect(groups[names[j]])
          			unionInto(accepted, pair)
          		}
          	}
          	accepted.compress()
          	return accepted
          }
          
          func overlapAddressesForSet(prefix netip.Prefix, set *ipTrie) string {
          	return prefixOverlapAddressCount(prefix, set).String()
          }
          
          // writeAdditionalProvenance writes exact address-overlap counts for each accepted
          // additional CIDR. Evidence columns are independent intersections and can overlap;
          // they must not be summed to derive the final address count.
          func writeAdditionalProvenance(path string, accepted *ipTrie, feeds, groups map[string]*ipTrie, twoGroups, additionalBGP, additionalRIR, asnRU, rirRU, globalBGP *ipTrie) error {
          	prefixes := accepted.toPrefixes()
          	sortPrefixes(prefixes)
          	var b strings.Builder
          	b.WriteString("PREFIX\tFAMILY\tPREFIX_ADDRESSES\tGRIMBIRD_OVERLAP_ADDRESSES\tDIGNE_OVERLAP_ADDRESSES\tDAVOYAN_OVERLAP_ADDRESSES\tGOLUKON_OVERLAP_ADDRESSES\tGROUPS_WITH_OVERLAP\tTWO_GROUP_CONFIRMED_ADDRESSES\tREGIONAL_RIR_OR_COMPANY_ASN_BGP_CONFIRMED_ADDRESSES\tRIR_RU_CONFIRMED_ADDRESSES\tREGIONAL_RIR_OR_COMPANY_ASN_BGP_OVERLAP_ADDRESSES\tRIR_RU_OVERLAP_ADDRESSES\tGLOBAL_BGP_OBSERVED_OVERLAP_ADDRESSES\n")
          	for _, prefix := range prefixes {
          		family := "IPv6"
          		if prefix.Addr().Is4() {
          			family = "IPv4"
          		}
          		groupNames := make([]string, 0, len(groups))
          		for name, set := range groups {
          			if prefixOverlapAddressCount(prefix, set).Sign() > 0 {
          				groupNames = append(groupNames, name)
          			}
          		}
          		sort.Strings(groupNames)
          		fmt.Fprintf(&b, "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n",
          			prefix,
          			family,
          			prefixAddressCount(prefix).String(),
          			overlapAddressesForSet(prefix, feeds["grimbird"]),
          			overlapAddressesForSet(prefix, feeds["digne"]),
          			overlapAddressesForSet(prefix, feeds["davoyan"]),
          			overlapAddressesForSet(prefix, feeds["golukon"]),
          			strings.Join(groupNames, ","),
          			overlapAddressesForSet(prefix, twoGroups),
          			overlapAddressesForSet(prefix, additionalBGP),
          			overlapAddressesForSet(prefix, additionalRIR),
          			overlapAddressesForSet(prefix, asnRU),
          			overlapAddressesForSet(prefix, rirRU),
          			overlapAddressesForSet(prefix, globalBGP),
          		)
          	}
          	return os.WriteFile(path, []byte(b.String()), 0644)
          }
          
          func bgpFamilyReport(label string, coverage familyBGPReachability) []string {
          	return []string{
          		fmt.Sprintf("%s output CIDRs: total=%d fully_observed=%d partially_observed=%d not_observed=%d", label, coverage.TotalPrefixes, coverage.FullPrefixes, coverage.PartialPrefixes, coverage.NonePrefixes),
          		fmt.Sprintf("%s address coverage: total=%s fully_observed_prefix_space=%s partially_observed_prefix_space=%s none_observed_prefix_space=%s", label, coverage.TotalAddresses, coverage.FullAddresses, coverage.PartialAddresses, coverage.NoneAddresses),
          		fmt.Sprintf("%s partial-CIDR split: actually_observed=%s still_unobserved=%s; total actually observed across all CIDRs=%s", label, coverage.PartialObservedAddresses, coverage.PartialUnobservedAddresses, coverage.ObservedAddresses),
          	}
          }
          
          func writeOutput(priv, ru []netip.Prefix, path string) ([]byte, error) {
          	result := new(router.GeoIPList)
          	for _, target := range []struct {
          		name     string
          		prefixes []netip.Prefix
          	}{{"PRIVATE", priv}, {"RU", ru}} {
          		if len(target.prefixes) == 0 {
          			continue
          		}
          		entry := &router.GeoIP{CountryCode: target.name}
          		for _, prefix := range target.prefixes {
          			if prefix.Addr().Is4() {
          				a := prefix.Addr().As4()
          				entry.Cidr = append(entry.Cidr, &router.CIDR{Ip: []byte{a[0], a[1], a[2], a[3]}, Prefix: uint32(prefix.Bits())})
          			} else {
          				a := prefix.Addr().As16()
          				ip := make([]byte, 16)
          				copy(ip, a[:])
          				entry.Cidr = append(entry.Cidr, &router.CIDR{Ip: ip, Prefix: uint32(prefix.Bits())})
          			}
          		}
          		result.Entry = append(result.Entry, entry)
          	}
          	data, err := proto.MarshalOptions{Deterministic: true}.Marshal(result)
          	if err != nil {
          		return nil, err
          	}
          	return data, os.WriteFile(path, data, 0644)
          }
          
          func verifyOutputBinary(path string, expectedRU, expectedPrivate *ipTrie) error {
          	decoded, err := loadGeoIP(path)
          	if err != nil {
          		return err
          	}
          	if len(decoded.Entry) != 2 {
          		return fmt.Errorf("expected exactly 2 protobuf categories (RU, PRIVATE), got %d", len(decoded.Entry))
          	}
          	seenCategories := map[string]bool{}
          	decodedSets := map[string]*ipTrie{"RU": newIPTrie(), "PRIVATE": newIPTrie()}
          	seenPrefixes := map[string]map[string]bool{"RU": {}, "PRIVATE": {}}
          	for _, entry := range decoded.Entry {
          		if entry == nil {
          			return fmt.Errorf("nil protobuf GeoIP entry")
          		}
          		category := strings.ToUpper(strings.TrimSpace(entry.CountryCode))
          		if category != "RU" && category != "PRIVATE" {
          			return fmt.Errorf("unexpected protobuf category %q", entry.CountryCode)
          		}
          		if seenCategories[category] {
          			return fmt.Errorf("duplicate protobuf category %q", category)
          		}
          		seenCategories[category] = true
          		for _, cidr := range entry.Cidr {
          			prefix, ok := cidrPrefix(cidr)
          			if !ok || prefix.Bits() == 0 {
          				return fmt.Errorf("invalid CIDR in protobuf category %s", category)
          			}
          			if prefix != prefix.Masked() {
          				return fmt.Errorf("non-canonical CIDR in protobuf category %s: %s", category, prefix)
          			}
          			key := prefix.String()
          			if seenPrefixes[category][key] {
          				return fmt.Errorf("duplicate prefix %s in protobuf category %s", key, category)
          			}
          			seenPrefixes[category][key] = true
          			decodedSets[category].insert(prefix)
          		}
          	}
          	if !seenCategories["RU"] || !seenCategories["PRIVATE"] {
          		return fmt.Errorf("protobuf must contain both RU and PRIVATE categories")
          	}
          	for category, expected := range map[string]*ipTrie{"RU": expectedRU, "PRIVATE": expectedPrivate} {
          		missing := cloneTrie(expected)
          		missing.subtract(decodedSets[category])
          		extra := cloneTrie(decodedSets[category])
          		extra.subtract(expected)
          		if len(missing.toPrefixes()) != 0 || len(extra.toPrefixes()) != 0 {
          			return fmt.Errorf("protobuf category %s does not match builder address set: missing=%d extra=%d", category, len(missing.toPrefixes()), len(extra.toPrefixes()))
          		}
          	}
          	overlap := cloneTrie(decodedSets["RU"])
          	overlap.intersect(decodedSets["PRIVATE"])
          	if len(overlap.toPrefixes()) != 0 {
          		return fmt.Errorf("protobuf RU/PRIVATE overlap: %d prefixes", len(overlap.toPrefixes()))
          	}
          	return nil
          }

          func writeCategories(path string, privateCount, ruCount int) error {
          	return os.WriteFile(path, []byte(fmt.Sprintf("RU\t%d\nPRIVATE\t%d\n", ruCount, privateCount)), 0644)
          }
          
          type sourceCounts struct {
          	RU        int
          	Candidate int
          	Private   int
          	Other     int
          }
          
          func (c sourceCounts) total() int { return c.RU + c.Candidate + c.Private + c.Other }
          
          func sumSourceCounts(counts map[string]sourceCounts) sourceCounts {
          	var total sourceCounts
          	for _, count := range counts {
          		total.RU += count.RU
          		total.Candidate += count.Candidate
          		total.Private += count.Private
          		total.Other += count.Other
          	}
          	return total
          }
          
          func writeSourceCounts(path string, counts map[string]sourceCounts) error {
          	order := []string{"hydra", "grimbird", "digne", "davoyan", "golukon", "loyalsoldier", "loyalsoldier-by", "v2fly", "loyalsoldier-private", "kirill", "hxehex-whitelist", "w1zardz-ru", "ru-asn-bgp", "rir-ru", "global-bgp", "iana-non-global", "iana-global-exceptions", "blocked-direct-exclusions"}
          	var b strings.Builder
          	b.WriteString("SOURCE\tRU_CATEGORY_CIDR_INPUTS\tCANDIDATE_CIDR_INPUTS\tPRIVATE_CIDR_INPUTS\tOTHER_EVIDENCE_CIDR_INPUTS\tTOTAL_CIDR_INPUTS\n")
          	for _, name := range order {
          		c := counts[name]
          		fmt.Fprintf(&b, "%s\t%d\t%d\t%d\t%d\t%d\n", name, c.RU, c.Candidate, c.Private, c.Other, c.total())
          	}
          	total := sumSourceCounts(counts)
          	fmt.Fprintf(&b, "TOTAL\t%d\t%d\t%d\t%d\t%d\n", total.RU, total.Candidate, total.Private, total.Other, total.total())
          	return os.WriteFile(path, []byte(b.String()), 0644)
          }
          
          func writeCategoryAudit(path string, counts map[string]int) error {
          	keys := make([]string, 0, len(counts))
          	for key := range counts {
          		keys = append(keys, key)
          	}
          	sort.Strings(keys)
          	var b strings.Builder
          	b.WriteString("SOURCE\tNORMALIZED_CATEGORY\tASSIGNED_ROLE\tVALID_CIDR_INPUT_RECORDS\n")
          	for _, key := range keys {
          		fields := strings.Split(key, "\t")
          		if len(fields) != 3 {
          			return fmt.Errorf("invalid source category audit key: %q", key)
          		}
          		fmt.Fprintf(&b, "%s\t%s\t%s\t%d\n", fields[0], fields[1], fields[2], counts[key])
          	}
          	return os.WriteFile(path, []byte(b.String()), 0644)
          }

          func readExactPrefixSet(path string) (map[string]struct{}, error) {
          	file, err := os.Open(path)
          	if err != nil {
          		return nil, err
          	}
          	defer file.Close()
          	result := make(map[string]struct{})
          	scanner := bufio.NewScanner(file)
          	scanner.Buffer(make([]byte, 64*1024), 4*1024*1024)
          	for scanner.Scan() {
          		line := strings.TrimSpace(strings.TrimPrefix(scanner.Text(), "\ufeff"))
          		if line == "" || strings.HasPrefix(line, "#") {
          			continue
          		}
          		if idx := strings.IndexByte(line, '#'); idx >= 0 {
          			line = strings.TrimSpace(line[:idx])
          		}
          		upper := strings.ToUpper(line)
          		for _, prefix := range []string{"IP-CIDR,", "IP-CIDR6,", "IPSET,", "CIDR,"} {
          			if strings.HasPrefix(upper, prefix) {
          				line = strings.TrimSpace(line[len(prefix):])
          				break
          			}
          		}
          		fields := strings.FieldsFunc(line, func(r rune) bool { return r == ' ' || r == '\t' || r == ',' || r == ';' })
          		for _, field := range fields {
          			field = strings.Trim(field, "[](){}\"'")
          			if field == "" {
          				continue
          			}
          			if prefix, parseErr := netip.ParsePrefix(field); parseErr == nil {
          				if prefix.Bits() > 0 {
          					result[prefix.Masked().String()] = struct{}{}
          				}
          				break
          			}
          			if addr, parseErr := netip.ParseAddr(field); parseErr == nil {
          				result[netip.PrefixFrom(addr, addr.BitLen()).Masked().String()] = struct{}{}
          				break
          			}
          		}
          	}
          	if err := scanner.Err(); err != nil {
          		return nil, err
          	}
          	return result, nil
          }

          func addressSpacePercent(covered, total *ipTrie, bitLen int) string {
          	numerator := countAddressSpace(covered.toPrefixes(), bitLen)
          	denominator := countAddressSpace(total.toPrefixes(), bitLen)
          	if denominator.Sign() == 0 {
          		return "n/a"
          	}
          	n := new(big.Float).SetPrec(128).SetInt(numerator)
          	d := new(big.Float).SetPrec(128).SetInt(denominator)
          	ratio := new(big.Float).SetPrec(128).Quo(n, d)
          	ratio.Mul(ratio, big.NewFloat(100))
          	return ratio.Text('f', 2) + "%"
          }

          func writeQualityReport(path string, lines []string) error {
          	content := "GeoIP DIRECT RU+BY+KZ CLIENT v35 Quality Report\nGenerated by the Go builder; all coverage counts are exact address-space sums of disjoint trie prefixes.\n\n" + strings.Join(lines, "\n") + "\n"
          	return os.WriteFile(path, []byte(content), 0644)
          }
          
          func main() {
          	if len(os.Args) != 26 {
          		fmt.Fprintf(os.Stderr, "usage: %s <hydra> <grimbird> <digne> <davoyan> <kirill> <golukon> <v2fly> <loyalsoldier-ru> <loyalsoldier-private> <hxehex> <w1zardz> <regional-asn-bgp> <rir-ru> <global-bgp> <iana-non-global> <iana-global-exceptions> <output> <categories> <sources> <source-counts> <category-audit> <quality-report> <additional-provenance> <loyalsoldier-by> <blocked-ip-list>\n", os.Args[0])
          		os.Exit(2)
          	}
          	files := []sourceFile{
          		{"hydra", os.Args[1], "dat"}, {"grimbird", os.Args[2], "dat"}, {"digne", os.Args[3], "dat"},
          		{"davoyan", os.Args[4], "dat"}, {"kirill", os.Args[5], "dat"}, {"golukon", os.Args[6], "dat"},
          		{"v2fly", os.Args[7], "dat"}, {"loyalsoldier", os.Args[8], "dat"}, {"loyalsoldier-private", os.Args[9], "dat"},
          		{"loyalsoldier-by", os.Args[24], "dat"},
          		{"hxehex-whitelist", os.Args[10], "text"}, {"w1zardz-ru", os.Args[11], "text"},
          		{"ru-asn-bgp", os.Args[12], "text"}, {"rir-ru", os.Args[13], "text"}, {"global-bgp", os.Args[14], "text"},
          	}
          	ianaPrivatePath, ianaExceptionsPath := os.Args[15], os.Args[16]
          	outputPath, categoryPath, sourcePath, countsPath, categoryAuditPath, qualityPath, provenancePath := os.Args[17], os.Args[18], os.Args[19], os.Args[20], os.Args[21], os.Args[22], os.Args[23]
          	blockedPath := os.Args[25]
          
          	coreRU, candidates, asnRU, rirRU, globalBGP, privateTrie := newIPTrie(), newIPTrie(), newIPTrie(), newIPTrie(), newIPTrie(), newIPTrie()
          	protectedLoyalsoldierRU, protectedV2FlyRU := newIPTrie(), newIPTrie()
          	regionalDirect := map[string]*ipTrie{"BY": newIPTrie(), "KZ": newIPTrie()}
          	regionalRawCounts := map[string]int{"BY": 0, "KZ": 0}
          	blockedIPs := newIPTrie()
          	additional := map[string]*ipTrie{}
          	for _, name := range []string{"grimbird", "digne", "davoyan", "golukon"} {
          		additional[name] = newIPTrie()
          	}
          	insertBuiltInPrivate(privateTrie)
          	counts := make(map[string]sourceCounts)
          	categoryAudit := make(map[string]int)
          	candidateRaw, coreRaw, bgpRaw, rirRaw, globalRaw, privateRaw := 0, 0, 0, 0, 0, 0
          
          	for _, source := range files {
          		if source.Kind == "dat" {
          			ruCount, candidateCount, privateCount, err := loadGeoIPSource(source, coreRU, candidates, privateTrie, protectedLoyalsoldierRU, protectedV2FlyRU, regionalDirect, regionalRawCounts, additional, categoryAudit)
          			if err != nil {
          				panic(fmt.Errorf("%s: %w", source.Name, err))
          			}
          			counts[source.Name] = sourceCounts{RU: ruCount, Candidate: candidateCount, Private: privateCount}
          			privateRaw += privateCount
          			if source.Name == "loyalsoldier-private" {
          				if privateCount == 0 {
          					panic("Loyalsoldier private.dat has no PRIVATE CIDRs")
          				}
          				continue
          			}
          			if source.Name == "kirill" {
          				candidateRaw += candidateCount
          				continue
          			}
          			if source.Name == "hydra" && candidateCount == 0 {
          				panic("Hydra direct/whitelist input contains no candidate CIDRs; refusing silent source loss")
          			}
          			if source.Name == "grimbird" || source.Name == "digne" || source.Name == "davoyan" || source.Name == "golukon" || source.Name == "loyalsoldier" || source.Name == "v2fly" || source.Name == "loyalsoldier-by" {
          				if ruCount == 0 {
          					panic(fmt.Errorf("source %s has no accepted DIRECT geographic CIDRs; refusing silent source loss", source.Name))
          				}
          			}
          			candidateRaw += candidateCount
          			coreRaw += ruCount
          			fmt.Printf("Loaded %-20s RU=%d candidates=%d private=%d\n", source.Name, ruCount, candidateCount, privateCount)
          			continue
          		}
          
          		target := candidates
          		switch source.Name {
          		case "ru-asn-bgp":
          			target = asnRU
          		case "rir-ru":
          			target = rirRU
          		case "global-bgp":
          			target = globalBGP
          		}
          		matched, err := loadTextPrefixes(target, source.Path)
          		if err != nil {
          			panic(fmt.Errorf("%s: %w", source.Name, err))
          		}
          		switch source.Name {
          		case "ru-asn-bgp", "rir-ru", "global-bgp":
          			counts[source.Name] = sourceCounts{Other: matched}
          		default:
          			counts[source.Name] = sourceCounts{Candidate: matched}
          		}
          		switch source.Name {
          		case "ru-asn-bgp":
          			bgpRaw = matched
          		case "rir-ru":
          			rirRaw = matched
          		case "global-bgp":
          			globalRaw = matched
          		default:
          			candidateRaw += matched
          		}
          		if matched == 0 {
          			panic(fmt.Errorf("source %s parsed zero prefixes; refusing incomplete build", source.Name))
          		}
          		fmt.Printf("Loaded %-20s CIDRs=%d\n", source.Name, matched)
          	}
          
          	ianaPrivateCount, err := loadTextPrefixes(privateTrie, ianaPrivatePath)
          	if err != nil {
          		panic(fmt.Errorf("IANA non-global registry: %w", err))
          	}
          	counts["iana-non-global"] = sourceCounts{Private: ianaPrivateCount}
          	privateRaw += ianaPrivateCount
          	if ianaPrivateCount < 20 {
          		panic(fmt.Errorf("IANA non-global registry unexpectedly small: %d", ianaPrivateCount))
          	}
          	ianaExceptions := newIPTrie()
          	ianaExceptionCount, err := loadTextPrefixes(ianaExceptions, ianaExceptionsPath)
          	if err != nil {
          		panic(fmt.Errorf("IANA globally-reachable exceptions: %w", err))
          	}
          	counts["iana-global-exceptions"] = sourceCounts{Other: ianaExceptionCount}
          	if ianaExceptionCount == 0 {
          		panic("IANA global-reachable exception list is empty; refusing ambiguous PRIVATE policy")
          	}
          	// Specific globally-reachable exceptions override broad special-purpose parent blocks.
          	privateTrie.subtract(ianaExceptions)

          	blockedRawCount, err := loadApprovedBlockedPrefixes(blockedIPs, blockedPath)
          	if err != nil {
          		panic(fmt.Errorf("exact blocked-IP input: %w", err))
          	}
          	counts["blocked-direct-exclusions"] = sourceCounts{Other: blockedRawCount}

          	roleTotals := sumSourceCounts(counts)
          	globalExactPrefixes, err := readExactPrefixSet(os.Args[14])
          	if err != nil {
          		panic(fmt.Errorf("read exact global BGP prefix set: %w", err))
          	}
          	if roleTotals.RU != coreRaw || roleTotals.Candidate != candidateRaw || roleTotals.Private != privateRaw || roleTotals.Other != bgpRaw+rirRaw+globalRaw+ianaExceptionCount+blockedRawCount {
          		panic(fmt.Errorf("source-count/build-counter reconciliation failed: source roles RU=%d candidate=%d private=%d other=%d; builder RU=%d candidate=%d private=%d other=%d",
          			roleTotals.RU, roleTotals.Candidate, roleTotals.Private, roleTotals.Other,
          			coreRaw, candidateRaw, privateRaw, bgpRaw+rirRaw+globalRaw+ianaExceptionCount+blockedRawCount))
          	}
          
          	for _, trie := range []*ipTrie{coreRU, candidates, asnRU, rirRU, globalBGP, privateTrie, protectedLoyalsoldierRU, protectedV2FlyRU, regionalDirect["BY"], regionalDirect["KZ"], blockedIPs} {
          		trie.compress()
          	}
          	for _, trie := range additional {
          		trie.compress()
          	}
          	if len(protectedLoyalsoldierRU.toPrefixes()) == 0 {
          		panic("Loyalsoldier geoip:ru is empty")
          	}
          	if len(protectedV2FlyRU.toPrefixes()) == 0 {
          		panic("v2fly geoip:ru is empty")
          	}
          	if len(asnRU.toPrefixes()) == 0 {
          		panic("RU/BY/KZ ASN/BGP is empty")
          	}
          	if len(regionalDirect["BY"].toPrefixes()) == 0 || len(regionalDirect["KZ"].toPrefixes()) == 0 {
          		panic("BY or KZ regional GeoIP category is empty; refusing a partial DIRECT region build")
          	}
          	if len(rirRU.toPrefixes()) == 0 {
          		panic("RIR RU allocation inventory is empty")
          	}
          	if len(globalBGP.toPrefixes()) == 0 {
          		panic("global ipverse BGP observation set is empty")
          	}
          
          	// Trusted RU geographic layers: retain their address space, except for the
          	// explicitly higher-priority PRIVATE set.
          	trustedGeo := cloneTrie(protectedLoyalsoldierRU)
          	unionInto(trustedGeo, protectedV2FlyRU)
          	trustedShared := cloneTrie(protectedLoyalsoldierRU)
          	trustedShared.intersect(protectedV2FlyRU)
          	loyalsoldierOnly := cloneTrie(protectedLoyalsoldierRU)
          	loyalsoldierOnly.subtract(protectedV2FlyRU)
          	v2flyOnly := cloneTrie(protectedV2FlyRU)
          	v2flyOnly.subtract(protectedLoyalsoldierRU)
          	trustedPublic := cloneTrie(trustedGeo)
          	trustedPublic.subtract(privateTrie)
          
          	// Additional feeds are admitted where corroborated by two distinct logical
          	// source groups, RU/BY/KZ RIR/company ASN BGP, or RIR-RU registration. Grimbird and Digne are
          	// grouped together because their datasets are materially correlated and must
          	// not count as two independent confirmations of one another.
          	additionalUnion := newIPTrie()
          	extraNames := []string{"grimbird", "digne", "davoyan", "golukon"}
          	for _, name := range extraNames {
          		unionInto(additionalUnion, additional[name])
          	}
          	additionalGroups := map[string]*ipTrie{
          		"grimbird+digne-correlation-group": newIPTrie(),
          		"davoyan":                          newIPTrie(),
          		"golukon":                          newIPTrie(),
          	}
          	unionInto(additionalGroups["grimbird+digne-correlation-group"], additional["grimbird"])
          	unionInto(additionalGroups["grimbird+digne-correlation-group"], additional["digne"])
          	unionInto(additionalGroups["davoyan"], additional["davoyan"])
          	unionInto(additionalGroups["golukon"], additional["golukon"])
          	additionalTwoSources := buildTwoGroupAgreement(additionalGroups)
          	additionalWithRUBGP := cloneTrie(additionalUnion)
          	additionalWithRUBGP.intersect(asnRU)
          	additionalWithRUBGP.subtract(privateTrie)
          	additionalWithRIRRU := cloneTrie(additionalUnion)
          	additionalWithRIRRU.intersect(rirRU)
          	additionalWithRIRRU.subtract(privateTrie)
          	additionalTwoSources.subtract(privateTrie)
          	eligibleAdditional := cloneTrie(additionalTwoSources)
          	unionInto(eligibleAdditional, additionalWithRUBGP)
          	unionInto(eligibleAdditional, additionalWithRIRRU)
          	eligibleAdditional.subtract(trustedGeo)
          	// Count only newly contributing addresses; regional GeoIP and BGP layers
          	// can already cover the same feed prefixes.
          	eligibleAdditional.subtract(regionalDirect["BY"])
          	eligibleAdditional.subtract(regionalDirect["KZ"])
          	eligibleAdditional.subtract(asnRU)
          	eligibleAdditional.compress()

          	// Measure blocked addresses against the pre-carve DIRECT union, then remove
          	// only the approved, source-classified blocked prefixes. PRIVATE is unaffected.
          	preBlockDirect := cloneTrie(trustedGeo)
          	unionInto(preBlockDirect, regionalDirect["BY"])
          	unionInto(preBlockDirect, regionalDirect["KZ"])
          	unionInto(preBlockDirect, eligibleAdditional)
          	unionInto(preBlockDirect, asnRU)
          	preBlockDirect.subtract(privateTrie)
          	blockedDirectOverlap := cloneTrie(preBlockDirect)
          	blockedDirectOverlap.intersect(blockedIPs)
          	eligibleAdditional.subtract(blockedIPs)
          	eligibleAdditional.compress()
          
          	acceptedAdditionalEvidence := cloneTrie(eligibleAdditional)
          	unconfirmedAdditional := cloneTrie(additionalUnion)
          	unconfirmedAdditional.subtract(trustedGeo)
          	unconfirmedAdditional.subtract(regionalDirect["BY"])
          	unconfirmedAdditional.subtract(regionalDirect["KZ"])
          	unconfirmedAdditional.subtract(asnRU)
          	unconfirmedAdditional.subtract(acceptedAdditionalEvidence)
          	unconfirmedAdditional.subtract(privateTrie)
          	unconfirmedAdditional.subtract(blockedIPs)
          	unconfirmedAdditional.compress()
          
          	// Candidate lists do not carve out geo ranges. They are diagnostic signals;
          	// candidate ranges already included by RU/BY/KZ RIR/company ASN BGP remain included via BGP.
          	candidateOnRUBGP := cloneTrie(candidates)
          	candidateOnRUBGP.intersect(asnRU)
          	candidateOnRUBGP.subtract(privateTrie)
          	candidateOnRIR := cloneTrie(candidates)
          	candidateOnRIR.intersect(rirRU)
          	candidateOnRIR.subtract(privateTrie)
          	candidateOnTrusted := cloneTrie(candidates)
          	candidateOnTrusted.intersect(trustedGeo)
          	candidateOnTrusted.subtract(privateTrie)
          
          	// Build the pre-ASN regional baseline separately so the report can measure
          	// genuinely new address space contributed by RU/BY/KZ/company ASN origins.
          	// Subtract PRIVATE and approved blocked destinations from both sides before calculating
          	// the incremental ASN contribution; otherwise finalRU-beforeBGP is always zero.
          	preASNDirect := cloneTrie(trustedGeo)
          	unionInto(preASNDirect, regionalDirect["BY"])
          	unionInto(preASNDirect, regionalDirect["KZ"])
          	unionInto(preASNDirect, eligibleAdditional)
          	preASNDirect = applyDirectPrecedence(preASNDirect, privateTrie, blockedIPs)
          	newBGP := newlyAddedDirectSpace(asnRU, preASNDirect, privateTrie, blockedIPs)

          	beforeBGP := cloneTrie(preASNDirect)
          	unionInto(beforeBGP, asnRU)
          	finalRU := applyDirectPrecedence(beforeBGP, privateTrie, blockedIPs)

          	// Every selected regional/company origin prefix must survive in DIRECT
          	// except for addresses removed by PRIVATE and approved blocked-destination
          	// policies. Check the actual final address set, not only the pre-build BGP list.
          	expectedASNDirect := applyDirectPrecedence(asnRU, privateTrie, blockedIPs)
          	missingASNDirect := cloneTrie(expectedASNDirect)
          	missingASNDirect.subtract(finalRU)
          	if missing := missingASNDirect.toPrefixes(); len(missing) > 0 {
          		sortPrefixes(missing)
          		panic(fmt.Errorf("selected RIR/company ASN DIRECT coverage lost after allowed carve-outs: %d prefixes; first=%s", len(missing), missing[0]))
          	}
          	yandexTurkeyFinalCoverage := 0
          	for _, value := range []string{"45.148.65.0/24", "2a14:48c6::/48"} {
          		prefix, err := netip.ParsePrefix(value)
          		if err != nil { panic(err) }
          		expected := newIPTrie()
          		expected.insert(prefix.Masked())
          		expected = applyDirectPrecedence(expected, privateTrie, blockedIPs)
          		missing := cloneTrie(expected)
          		missing.subtract(finalRU)
          		if lost := missing.toPrefixes(); len(lost) > 0 {
          			panic(fmt.Errorf("Yandex Turkey AS212066 final DIRECT coverage lost beyond PRIVATE/blocked carve: %s", value))
          		}
          		yandexTurkeyFinalCoverage++
          	}
          	privateTrie.compress()
          
          	// Protected-source invariants after PRIVATE policy. These compare address
          	// coverage as sets, not literal CIDR strings.
          	lostLoyalsoldier := cloneTrie(protectedLoyalsoldierRU)
          	lostLoyalsoldier.subtract(privateTrie)
          	lostLoyalsoldier.subtract(blockedIPs)
          	checkLoyalsoldier := cloneTrie(lostLoyalsoldier)
          	checkLoyalsoldier.subtract(finalRU)
          	if lost := checkLoyalsoldier.toPrefixes(); len(lost) > 0 {
          		sortPrefixes(lost)
          		panic(fmt.Errorf("Loyalsoldier public coverage lost after PRIVATE: %d prefixes; first=%s", len(lost), lost[0]))
          	}
          	lostV2Fly := cloneTrie(protectedV2FlyRU)
          	lostV2Fly.subtract(privateTrie)
          	lostV2Fly.subtract(blockedIPs)
          	checkV2Fly := cloneTrie(lostV2Fly)
          	checkV2Fly.subtract(finalRU)
          	if lost := checkV2Fly.toPrefixes(); len(lost) > 0 {
          		sortPrefixes(lost)
          		panic(fmt.Errorf("v2fly public coverage lost after PRIVATE: %d prefixes; first=%s", len(lost), lost[0]))
          	}
          	for _, country := range []string{"BY", "KZ"} {
          		regionalExpected := cloneTrie(regionalDirect[country])
          		regionalExpected.subtract(privateTrie)
          		regionalExpected.subtract(blockedIPs)
          		regionalMissing := cloneTrie(regionalExpected)
          		regionalMissing.subtract(finalRU)
          		if lost := regionalMissing.toPrefixes(); len(lost) > 0 {
          			sortPrefixes(lost)
          			panic(fmt.Errorf("%s direct GeoIP coverage lost after PRIVATE/blocked policy: %d prefixes; first=%s", country, len(lost), lost[0]))
          		}
          	}
          	blockedStillDirect := cloneTrie(finalRU)
          	blockedStillDirect.intersect(blockedIPs)
          	if overlap := blockedStillDirect.toPrefixes(); len(overlap) > 0 {
          		panic(fmt.Errorf("blocked-IP carve invariant failed: %d prefixes remain in DIRECT; first=%s", len(overlap), overlap[0]))
          	}
          	privateOverlap := cloneTrie(finalRU)
          	privateOverlap.intersect(privateTrie)
          	if overlap := privateOverlap.toPrefixes(); len(overlap) > 0 {
          		panic(fmt.Errorf("PRIVATE/RU overlap invariant failed: %d prefixes", len(overlap)))
          	}
          
          	if len(finalRU.toPrefixes()) == 0 {
          		panic("final RU category is empty")
          	}
          	if len(privateTrie.toPrefixes()) == 0 {
          		panic("final PRIVATE category is empty")
          	}
          
          	// Global BGP audit is observation-only. ipverse contains AS data with
          	// announcements seen in its preceding 90-day window, not a real-time RIB.
          	observedGlobal := cloneTrie(finalRU)
          	observedGlobal.intersect(globalBGP)
          	notObservedGlobal := cloneTrie(finalRU)
          	notObservedGlobal.subtract(globalBGP)
          	finalInRUASN := cloneTrie(finalRU)
          	finalInRUASN.intersect(asnRU)
          	finalInRIR := cloneTrie(finalRU)
          	finalInRIR.intersect(rirRU)
          	finalTrusted := cloneTrie(finalRU)
          	finalTrusted.intersect(trustedGeo)
          
          	privatePrefixes, ruPrefixes := privateTrie.toPrefixes(), finalRU.toPrefixes()
          	globalReachability := classifyGlobalBGPReachability(ruPrefixes, globalBGP)
          	exactGlobalPrefixes, nonExactObservedPrefixes, noGlobalOverlapPrefixes := 0, 0, 0
          	for _, prefix := range ruPrefixes {
          		_, exact := globalExactPrefixes[prefix.String()]
          		observed := prefixOverlapAddressCount(prefix, globalBGP)
          		switch {
          		case exact:
          			exactGlobalPrefixes++
          		case observed.Sign() > 0:
          			nonExactObservedPrefixes++
          		default:
          			noGlobalOverlapPrefixes++
          		}
          	}
          	if exactGlobalPrefixes+nonExactObservedPrefixes+noGlobalOverlapPrefixes != len(ruPrefixes) {
          		panic("exact-prefix/global-overlap classification does not reconcile to final RU CIDR count")
          	}
          	if err := writeAdditionalProvenance(provenancePath, eligibleAdditional, additional, additionalGroups, additionalTwoSources, additionalWithRUBGP, additionalWithRIRRU, asnRU, rirRU, globalBGP); err != nil {
          		panic(fmt.Errorf("write additional source provenance: %w", err))
          	}
          	sortPrefixes(privatePrefixes)
          	sortPrefixes(ruPrefixes)
          	ipv4Count := countAddressSpace(ruPrefixes, 32).String()
          	ipv6Exact := countAddressSpace(ruPrefixes, 128)
          	ipv6Count := ipv6Exact.String()
          	ipv6Per32 := new(big.Int).Lsh(big.NewInt(1), 96)
          	ipv6Equivalent32, ipv6Remainder := new(big.Int), new(big.Int)
          	ipv6Equivalent32.QuoRem(new(big.Int).Set(ipv6Exact), ipv6Per32, ipv6Remainder)
          	data, err := writeOutput(privatePrefixes, ruPrefixes, outputPath)
          	if err != nil {
          		panic(fmt.Errorf("write GeoIP protobuf: %w", err))
          	}
          	if err := verifyOutputBinary(outputPath, finalRU, privateTrie); err != nil {
          		panic(fmt.Errorf("protobuf read-back verification: %w", err))
          	}
          	if err := writeCategories(categoryPath, len(privatePrefixes), len(ruPrefixes)); err != nil {
          		panic(err)
          	}
          	if err := writeSourceCounts(countsPath, counts); err != nil {
          		panic(err)
          	}
