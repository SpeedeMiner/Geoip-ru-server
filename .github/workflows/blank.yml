           }
           if stats.TotalAddresses.Cmp(big.NewInt(1024)) != 0 || stats.ObservedAddresses.Cmp(big.NewInt(512)) != 0 {
            t.Fatalf("unexpected address totals: total=%s observed=%s", stats.TotalAddresses, stats.ObservedAddresses)
           }
          }

