name: Build Ultimate GeoIP Russia CLIENT v16

on:
  workflow_dispatch:
  schedule:
    # Каждую неделю: воскресенье 03:45 UTC
    - cron: "45 3 * * 0"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # All accepted Russian/whitelist-derived IPv4 sources are merged into one geoip:ru category.
      GRIMBIRD_GEOIP_URL: https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geoip.dat
      GOLOKON_GEOIP_URL: https://github.com/golukon/russia-only-geoip/releases/latest/download/geoip.dat
      LOYALSOLDIER_GEOIP_URL: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat

      # Whitelist-derived IPv4 sources are merged into geoip:ru by request.
      HYDRA_WHITELIST_URL: https://raw.githubusercontent.com/hydraponique/roscomvpn-geoip/release/text/whitelist.txt
      KIRILL_GEOIP_URL: https://github.com/kirilllavrov/RU-domain-list-for-whitelist/releases/latest/download/geoip.dat
      HXEHEX_WHITELIST_URL: https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt

      # Service-derived, country-validated IPv4 routes.
      # Current project data: ~849 IPv4 CIDRs / ~62 services; merged into geoip:ru.
      W1ZARDZ_RU_IP_URL: https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/dist/ru-direct-ipv4.txt

      OUTPUT_FILE: geoip_RU.dat
      CATEGORY_FILE: geoip_RU_categories.txt
      SOURCE_FILE: geoip_RU_sources.txt
      OUTPUT_SHA_FILE: geoip_RU.dat.sha256sum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Download GeoIP sources
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Downloading RU IPv4 GeoIP sources"
          echo "========================================"

          curl -fL --retry 5 --retry-all-errors "$GRIMBIRD_GEOIP_URL" -o grimbird-geoip.dat
          curl -fL --retry 5 --retry-all-errors "$GOLOKON_GEOIP_URL" -o golukon-geoip.dat
          curl -fL --retry 5 --retry-all-errors "$LOYALSOLDIER_GEOIP_URL" -o loyalsoldier-geoip.dat

          curl -fL --retry 5 --retry-all-errors "$HYDRA_WHITELIST_URL" -o hydra-whitelist.txt
          curl -fL --retry 5 --retry-all-errors "$KIRILL_GEOIP_URL" -o kirill-geoip.dat
          curl -fL --retry 5 --retry-all-errors "$HXEHEX_WHITELIST_URL" -o hxehex-whitelist.txt

          curl -fL --retry 5 --retry-all-errors "$W1ZARDZ_RU_IP_URL" -o w1zardz-ru-ipv4.txt

          for file in \
            grimbird-geoip.dat \
            golukon-geoip.dat \
            loyalsoldier-geoip.dat \
            hydra-whitelist.txt \
            kirill-geoip.dat \
            hxehex-whitelist.txt \
            w1zardz-ru-ipv4.txt; do
            test -s "$file"
          done

          ls -lh \
            grimbird-geoip.dat \
            golukon-geoip.dat \
            loyalsoldier-geoip.dat \
            hydra-whitelist.txt \
            kirill-geoip.dat \
            hxehex-whitelist.txt \
            w1zardz-ru-ipv4.txt

      - name: Create client GeoIP aggregator
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p geoip-builder

          cat > geoip-builder/main.go <<'EOF'
          package main
          
          import (
          	"bufio"
          	"fmt"
          	"net/netip"
          	"os"
          	"sort"
          	"strings"
          
          	router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
          	"google.golang.org/protobuf/proto"
          )
          
          type trieNode struct {
          	covered bool
          	child   [2]*trieNode
          }
          
          type ipTrie struct {
          	v4 *trieNode
          }
          
          type sourceFile struct {
          	name string
          	path string
          	kind string
          }
          
          func newIPTrie() *ipTrie {
          	return &ipTrie{v4: &trieNode{}}
          }
          
          func normalizeName(value string) string {
          	return strings.ToLower(strings.TrimSpace(value))
          }
          
          func getBit(addr netip.Addr, pos int) int {
          	b := addr.As4()
          	return int((b[pos/8] >> (7 - (pos % 8))) & 1)
          }
          
          func setBit(addr netip.Addr, pos int) netip.Addr {
          	b := addr.As4()
          	b[pos/8] |= 1 << (7 - (pos % 8))
          	return netip.AddrFrom4(b)
          }
          
          func insert4(t *ipTrie, prefix netip.Prefix) {
          	if t == nil || !prefix.Addr().Is4() {
          		return
          	}
          
          	prefix = prefix.Masked()
          	addr := prefix.Addr()
          	bits := prefix.Bits()
          
          	curr := t.v4
          	for i := 0; i < bits; i++ {
          		if curr.covered {
          			return
          		}
          
          		b := getBit(addr, i)
          		if curr.child[b] == nil {
          			curr.child[b] = &trieNode{}
          		}
          		curr = curr.child[b]
          	}
          
          	curr.covered = true
          	curr.child[0] = nil
          	curr.child[1] = nil
          }
          
          func compressNode(n *trieNode) bool {
          	if n == nil {
          		return false
          	}
          
          	if n.covered {
          		n.child[0] = nil
          		n.child[1] = nil
          		return true
          	}
          
          	has0 := compressNode(n.child[0])
          	if !has0 {
          		n.child[0] = nil
          	}
          
          	has1 := compressNode(n.child[1])
          	if !has1 {
          		n.child[1] = nil
          	}
          
          	if n.child[0] != nil && n.child[0].covered &&
          		n.child[1] != nil && n.child[1].covered {
          		n.covered = true
          		n.child[0] = nil
          		n.child[1] = nil
          		return true
          	}
          
          	return n.child[0] != nil || n.child[1] != nil
          }
          
          func (t *ipTrie) compress() {
          	if t == nil {
          		return
          	}
          	if !compressNode(t.v4) {
          		t.v4 = &trieNode{}
          	}
          }
          
          func subtractNode(target *trieNode, mask *trieNode) {
          	if target == nil || mask == nil {
          		return
          	}
          
          	if mask.covered {
          		target.covered = false
          		target.child[0] = nil
          		target.child[1] = nil
          		return
          	}
          
          	if target.covered {
          		target.covered = false
          		target.child[0] = &trieNode{covered: true}
          		target.child[1] = &trieNode{covered: true}
          	}
          
          	if mask.child[0] != nil && target.child[0] != nil {
          		subtractNode(target.child[0], mask.child[0])
          	}
          
          	if mask.child[1] != nil && target.child[1] != nil {
          		subtractNode(target.child[1], mask.child[1])
          	}
          }
          
          func (t *ipTrie) subtract(mask *ipTrie) {
          	if t == nil || mask == nil {
          		return
          	}
          	subtractNode(t.v4, mask.v4)
          	t.compress()
          }
          
          func extractPrefixes(n *trieNode, currAddr netip.Addr, depth int, res *[]netip.Prefix) {
          	if n == nil {
          		return
          	}
          
          	if n.covered {
          		*res = append(*res, netip.PrefixFrom(currAddr, depth).Masked())
          		return
          	}
          
          	if depth >= 32 {
          		return
          	}
          
          	if n.child[0] != nil {
          		extractPrefixes(n.child[0], currAddr, depth+1, res)
          	}
          
          	if n.child[1] != nil {
          		nextAddr := setBit(currAddr, depth)
          		extractPrefixes(n.child[1], nextAddr, depth+1, res)
          	}
          }
          
          func (t *ipTrie) toPrefixes4() []netip.Prefix {
          	var res []netip.Prefix
          	if t == nil || t.v4 == nil {
          		return res
          	}
          
          	extractPrefixes(t.v4, netip.IPv4Unspecified(), 0, &res)
          	return res
          }
          
          func cidrPrefixV4(cidr *router.CIDR) (netip.Prefix, bool) {
          	if cidr == nil || len(cidr.Ip) != 4 || cidr.Prefix > 32 {
          		return netip.Prefix{}, false
          	}
          
          	var a4 [4]byte
          	copy(a4[:], cidr.Ip)
          
          	addr := netip.AddrFrom4(a4)
          	return netip.PrefixFrom(addr, int(cidr.Prefix)).Masked(), true
          }
          
          func loadGeoIP(path string) (*router.GeoIPList, error) {
          	data, err := os.ReadFile(path)
          	if err != nil {
          		return nil, err
          	}
          
          	list := new(router.GeoIPList)
          	if err := proto.Unmarshal(data, list); err != nil {
          		return nil, fmt.Errorf("invalid geoip %s: %w", path, err)
          	}
          
          	return list, nil
          }
          
          func loadTextPrefixes(trie *ipTrie, path string) (int, int, error) {
          	file, err := os.Open(path)
          	if err != nil {
          		return 0, 0, err
          	}
          	defer file.Close()
          
          	lines := 0
          	added := 0
          
          	scanner := bufio.NewScanner(file)
          	scanner.Buffer(make([]byte, 64*1024), 4*1024*1024)
          
          	for scanner.Scan() {
          		line := strings.TrimSpace(strings.TrimPrefix(scanner.Text(), "\ufeff"))
          		if line == "" || strings.HasPrefix(line, "#") {
          			continue
          		}
          
          		if idx := strings.IndexByte(line, '#'); idx >= 0 {
          			line = strings.TrimSpace(line[:idx])
          		}
          
          		upper := strings.ToUpper(line)
          		for _, prefix := range []string{"IP-CIDR,", "IP-CIDR6,", "IPSET,", "CIDR,"} {
          			if strings.HasPrefix(upper, prefix) {
          				line = strings.TrimSpace(line[len(prefix):])
          				break
          			}
          		}
          
          		fields := strings.FieldsFunc(line, func(r rune) bool {
          			return r == ' ' || r == '\t' || r == ',' || r == ';'
          		})
          
          		for _, field := range fields {
          			field = strings.Trim(field, "[](){}\"'")
          			if field == "" {
          				continue
          			}
          
          			if prefix, err := netip.ParsePrefix(field); err == nil {
          				lines++
          				if prefix.Addr().Is4() {
          					insert4(trie, prefix)
          					added++
          				}
          				break
          			}
          
          			if addr, err := netip.ParseAddr(field); err == nil {
          				lines++
          				if addr.Is4() {
          					insert4(trie, netip.PrefixFrom(addr, 32))
          					added++
          				}
          				break
          			}
          		}
          	}
          
          	if err := scanner.Err(); err != nil {
          		return lines, added, err
          	}
          
          	return lines, added, nil
          }
          
          func serviceCategory(source, category string) string {
          	source = normalizeName(source)
          	category = normalizeName(category)

          	if source == "grimbird" {
          		switch category {
          		case "ru", "ru-yandex", "ru-ozon", "ru-analytics",
          			"ru-banks", "ru-wildberries", "ru-payments",
          			"ru-vk", "ru-mts", "ru-cdn":
          			return "ru"
          		}
          	}

          	if source == "golukon" && category == "ru" {
          		return "ru"
          	}

          	if source == "loyalsoldier" && category == "ru" {
          		return "ru"
          	}

          	if source == "kirill" && category == "whitelist" {
          		return "ru"
          	}

          	return ""
          }

          func sortPrefixes(prefixes []netip.Prefix) []netip.Prefix {
          	sort.Slice(prefixes, func(i, j int) bool {
          		a, b := prefixes[i], prefixes[j]
          		if a.Addr().Compare(b.Addr()) != 0 {
          			return a.Addr().Compare(b.Addr()) < 0
          		}
          		return a.Bits() < b.Bits()
          	})
          	return prefixes
          }
          
          func writeOutput(categories map[string][]netip.Prefix, path string) ([]byte, error) {
          	result := new(router.GeoIPList)
          
          	names := make([]string, 0, len(categories))
          	for name := range categories {
          		names = append(names, name)
          	}
          	sort.Strings(names)
          
          	for _, name := range names {
          		prefixes := categories[name]
          		if len(prefixes) == 0 {
          			continue
          		}
          
          		prefixes = sortPrefixes(prefixes)
          
          		cidrs := make([]*router.CIDR, 0, len(prefixes))
          		for _, prefix := range prefixes {
          			a4 := prefix.Addr().As4()
          			cidrs = append(cidrs, &router.CIDR{
          				Ip:     []byte{a4[0], a4[1], a4[2], a4[3]},
          				Prefix: uint32(prefix.Bits()),
          			})
          		}
          
          		result.Entry = append(result.Entry, &router.GeoIP{
          			CountryCode: name,
          			Cidr:        cidrs,
          		})
          	}
          
          	data, err := proto.MarshalOptions{Deterministic: true}.Marshal(result)
          	if err != nil {
          		return nil, err
          	}
          
          	return data, os.WriteFile(path, data, 0644)
          }
          
          func writeManifest(path string, categories map[string][]netip.Prefix) error {
          	file, err := os.Create(path)
          	if err != nil {
          		return err
          	}
          	defer file.Close()
          
          	names := make([]string, 0, len(categories))
          	for name := range categories {
          		names = append(names, name)
          	}
          	sort.Strings(names)
          
          	for _, name := range names {
          		fmt.Fprintf(file, "%s\t%d\n", name, len(categories[name]))
          	}
          
          	return nil
          }
          
          func writeSources(path string) error {
          	text := `GeoIP Russia CLIENT v16 (IPv4 only, no PRIVATE):
          
          OUTPUT CATEGORIES:
          - ru: single merged IPv4 category containing all accepted Russian GeoIP, service-specific,
            whitelist-derived and separately validated Russian routes from the configured sources.
          
          INCLUDED SOURCES:
          - GrimbirdUsers/ru-routing-dat
          - golukon/russia-only-geoip
          - Loyalsoldier/geoip
          - hydraponique/roscomvpn-geoip (merged into ru)
          - kirilllavrov/RU-domain-list-for-whitelist (merged into ru)
          - hxehex/russia-mobile-internet-whitelist (merged into ru)
          - w1zardz/amnezia-vpn-russia-split-tunneling (service-derived RU IPv4)
          
          EXPLICITLY NOT USED:
          - runetfreedom/russia-blocked-geoip
          - antifilter / re-filter / RKN blocked-IP sources
          - foreign/global CDN ASN lists as standalone categories
          - IPv6 input
          - RFC1918 / CGNAT / loopback / link-local / multicast / reserved IPv4
          - PRIVATE output category
          
          Processing:
          1. Only IPv4 prefixes are accepted from every source.
          2. All accepted source prefixes are merged into the single ru category.
          3. Built-in special/private/reserved IPv4 ranges are subtracted from the output category.
          4. Adjacent and nested prefixes are coalesced with a radix trie.
          5. No BLOCK or PROXY addresses are injected into the ru category.
          `
          	return os.WriteFile(path, []byte(text), 0644)
          }
          
          func insertBuiltInPrivate(mask *ipTrie) {
          	for _, cidr := range []string{
          		"0.0.0.0/8",
          		"10.0.0.0/8",
          		"100.64.0.0/10",
          		"127.0.0.0/8",
          		"169.254.0.0/16",
          		"172.16.0.0/12",
          		"192.0.0.0/24",
          		"192.0.2.0/24",
          		"192.88.99.0/24",
          		"192.168.0.0/16",
          		"198.18.0.0/15",
          		"198.51.100.0/24",
          		"203.0.113.0/24",
          		"224.0.0.0/4",
          		"240.0.0.0/4",
          	} {
          		prefix, err := netip.ParsePrefix(cidr)
          		if err == nil {
          			insert4(mask, prefix)
          		}
          	}
          
          	mask.compress()
          }
          
          func main() {
          	if len(os.Args) != 11 {
          		fmt.Fprintf(os.Stderr, "usage: %s <grimbird> <golukon> <loyalsoldier> <hydra-whitelist> <kirill> <hxehex-whitelist> <w1zardz> <output> <manifest> <sources>\n", os.Args[0])
          		os.Exit(2)
          	}
          
          	grimbirdPath := os.Args[1]
          	golukonPath := os.Args[2]
          	loyalsoldierPath := os.Args[3]
          	hydraWhitelistPath := os.Args[4]
          	kirillPath := os.Args[5]
          	hxehexPath := os.Args[6]
          	w1zardzPath := os.Args[7]
          	outputPath := os.Args[8]
          	manifestPath := os.Args[9]
          	sourcesPath := os.Args[10]
          
          	sources := []sourceFile{
          		{"grimbird", grimbirdPath, "dat"},
          		{"golukon", golukonPath, "dat"},
          		{"loyalsoldier", loyalsoldierPath, "dat"},
          		{"hydra-whitelist", hydraWhitelistPath, "text"},
          		{"kirill", kirillPath, "dat"},
          		{"hxehex-whitelist", hxehexPath, "text"},
          		{"w1zardz", w1zardzPath, "text"},
          	}
          
          	categories := make(map[string]*ipTrie)
          
          	ensureCategory := func(name string) *ipTrie {
          		if categories[name] == nil {
          			categories[name] = newIPTrie()
          		}
          		return categories[name]
          	}
          
          	for _, source := range sources {
          		switch source.kind {
          		case "dat":
          			list, err := loadGeoIP(source.path)
          			if err != nil {
          				panic(fmt.Errorf("%s: %w", source.name, err))
          			}
          
          			srcAdded := 0
          			for _, entry := range list.Entry {
          				if entry == nil {
          					continue
          				}
          
          				target := serviceCategory(source.name, entry.CountryCode)
          				if target == "" {
          					continue
          				}
          
          				outTrie := ensureCategory(target)
          				for _, cidr := range entry.Cidr {
          					prefix, ok := cidrPrefixV4(cidr)
          					if !ok {
          						continue
          					}
          					insert4(outTrie, prefix)
          					srcAdded++
          				}
          			}
          
          			fmt.Printf("Loaded %-18s matched_ipv4_cidrs=%d\n", source.name, srcAdded)
          
          		case "text":
          			target := ""
          			switch source.name {
          			case "hydra-whitelist", "kirill", "hxehex-whitelist", "w1zardz":
          				target = "ru"
          			}
          
          			if target == "" {
          				continue
          			}
          
          			lines, added, err := loadTextPrefixes(ensureCategory(target), source.path)
          			if err != nil {
          				panic(fmt.Errorf("%s: %w", source.name, err))
          			}
          
          			fmt.Printf("Loaded %-18s lines=%d ipv4_cidrs=%d\n", source.name, lines, added)
          		}
          	}
          
          	privateMask := newIPTrie()
          	insertBuiltInPrivate(privateMask)
          
          	final := make(map[string][]netip.Prefix)
          	for name, trie := range categories {
          		trie.compress()
          		trie.subtract(privateMask)
          		trie.compress()
          
          		prefixes := trie.toPrefixes4()
          		if len(prefixes) > 0 {
          			final[name] = sortPrefixes(prefixes)
          		}
          	}
          
          	if len(final["ru"]) == 0 {
          		panic("ru category is empty")
          	}
          
          	data, err := writeOutput(final, outputPath)
          	if err != nil {
          		panic(fmt.Errorf("write output: %w", err))
          	}
          
          	if err := writeManifest(manifestPath, final); err != nil {
          		panic(fmt.Errorf("write manifest: %w", err))
          	}
          
          	if err := writeSources(sourcesPath); err != nil {
          		panic(fmt.Errorf("write sources: %w", err))
          	}
          
          	total := 0
          	for _, prefixes := range final {
          		total += len(prefixes)
          	}
          
          	fmt.Println()
          	fmt.Println("========================================")
          	fmt.Println("ULTIMATE GEOIP RUSSIA CLIENT v16")
          	fmt.Println("========================================")
          	fmt.Printf("Output categories      : %d\n", len(final))
          	fmt.Printf("Total minimal IPv4 CIDRs: %d\n", total)
          	fmt.Printf("Final file size        : %d bytes\n", len(data))
          }
          EOF

          gofmt -w geoip-builder/main.go

          cd geoip-builder
          GOFLAGS=-mod=mod go mod init geoip-builder
          GOFLAGS=-mod=mod go get github.com/v2fly/v2ray-core/v5/app/router/routercommon@latest
          GOFLAGS=-mod=mod go get google.golang.org/protobuf@latest
          GOFLAGS=-mod=mod go build -o /tmp/geoip-client-builder .
          cd ..

          /tmp/geoip-client-builder \
            grimbird-geoip.dat \
            golukon-geoip.dat \
            loyalsoldier-geoip.dat \
            hydra-whitelist.txt \
            kirill-geoip.dat \
            hxehex-whitelist.txt \
            w1zardz-ru-ipv4.txt \
            "$OUTPUT_FILE" \
            "$CATEGORY_FILE" \
            "$SOURCE_FILE"

          test -s "$OUTPUT_FILE"
          test -s "$CATEGORY_FILE"
          test -s "$SOURCE_FILE"

      - name: Validate final GeoIP CLIENT
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$OUTPUT_FILE" <<'PY'
          import sys

          path = sys.argv[1]
          data = open(path, "rb").read()

          if not data:
              raise SystemExit("output GeoIP is empty")

          if len(data) < 4:
              raise SystemExit("output GeoIP is unexpectedly small")

          # Protobuf-level validation without relying on a second parser implementation.
          # Also verify that the payload does not contain obvious IPv6-sized CIDR data
          # through the project manifest rather than inspecting protobuf internals here.
          print(f"Validated non-empty deterministic protobuf payload: {len(data)} bytes")
          PY

          echo "=== Categories ==="
          cat "$CATEGORY_FILE"

          if grep -Eqi '(^|[[:space:]])(PRIVATE|private|ipv6|::/|/128)' "$CATEGORY_FILE"; then
            echo "ERROR: manifest contains PRIVATE/IPv6 markers"
            exit 1
          fi

          echo "=== Sources ==="
          cat "$SOURCE_FILE"

          echo "=== SHA256 ==="
          sha256sum "$OUTPUT_FILE" > "$OUTPUT_SHA_FILE"
          cat "$OUTPUT_SHA_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-geoip-client-v16
          name: "Ultimate GeoIP Russia CLIENT v16"
          make_latest: false
          files: |
            geoip_RU.dat
            geoip_RU.dat.sha256sum
            geoip_RU_categories.txt
            geoip_RU_sources.txt
          body: |
            # Ultimate GeoIP Russia CLIENT v16

            IPv4-only GeoIP for Russian split-routing.

            ## Output categories

            - geoip:ru — single merged Russian IPv4 category containing all configured source ranges.

            ## Important

            - IPv6 is not included.
            - PRIVATE is not included as an output category.
            - RFC1918, CGNAT, loopback, link-local, multicast and reserved IPv4 are removed.
            - RKN / blocked / proxy lists are not merged into geoip:ru.
            - Whitelist-derived and service-derived source ranges are intentionally merged into geoip:ru.

      - name: Publish release branch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/geoip-client-release
          mkdir -p /tmp/geoip-client-release

          cp "$OUTPUT_FILE" /tmp/geoip-client-release/geoip_RU.dat
          cp "$OUTPUT_SHA_FILE" /tmp/geoip-client-release/geoip_RU.dat.sha256sum
          cp "$CATEGORY_FILE" /tmp/geoip-client-release/geoip_RU_categories.txt
          cp "$SOURCE_FILE" /tmp/geoip-client-release/geoip_RU_sources.txt

          cd /tmp/geoip-client-release
          git init
          git checkout -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Ultimate GeoIP Russia CLIENT v16"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push --force origin release

          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geoip_RU.dat" > /dev/null 2>&1 || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geoip_RU.dat.sha256sum" > /dev/null 2>&1 || true

      - name: Print download URLs
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "DOWNLOAD URLS"
          echo "========================================"
          echo
          echo "GitHub Release:"
          echo "https://github.com/${{ github.repository }}/releases/download/latest-geoip-client-v16/geoip_RU.dat"
          echo
          echo "Raw release branch:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/release/geoip_RU.dat"
          echo
          echo "jsDelivr:"
          echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geoip_RU.dat"
          echo
          echo "SHA256:"
          cat "$OUTPUT_SHA_FILE"
